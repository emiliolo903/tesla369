<script>


//////////////////////////////////////////////////
// EMI TESLA PRO V38
// BASE HISTORICA INDEXEDDB
//////////////////////////////////////////////////

const DB_NAME="EMI_TESLA_V38";

const DB_VERSION=1;

const STORE_NAME="historico";

let db=null;

let pararOCR=false;
 function abrirBase(){

return new Promise((resolve,reject)=>{


let request=indexedDB.open(
DB_NAME,
DB_VERSION
);



request.onupgradeneeded=function(e){


let base=e.target.result;



if(!base.objectStoreNames.contains(STORE_NAME)){


let tabla=base.createObjectStore(
STORE_NAME,
{
keyPath:"id",
autoIncrement:true
}
);



tabla.createIndex(
"provincia",
"provincia",
{unique:false}
);



tabla.createIndex(
"turno",
"turno",
{unique:false}
);



}


};




request.onsuccess=function(e){

db=e.target.result;

resolve(db);

};



request.onerror=function(e){

reject(e);

};



});


}






function guardarRegistro(datos){


return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readwrite"
);



let tabla=tx.objectStore(
STORE_NAME
);



tabla.add(datos);



tx.oncomplete=function(){

resolve(true);

};



tx.onerror=function(e){

reject(e);

};


});


}







function leerBase(){


return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readonly"
);



let tabla=tx.objectStore(
STORE_NAME
);



let datos=tabla.getAll();



datos.onsuccess=function(){

resolve(datos.result);

};



datos.onerror=function(e){

reject(e);

};



});


}






async function contarRegistros(){

let datos=await leerBase();

return datos.length;

}






function mostrar(texto){


document.getElementById(
"resultado"
).innerText=texto;


}





async function guardarManual(){


let texto=document.getElementById(
"numerosManual"
).value;



let provincia=document.getElementById(
"provinciaManual"
).value;



let turno=document.getElementById(
"turnoManual"
).value;



let numeros=texto.match(/\d{4}/g);



if(!numeros){

mostrar(
"⚠️ Ingrese números de 4 cifras"
);

return;

}




for(let numero of numeros){


await guardarRegistro({


fecha:new Date()
.toISOString()
.split("T")[0],


provincia,

turno,

numero,

origen:"MANUAL"


});


}




let total=await contarRegistros();



document.getElementById(
"total"
).innerText=total;



mostrar(

"✅ Datos guardados\n\n"+
"Registros: "+total

);


}



//////////////////////////////////////////////////
// OCR PDF HISTORICO
//////////////////////////////////////////////////


async function iniciarOCR(){


let archivo=document.getElementById(
"archivoPDF"
).files[0];



if(!archivo){

alert(
"Seleccione un PDF"
);

return;

}



try{


document.getElementById(
"estadoOCR"
).innerText="PROCESANDO";



let buffer=await archivo.arrayBuffer();



let pdf=await pdfjsLib.getDocument({

data:buffer

}).promise;



let worker=await Tesseract.createWorker(
"spa"
);
  for(let p=1;p<=pdf.numPages;p++){



if(pararOCR)

break;



let pagina=await pdf.getPage(p);



let viewport=pagina.getViewport({

scale:3

});



let canvas=document.createElement(
"canvas"
);



canvas.width=viewport.width;

canvas.height=viewport.height;



let ctx=canvas.getContext(
"2d"
);



await pagina.render({

canvasContext:ctx,

viewport

}).promise;




let lectura=await worker.recognize(
canvas
);



let texto=lectura.data.text.toUpperCase();



let numeros=texto.match(/\d{4}/g)||[];




let provincia=detectarProvincia(texto);



let turno=detectarTurno(texto);





for(let numero of numeros){


await guardarRegistro({


fecha:new Date()
.toISOString()
.split("T")[0],


provincia,

turno,

numero,

origen:"OCR"


});


}




document.getElementById(
"estadoOCR"
).innerText=

"Página "+p+" / "+pdf.numPages;



}




await worker.terminate();



let total=await contarRegistros();



document.getElementById(
"total"
).innerText=total;



mostrar(

"✅ OCR FINALIZADO\n\n"+
"Registros: "+total

);



}

catch(e){


mostrar(
"❌ Error OCR\n\n"+e
);


}



}



function detenerOCR(){

pararOCR=true;

}





function detectarProvincia(t){


if(t.includes("CORRIENTES"))
return "CORRIENTES";


if(t.includes("SANTA FE"))
return "SANTA FE";


if(t.includes("CORDOBA"))
return "CORDOBA";


if(t.includes("CHACO"))
return "CHACO";


if(t.includes("ENTRE RIOS"))
return "ENTRE RIOS";


if(t.includes("CIUDAD"))
return "CIUDAD";


if(t.includes("BONAERENSE"))
return "BONAERENSE";


return "DESCONOCIDA";


}





function detectarTurno(t){


if(t.includes("PREVIA"))
return "PREVIA";


if(t.includes("PRIMERA"))
return "PRIMERA";


if(t.includes("MATUTINA"))
return "MATUTINA";


if(t.includes("VESPERTINA"))
return "VESPERTINA";


if(t.includes("NOCTURNA"))
return "NOCTURNA";


return "DESCONOCIDO";


  }
//////////////////////////////////////////////////
// EMI TESLA PRO V38
// MOTOR IA POR TRANSICIÓN DE TURNOS
// CUATERNO - TERNO - AMBOS
//////////////////////////////////////////////////

async function generarJuegoCompletoIA(){


let datos = await leerBase();



if(datos.length < 5){

mostrar(
"⚠️ Falta historial para analizar"
);

return;

}



// Lee el último turno seleccionado
let turnoActual = 
document.getElementById("turnoManual").value;



let siguienteTurno = "";



if(turnoActual==="PREVIA")
siguienteTurno="PRIMERA";


if(turnoActual==="PRIMERA")
siguienteTurno="MATUTINA";


if(turnoActual==="MATUTINA")
siguienteTurno="VESPERTINA";


if(turnoActual==="VESPERTINA")
siguienteTurno="NOCTURNA";


if(turnoActual==="NOCTURNA")
siguienteTurno="PREVIA";





let cuaternos={};

let ternos={};

let ambos={};





for(let i=0;i<datos.length-1;i++){



let actual=datos[i];

let futuro=datos[i+1];




// Solo mira la transición correcta

if(
actual.turno===turnoActual &&
futuro.turno===siguienteTurno
){



let numero=futuro.numero;



if(!/^\d{4}$/.test(numero))
continue;




let peso=1;



// Más peso si pertenece a la misma provincia

let provincia=

document.getElementById(
"provinciaManual"
).value;



if(futuro.provincia===provincia)
peso+=3;





cuaternos[numero]=

(cuaternos[numero]||0)+peso;





let terno=

numero.slice(-3);



ternos[terno]=

(ternos[terno]||0)+peso;





let a=

numero.slice(-2);



ambos[a]=

(ambos[a]||0)+peso;



}



}






function ordenar(obj){

return Object.keys(obj)

.sort((a,b)=>

obj[b]-obj[a]

);

}





let listaCuaterno=

ordenar(cuaternos);



let listaTerno=

ordenar(ternos);



let listaAmbos=

ordenar(ambos);






mostrar(`

🧠 EMI TESLA PRO V38 IA



🔄 TRANSICIÓN

${turnoActual} ➜ ${siguienteTurno}



🎯 CUATERNO PRINCIPAL

${listaCuaterno[0]||"--"}



🟡 CUATERNO APOYO

${listaCuaterno[1]||"--"}



⚡ TERNO PRINCIPAL

${listaTerno[0]||"--"}



🟡 TERNO APOYO

${listaTerno[1]||"--"}



💥 AMBOS PRINCIPAL

${listaAmbos[0]||"--"}



🟡 AMBOS APOYO

${listaAmbos[1]||"--"}



📊 DATOS ANALIZADOS

${datos.length}



`);

}












//////////////////////////////////////////////////
// GENERADOR TESLA IA
//////////////////////////////////////////////////

async function generarTeslaIA(){

let datos=await leerBase();


if(datos.length===0){

mostrar(
"⚠️ Sin datos históricos"
);

return;

}



let mapa={};



datos.forEach(r=>{

let ambos=r.numero.slice(-2);


mapa[ambos]=(mapa[ambos]||0)+1;


});



let ranking=Object.keys(mapa)
.sort((a,b)=>mapa[b]-mapa[a]);



mostrar(`

🚀 TESLA IA V38


💥 AMBOS PRINCIPAL

${ranking[0]||"--"}


🟡 AMBOS APOYO

${ranking[1]||"--"}


⚡ TERCERA OPCIÓN

${ranking[2]||"--"}


📊 DATOS

${datos.length}

`);

}



//////////////////////////////////////////////////
// EMI TESLA PRO V38
// MATRIZ PROVINCIAL POR TRANSICIÓN
//////////////////////////////////////////////////

async function analizarMatriz(){

let datos=await leerBase();

if(datos.length<5){

mostrar("⚠️ No hay historial suficiente");

return;

}

let provincia=
document.getElementById("provinciaManual").value;

const ciclos={
"PREVIA":"PRIMERA",
"PRIMERA":"MATUTINA",
"MATUTINA":"VESPERTINA",
"VESPERTINA":"NOCTURNA",
"NOCTURNA":"PREVIA"
};

let salida="🌎 MATRIZ PROVINCIAL IA\n";
salida+="📍 "+provincia+"\n\n";

for(let origen in ciclos){

let destino=ciclos[origen];

let cuaternos={};
let ternos={};
let ambos={};

for(let i=0;i<datos.length-1;i++){

let actual=datos[i];
let siguiente=datos[i+1];

if(
actual.provincia===provincia &&
siguiente.provincia===provincia &&
actual.turno===origen &&
siguiente.turno===destino
){

let numero=siguiente.numero;

if(!/^\d{4}$/.test(numero))
continue;

cuaternos[numero]=(cuaternos[numero]||0)+1;

let t=numero.slice(-3);
ternos[t]=(ternos[t]||0)+1;

let a=numero.slice(-2);
ambos[a]=(ambos[a]||0)+1;

}

}

function mejor(obj){
return Object.keys(obj).sort((a,b)=>obj[b]-obj[a]);
}

let c=mejor(cuaternos);
let t=mejor(ternos);
let a=mejor(ambos);

salida+=
"🔄 "+origen+" ➜ "+destino+"\n";

salida+="Cuaterno: "+(c[0]||"--")+"\n";
salida+="Terno: "+(t[0]||"--")+"\n";
salida+="Ambos: "+(a[0]||"--")+"\n\n";

}

mostrar(salida);

}



//////////////////////////////////////////////////
// TRANSICIÓN - ACOMPAÑANTE - PATRONES
//////////////////////////////////////////////////

async function analizarTransicionIA(){

let datos=await leerBase();

let trans={};


for(let i=0;i<datos.length-1;i++){


let clave=
datos[i].turno+
" ➜ "+
datos[i+1].turno;


let ambos=datos[i+1].numero.slice(-2);


if(!trans[clave])
trans[clave]={};


trans[clave][ambos]=(trans[clave][ambos]||0)+1;


}


let salida="🔄 TRANSICIÓN IA\n\n";


Object.keys(trans).forEach(t=>{


salida+=t+"\n";


Object.keys(trans[t])
.sort((a,b)=>trans[t][b]-trans[t][a])
.slice(0,5)
.forEach(n=>{


salida+=" "+n+" = "+trans[t][n]+"\n";


});


});


mostrar(salida);

}





async function buscarAcompananteV2(){

let entrada=document.getElementById(
"numerosManual"
).value.trim();


if(!/^\d{4}$/.test(entrada)){

mostrar(
"⚠️ Ingrese un cuaterno de 4 cifras"
);

return;

}


let datos=await leerBase();


let ambos=entrada.slice(-2);


let acompañantes={};


datos.forEach(r=>{


if(r.numero.slice(-2)===ambos){


let cabeza=r.numero.slice(0,2);


acompañantes[cabeza]=(acompañantes[cabeza]||0)+1;


}


});



let ranking=Object.keys(acompañantes)
.sort((a,b)=>acompañantes[b]-acompañantes[a]);



mostrar(`

🎯 ACOMPAÑANTE EXACTO IA


BASE:

${entrada}


AMBOS:

${ambos}


🔥 PRINCIPAL:

${ranking[0]||"--"}${ambos}


🟡 APOYO:

${ranking[1]||"--"}${ambos}

`);

}





async function analizarPatrones(){

let datos=await leerBase();

let mapa={};


datos.forEach(r=>{


let ambos=r.numero.slice(-2);


mapa[ambos]=(mapa[ambos]||0)+1;


});


let salida="🔬 PATRONES HISTÓRICOS IA\n\n";


Object.keys(mapa)
.sort((a,b)=>mapa[b]-mapa[a])
.slice(0,20)
.forEach(n=>{


salida+=n+" = "+mapa[n]+" veces\n";


});


mostrar(salida);

}

Object.keys(mapa)
.sort((a,b)=>mapa[b]-mapa[a])
.slice(0,20)
.forEach(n=>{


salida+=n+" = "+mapa[n]+"\n";


});


mostrar(salida);

}
