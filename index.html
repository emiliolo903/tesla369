<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EMI Tesla PRO V28 ADVANCED</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
    font-family: Arial;
    background:#111;
    color:#fff;
    padding:15px;
}

button{
    padding:10px;
    margin:5px;
}

.box{
    border:1px solid #444;
    padding:10px;
    margin-top:10px;
    max-height:300px;
    overflow:auto;
    white-space:pre-wrap;
}
</style>
</head>

<body>

<h2>🚀 EMI Tesla PRO V28 ADVANCED</h2>

<input type="file" id="fileInput">

<br>

<button onclick="processPDF()">📄 Procesar PDF</button>
<button onclick="showDB()">💾 Ver Base</button>
<button onclick="predict()">🔮 Predicción AVANZADA</button>
<button onclick="clearDB()">🧹 Limpiar</button>

<div class="box" id="progress">Esperando...</div>
<div class="box" id="log"></div>
<div class="box" id="out"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

//////////////////////////////
// 💾 BASE PERSISTENTE
//////////////////////////////

let db = JSON.parse(localStorage.getItem("emi_db_v28") || "[]");

//////////////////////////////
// 📄 PDF → IMÁGENES → OCR
//////////////////////////////

async function processPDF(){

    const file = document.getElementById("fileInput").files[0];
    if(!file) return log("⚠️ Subí PDF");

    log("📄 Cargando PDF...");

    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;

    log("📄 Páginas: " + pdf.numPages);

    for(let i=1;i<=pdf.numPages;i++){

        document.getElementById("progress").innerText =
            `Procesando página ${i}/${pdf.numPages}`;

        const page = await pdf.getPage(i);
        const viewport = page.getViewport({scale:2});

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({canvasContext:ctx, viewport}).promise;

        const img = canvas.toDataURL("image/png");

        await runOCR(img, i);
    }

    localStorage.setItem("emi_db_v28", JSON.stringify(db));

    document.getElementById("progress").innerText =
        "✅ PDF procesado completo";

    log("💾 Base actual: " + db.length);
}

//////////////////////////////
// 👁️ OCR POR PÁGINA
//////////////////////////////

async function runOCR(img, page){

    const worker = await Tesseract.createWorker("eng");

    await worker.loadLanguage("eng+spa");
    await worker.initialize("eng+spa");

    const result = await worker.recognize(img);

    await worker.terminate();

    const text = result.data.text;

    parseText(text, page);
}

//////////////////////////////
// 🧠 PARSER INTELIGENTE
//////////////////////////////

function parseText(text, page){

    const lines = text.split("\n");

    lines.forEach(l => {

        const nums = l.match(/\d{4}/g);

        if(nums){

            let type = "DESCONOCIDO";

            if(l.toLowerCase().includes("previa")) type="PREVIA";
            if(l.toLowerCase().includes("matutina")) type="MATUTINA";
            if(l.toLowerCase().includes("vespertina")) type="VESPERTINA";
            if(l.toLowerCase().includes("nocturna")) type="NOCTURNA";

            db.push({
                pagina: page,
                tipo: type,
                numeros: nums
            });
        }
    });
}

//////////////////////////////
// 🔮 IA AVANZADA
//////////////////////////////

function predict(){

    let freq = {};
    let rec = db.slice(-30);

    db.forEach(d=>{
        d.numeros.forEach(n=>{
            freq[n] = (freq[n]||0)+1;
        });
    });

    let ranked = Object.entries(freq).map(([num,score])=>{

        let recencia = rec.filter(r=>r.numeros.includes(num)).length;

        return {
            num,
            score: score*5 + recencia*8
        };
    });

    ranked.sort((a,b)=>b.score-a.score);

    let top = ranked.slice(0,15);

    let cuaterno = top.slice(0,4).map(x=>x.num);
    let terno = top.slice(0,3).map(x=>x.num);
    let ambos = top.slice(0,6).map(x=>x.num);

    document.getElementById("out").innerText =
`
🔮 PREDICCIÓN AVANZADA V28

🔥 CUATERNO:
${cuaterno.join(" - ")}

⚡ TERNO:
${terno.join(" - ")}

💥 AMBOS:
${ambos.join(" - ")}
`;
}

//////////////////////////////
// 💾 MOSTRAR DB
//////////////////////////////

function showDB(){
    document.getElementById("out").innerText =
        JSON.stringify(db.slice(-10),null,2);
}

//////////////////////////////
// 🧹 LIMPIAR
//////////////////////////////

function clearDB(){
    db = [];
    localStorage.removeItem("emi_db_v28");
    document.getElementById("out").innerText="";
    log("🧹 base limpia");
}

//////////////////////////////
// 🖥️ LOG
//////////////////////////////

function log(m){
    document.getElementById("log").innerText += "\n"+m;
}

</script>

</body>
</html>
