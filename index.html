<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Tesla PRO V35</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
background:#111;
color:#fff;
font-family:Arial, sans-serif;
padding:15px;
}

h1{
color:#00ff99;
text-align:center;
}

.card{
background:#222;
border:1px solid #444;
border-radius:10px;
padding:15px;
margin:10px 0;
}

button,input,select{
padding:10px;
margin:5px;
border-radius:6px;
border:none;
}

button{
background:#00aa66;
color:white;
font-weight:bold;
}

button:hover{
background:#00dd88;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.stat{
background:#333;
padding:15px;
border-radius:8px;
text-align:center;
}

.progress{
width:100%;
height:20px;
background:#333;
border-radius:10px;
overflow:hidden;
}

#bar{
height:100%;
width:0%;
background:#00ff99;
}

.output{
background:#000;
padding:10px;
min-height:120px;
white-space:pre-wrap;
border-radius:8px;
}

</style>

</head>

<body>


<h1>🚀 EMI Tesla PRO V35</h1>


<div class="card">

<h2>📊 Dashboard</h2>

<div class="grid">

<div class="stat">
Registros
<br>
<span id="total">0</span>
</div>


<div class="stat">
Páginas PDF
<br>
<span id="paginas">0</span>
</div>


<div class="stat">
Estado
<br>
<span id="estado">Listo</span>
</div>


<div class="stat">
Versión
<br>
V35
</div>


</div>

</div>



<div class="card">

<h2>📄 Importar PDF OCR</h2>

<input type="file" id="pdf" accept=".pdf">

<br>

<button onclick="procesarPDF()">
🚀 Iniciar OCR
</button>


<button onclick="cancelar()">
⛔ Cancelar
</button>


<div class="progress">
<div id="bar"></div>
</div>


<p id="info">
Esperando archivo...
</p>


</div>



<div class="card">

<h2>✍️ Carga Manual</h2>


<select id="turno">

<option>PREVIA</option>
<option>PRIMERA</option>
<option>MATUTINA</option>
<option>VESPERTINA</option>
<option>NOCTURNA</option>

</select>


<input id="numeros" placeholder="Ej: 7134 2588 9001">


<button onclick="guardarManual()">
💾 Guardar
</button>


</div>



<div class="card">

<h2>🔎 Resultado</h2>

<div id="salida" class="output">

EMI Tesla PRO V35 iniciado

</div>

</div>
<script>

//////////////////////////////////////////////////
// BASE DE DATOS V35
//////////////////////////////////////////////////

let base =
JSON.parse(
localStorage.getItem("EMI_V35_DB") || "[]"
);


let cancelarOCR=false;



function guardarBase(){

localStorage.setItem(
"EMI_V35_DB",
JSON.stringify(base)
);

actualizarContador();

}




function actualizarContador(){

document.getElementById("total").innerText=
base.length;

}



function mostrar(texto){

document.getElementById(
"salida"
).innerText=texto;

}



//////////////////////////////////////////////////
// CARGA MANUAL
//////////////////////////////////////////////////


function guardarManual(){


let turno=
document.getElementById(
"turno"
).value;


let texto=
document.getElementById(
"numeros"
).value;



let numeros=
texto.match(
/\d{4}/g
);



if(!numeros){

alert(
"No hay números válidos"
);

return;

}



numeros.forEach(
n=>{


base.push({

fecha:
new Date()
.toISOString()
.split("T")[0],


turno:turno,


numero:n,


origen:"MANUAL"


});


}
);



guardarBase();



mostrar(

"✅ Guardado\n\n"+
"Turno: "+
turno+
"\n"+
"Números: "+
numeros.join(" - ")

);



}




//////////////////////////////////////////////////
// OCR PDF V35
//////////////////////////////////////////////////


async function procesarPDF(){


let archivo=
document.getElementById(
"pdf"
).files[0];



if(!archivo){

alert(
"Seleccione PDF"
);

return;

}



cancelarOCR=false;



document.getElementById(
"estado"
).innerText=
"Procesando";



let datos=
await archivo.arrayBuffer();



let pdf=
await pdfjsLib
.getDocument(
{
data:datos
}
)
.promise;



document.getElementById(
"paginas"
).innerText=
pdf.numPages;



mostrar(

"📄 PDF cargado\n"+
"Total páginas: "+
pdf.numPages

);





let worker=
await Tesseract
.createWorker(
"spa"
);





for(
let i=1;
i<=pdf.numPages;
i++
){


if(cancelarOCR)
break;



document.getElementById(
"info"
).innerText=

"Procesando página "+
i+
" de "+
pdf.numPages;




let pagina=
await pdf.getPage(
i
);



let vista=
pagina.getViewport(
{
scale:2
}
);



let canvas=
document.createElement(
"canvas"
);



canvas.width=
vista.width;



canvas.height=
vista.height;



await pagina.render({

canvasContext:
canvas.getContext("2d"),

viewport:vista

})
.promise;





let resultado=
await worker.recognize(
canvas
);



let texto=
resultado.data.text;



guardarOCR(
texto,
i
);





let porcentaje=
(i/pdf.numPages)*100;



document.getElementById(
"bar"
).style.width=
porcentaje+"%";



}



await worker.terminate();



guardarBase();



document.getElementById(
"estado"
).innerText=
"Finalizado";



document.getElementById(
"info"
).innerText=
"OCR terminado";


}




function cancelar(){

cancelarOCR=true;

mostrar(
"⛔ OCR cancelado"
);

}




//////////////////////////////////////////////////
// GUARDAR RESULTADO OCR
//////////////////////////////////////////////////


function guardarOCR(
texto,
pagina
){



let numeros=
texto.match(
/\d{4}/g
);



if(!numeros)
return;



let turno=
detectarTurno(
texto
);



numeros.forEach(
n=>{


base.push({

fecha:
new Date()
.toISOString()
.split("T")[0],


turno:turno,


numero:n,


pagina:pagina,


origen:"OCR"


});


}
);



}



//////////////////////////////////////////////////
// DETECTAR TURNO
//////////////////////////////////////////////////


function detectarTurno(texto){


let t=
texto.toUpperCase();



if(t.includes("PREVIA"))
return "PREVIA";


if(t.includes("PRIMERA"))
return "PRIMERA";


if(t.includes("MATUTINA"))
return "MATUTINA";


if(t.includes("VESPERTINA"))
return "VESPERTINA";


if(t.includes("NOCTURNA"))
return "NOCTURNA";



return "DESCONOCIDO";


}


actualizarContador();


  </script>
  <script>

//////////////////////////////////////////////////
// ANALISIS ESTADISTICO V35
//////////////////////////////////////////////////


function analizar(){

let turno=
prompt(
"Ingrese turno:\nPREVIA\nPRIMERA\nMATUTINA\nVESPERTINA\nNOCTURNA"
);



if(!turno)
return;



turno=
turno.toUpperCase();



let siguiente=
turnoSiguiente(
turno
);



let datos=
base.filter(
x=>
x.turno==siguiente
);



if(datos.length==0){

mostrar(
"No hay datos para analizar "+siguiente
);

return;

}



let frecuencia={};



datos.forEach(
r=>{


frecuencia[r.numero]=
(frecuencia[r.numero]||0)+1;


}
);



let ranking=
Object.entries(
frecuencia
)
.sort(
(a,b)=>b[1]-a[1]
)
.slice(0,20);



let cuaterno=
ranking
.slice(0,4)
.map(
x=>x[0]
);



let terno=
ranking
.slice(0,3)
.map(
x=>x[0].slice(1)
);



let ambos=
ranking
.slice(0,6)
.map(
x=>x[0].slice(2)
);




mostrar(

"🧠 EMI TESLA PRO V35\n\n"+

"Modelo:\n"+
turno+
" → "+
siguiente+

"\n\n🔥 CUATERNO:\n"+
cuaterno.join(" - ")

+

"\n\n⚡ TERNO:\n"+
terno.join(" - ")

+

"\n\n💥 AMBOS:\n"+
ambos.join(" - ")

+

"\n\n📊 Datos usados: "+
datos.length

);


}





function turnoSiguiente(t){


let mapa={

"PREVIA":"PRIMERA",

"PRIMERA":"MATUTINA",

"MATUTINA":"VESPERTINA",

"VESPERTINA":"NOCTURNA",

"NOCTURNA":"PREVIA"

};



return mapa[t] || "";

}




//////////////////////////////////////////////////
// RESUMEN BASE
//////////////////////////////////////////////////


function resumen(){


let frecuencia={};



base.forEach(
r=>{


frecuencia[r.numero]=
(frecuencia[r.numero]||0)+1;


}
);



let top=
Object.entries(
frecuencia
)
.sort(
(a,b)=>b[1]-a[1]
)
.slice(0,10);



mostrar(

"📊 RESUMEN BASE V35\n\n"+

"Total registros: "+
base.length+

"\n\n🔥 Más frecuentes:\n"+

JSON.stringify(
top,
null,
2
)

);


}




//////////////////////////////////////////////////
// BACKUP
//////////////////////////////////////////////////


function exportar(){


let blob=
new Blob(
[
JSON.stringify(
base,
null,
2
)
],
{
type:"application/json"
}
);



let a=
document.createElement(
"a"
);



a.href=
URL.createObjectURL(
blob
);



a.download=
"EMI_TESLA_V35_BACKUP.json";



a.click();



mostrar(
"💾 Backup creado"
);


}





//////////////////////////////////////////////////
// INICIO
//////////////////////////////////////////////////


mostrar(

"🚀 EMI Tesla PRO V35 listo\n\n"+
"Base: "+
base.length+
" registros"

);



</script>


<div class="card">

<h2>🧠 Análisis</h2>

<button onclick="analizar()">
Generar análisis
</button>


<button onclick="resumen()">
Resumen base
</button>


<button onclick="exportar()">
Backup
</button>


</div>


</body>

</html>
