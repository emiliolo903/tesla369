const DB_NAME="EMI_TESLA_INDEX32";

const DB_VERSION=1;


const STORES={

historico:"historico",

memoria:"memoriaIA",

predicciones:"prediccionesIA",

aprendizaje:"aprendizajeIA",

estadisticas:"estadisticasIA"

};



let db=null;



//////////////////////////////////////////////////
// ABRIR BASE
//////////////////////////////////////////////////

function abrirBase(){


return new Promise((resolve,reject)=>{


let request=

indexedDB.open(
DB_NAME,
DB_VERSION
);



request.onupgradeneeded=function(e){


let base=e.target.result;



Object.values(STORES)
.forEach(nombre=>{


if(!base.objectStoreNames.contains(nombre)){


base.createObjectStore(
nombre,
{
keyPath:"id",
autoIncrement:true
}
);


}



});



};



request.onsuccess=function(e){


db=e.target.result;



let estado=

document.getElementById(
"estadoBase"
);



if(estado){

estado.innerText="ACTIVA";

}



resolve(true);



};



request.onerror=function(e){


reject(e);


};



});

}





//////////////////////////////////////////////////
// GUARDAR DATOS
//////////////////////////////////////////////////

function guardarDato(store,datos){


return new Promise((resolve,reject)=>{


let tx=

db.transaction(
store,
"readwrite"
);



let tabla=

tx.objectStore(store);



tabla.add(datos);



tx.oncomplete=function(){

resolve(true);

};



tx.onerror=function(e){

reject(e);

};



});


}





//////////////////////////////////////////////////
// LEER DATOS
//////////////////////////////////////////////////

function leerDatos(store){


return new Promise((resolve,reject)=>{


let tx=

db.transaction(
store,
"readonly"
);



let tabla=

tx.objectStore(store);



let consulta=

tabla.getAll();



consulta.onsuccess=function(){


resolve(
consulta.result
);


};



consulta.onerror=function(e){


reject(e);


};



});


}





//////////////////////////////////////////////////
// GUARDAR HISTÓRICO
//////////////////////////////////////////////////

function guardarHistorico(registro){


return guardarDato(

STORES.historico,

registro

);


}

valor.replace(/\D/g,"");



if(limpio.length!==4)

return limpio;


}

function detectarProvincia(texto){


texto=

texto.includes("ENTRE RÍOS"))

return "DESCONOCIDA";


}





function detectarTurno(texto){


texto=

texto.toUpperCase();

return "PRIMERA";


if(texto.includes("MATUTINA"))

return "MATUTINA";


if(texto.includes("VESPERTINA"))

return "VESPERTINA";


if(texto.includes("NOCTURNA"))

return "NOCTURNA";


return null;


}

function detectarFechaOCR(texto){
function detectarFechaOCR(texto){

    texto = texto.replace(/\s+/g," ");

    let buscar = texto.match(
        /\d{2}[\/\-]\d{2}[\/\-]\d{4}/
    );

    if(buscar){

        let p = buscar[0]
            .replace(/\-/g,"/")
            .split("/");

        return p[2]+"-"+p[1]+"-"+p[0];
    }

    return "SIN_FECHA";

}




function extraerNumeros(texto){

let numeros =
texto.match(/\b\d{1,4}\b/g)||[];


numeros =
numeros
.map(n=>n.padStart(4,"0"))
.filter(n=>n.length===4);


return numeros;

}

function separarPorProvincia(texto){

let resultado=[];


let provincias=[

"CORRIENTES",
"CIUDAD",
"BONAERENSE",
"SANTA FE",
"CORDOBA",
"ENTRE RIOS",
"CHACO"

];


for(let i=0;i<provincias.length;i++){


let actual=provincias[i];


let inicio=
texto.indexOf(actual);



if(inicio===-1)
continue;



let fin=texto.length;


for(let j=i+1;j<provincias.length;j++){


let siguiente=
texto.indexOf(provincias[j]);


if(siguiente>inicio){

fin=siguiente;
break;

}


}



let bloqueTexto=
texto.substring(inicio,fin);



let numeros=
bloqueTexto.match(/\b\d{4}\b/g)||[];



resultado.push({

provincia:actual,

numeros:numeros


});


}


return resultado;


  }

);

const DB_NAME="EMI_TESLA_INDEX32";

const DB_VERSION=1;


const STORES={

historico:"historico",

memoria:"memoriaIA",

predicciones:"prediccionesIA",

aprendizaje:"aprendizajeIA",

estadisticas:"estadisticasIA"

};



let db=null;



//////////////////////////////////////////////////
// ABRIR BASE
//////////////////////////////////////////////////

function abrirBase(){


return new Promise((resolve,reject)=>{


let request=

indexedDB.open(
DB_NAME,
DB_VERSION
);



request.onupgradeneeded=function(e){


let base=e.target.result;



Object.values(STORES)
.forEach(nombre=>{


if(!base.objectStoreNames.contains(nombre)){


base.createObjectStore(
nombre,
{
keyPath:"id",
autoIncrement:true
}
);


}



});



};



request.onsuccess=function(e){


db=e.target.result;



let estado=

document.getElementById(
"estadoBase"
);



if(estado){

estado.innerText="ACTIVA";

}



resolve(true);



};



request.onerror=function(e){


reject(e);


};



});

}





//////////////////////////////////////////////////
// GUARDAR DATOS
//////////////////////////////////////////////////

function guardarDato(store,datos){


return new Promise((resolve,reject)=>{


let tx=

db.transaction(
store,
"readwrite"
);



let tabla=

tx.objectStore(store);



tabla.add(datos);



tx.oncomplete=function(){

resolve(true);

};



tx.onerror=function(e){

reject(e);

};



});


}





//////////////////////////////////////////////////
// LEER DATOS
//////////////////////////////////////////////////

function leerDatos(store){


return new Promise((resolve,reject)=>{


let tx=

db.transaction(
store,
"readonly"
);



let tabla=

tx.objectStore(store);



let consulta=

tabla.getAll();



consulta.onsuccess=function(){


resolve(
consulta.result
);


};



consulta.onerror=function(e){


reject(e);


};



});


}

if(!valor)

return null;



let limpio=

valor.replace(/\D/g,"");



if(limpio.length!==4)

return null;



return limpio;


}

let OCR_ACTIVO=false;



let resumenOCR={

PREVIA:0,

PRIMERA:0,

MATUTINA:0,

VESPERTINA:0,

NOCTURNA:0

};





function detectarProvincia(texto){


texto=

texto.toUpperCase();



if(texto.includes("CORRIENTES"))

return "CORRIENTES";


if(texto.includes("CIUDAD"))

return "CIUDAD";


if(texto.includes("BONAERENSE"))

return "BONAERENSE";


if(texto.includes("SANTA FE"))

return "SANTA FE";


if(texto.includes("CORDOBA") ||
texto.includes("CÓRDOBA"))

return "CORDOBA";


if(texto.includes("ENTRE RIOS") ||
texto.includes("ENTRE RÍOS"))

return "ENTRE RIOS";


if(texto.includes("CHACO"))

return "CHACO";



return "DESCONOCIDA";


}





function detectarTurno(texto){


texto=

texto.toUpperCase();



if(texto.includes("PREVIA"))

return "PREVIA";


if(texto.includes("PRIMERA"))

return "PRIMERA";


if(texto.includes("MATUTINA"))

return "MATUTINA";


if(texto.includes("VESPERTINA"))

return "VESPERTINA";


if(texto.includes("NOCTURNA"))

return "NOCTURNA";


return null;


}

function detectarFechaOCR(texto){

let fecha = new Date()
.toISOString()
.slice(0,10);

let buscar =
texto.match(/\d{2}[\/\-]\d{2}[\/\-]\d{4}/);

if(buscar){

let partes =
buscar[0].replace(/\-/g,"/").split("/");

fecha =
partes[2]+"-"+partes[1]+"-"+partes[0];

}

return fecha;

  }




function extraerNumeros(texto){

let numeros =
texto.match(/\b\d{1,4}\b/g)||[];


numeros =
numeros
.map(n=>n.padStart(4,"0"))
.filter(n=>n.length===4);


return numeros;

}










async function procesarPaginaOCR(texto,pagina){



let provincia=

detectarProvincia(texto);



let turno=

detectarTurno(texto);



let numeros=

extraerNumeros(texto);



for(let numero of numeros){



await guardarHistorico({

fecha:

new Date()
.toISOString()
.slice(0,10),


pagina:


pagina,


provincia:


provincia,


turno:


turno || "SIN_TURNO",


numero:


numero,


origen:


"OCR_PDF"


});



if(turno){

resumenOCR[turno]++;

}


}



}




let pararOCR=false;

async function iniciarOCR(){

let archivo =
document.getElementById("archivoPDF").files[0];


if(!archivo){

mostrar("⚠️ Seleccione PDF");

return;

}


try{

pararOCR=false;


let buffer =
await archivo.arrayBuffer();


let pdf =
await pdfjsLib
.getDocument({
data:buffer
})
.promise;



let worker =
await Tesseract.createWorker("spa");


let totalRegistros=0;


let conteoTurnos={

PREVIA:0,
PRIMERA:0,
MATUTINA:0,
VESPERTINA:0,
NOCTURNA:0,
SIN_TURNO:0

};



for(let pagina=1; pagina<=pdf.numPages; pagina++){


if(pararOCR) break;



mostrar(`

📄 OCR HISTÓRICO V45.1

Procesando página:

${pagina} / ${pdf.numPages}


Registros encontrados:

${totalRegistros}

`);




let page =
await pdf.getPage(pagina);



let viewport =
page.getViewport({
scale:3
});



let canvas =
document.createElement("canvas");


canvas.width =
viewport.width;


canvas.height =
viewport.height;



let ctx =
canvas.getContext("2d");



await page.render({

canvasContext:ctx,

viewport

}).promise;



let lectura =
await worker.recognize(canvas);



let texto =
lectura.data.text.toUpperCase();


let turno =
detectarTurno(texto);


if(conteoTurnos[turno]!==undefined){

conteoTurnos[turno]++;

}



let fecha =
detectarFechaOCR(texto);



let bloquesProvincia = separarPorProvincia(texto);


for(let bloque of bloquesProvincia){


for(let numero of bloque.numeros){


await guardarHistorico({

fecha,

turno,

provincia:
bloque.provincia,

numero,

origen:
"OCR_PROVINCIA",

pagina:pagina

});


totalRegistros++;


}


}


function separarPorProvincia(texto){

let resultado=[];


let provincias=[

"CORRIENTES",
"CIUDAD",
"BONAERENSE",
"SANTA FE",
"CORDOBA",
"ENTRE RIOS",
"CHACO"

];


for(let i=0;i<provincias.length;i++){


let actual=provincias[i];


let inicio=
texto.indexOf(actual);



if(inicio===-1)
continue;



let fin=texto.length;


for(let j=i+1;j<provincias.length;j++){


let siguiente=
texto.indexOf(provincias[j]);


if(siguiente>inicio){

fin=siguiente;
break;

}


}



let bloqueTexto=
texto.substring(inicio,fin);



let numeros=
bloqueTexto.match(/\b\d{4}\b/g)||[];



resultado.push({

provincia:actual,

numeros:numeros


});


}


return resultado;


  }




}



await worker.terminate();



let total =
(await leerDatos(STORES.historico)).length;


document.getElementById("totalRegistros").innerText=total;

mostrar(`

✅ PDF FINALIZADO


Páginas:

${pdf.numPages}


Registros nuevos:

${totalRegistros}


BASE TOTAL:

${total}


📊 TURNOS

PREVIA:
${conteoTurnos.PREVIA}

PRIMERA:
${conteoTurnos.PRIMERA}

MATUTINA:
${conteoTurnos.MATUTINA}

VESPERTINA:
${conteoTurnos.VESPERTINA}

NOCTURNA:
${conteoTurnos.NOCTURNA}


`);




}catch(e){


mostrar(
"❌ ERROR OCR\n"+e
);


}


}

pararOCR=true;

mostrar("⛔ OCR detenido");

  }

let MODELO_IA={};



let MATRIZ_TURNOS={};



let MATRIZ_PROVINCIAS={};



let ACOMPANANTES={};






async function aprenderIA(){



let datos=

await leerDatos(
STORES.historico
);



MODELO_IA={};



MATRIZ_TURNOS={};



MATRIZ_PROVINCIAS={};



ACOMPANANTES={};





for(let item of datos){



let ambos=

String(item.numero)
.slice(-2);



let turno=

item.turno;



let provincia=

item.provincia;




// TURNO


if(!MODELO_IA[turno])

MODELO_IA[turno]={};



MODELO_IA[turno][ambos]=

(MODELO_IA[turno][ambos]||0)+1;





// PROVINCIA


if(!MATRIZ_PROVINCIAS[provincia])

MATRIZ_PROVINCIAS[provincia]={};



MATRIZ_PROVINCIAS[provincia][ambos]=

(MATRIZ_PROVINCIAS[provincia][ambos]||0)+1;






// ACOMPAÑANTES


let invertido=

ambos[1]+ambos[0];



if(!ACOMPANANTES[ambos])

ACOMPANANTES[ambos]={};



ACOMPANANTES[ambos][invertido]=

(ACOMPANANTES[ambos][invertido]||0)+1;



}




await guardarDato(

STORES.aprendizaje,

{

fecha:new Date()
.toISOString(),

estado:"APRENDIZAJE_COMPLETO",

registros:datos.length

}

);



document.getElementById(
"estadoIA"
).innerText="ACTIVA";



return true;



}





async function construirContinuidad(){



let datos=

await leerDatos(
STORES.historico
);



for(let i=0;
i<datos.length-1;
i++){



let actual=

datos[i];



let siguiente=

datos[i+1];



let clave=

actual.turno+
" → "+
siguiente.turno;



if(!MATRIZ_TURNOS[clave])

MATRIZ_TURNOS[clave]={};



let ambos=

String(siguiente.numero)
.slice(-2);



MATRIZ_TURNOS[clave][ambos]=

(MATRIZ_TURNOS[clave][ambos]||0)+1;



}



}



async function cargarTodoIA(){


await aprenderIA();


await construirContinuidad();



return true;


}

const TESLA_MAP={


0:["0","0"],

6:["4","9"],

function aplicarTesla(numero){



let salida="";



for(let digito of numero){



if(TESLA_MAP[digito]){


salida+=TESLA_MAP[digito][0];


}



}



return salida;


}







async function rankingAmbos(){



let datos=

await leerDatos(
STORES.historico
);



let ranking={};



for(let item of datos){


let numero=

String(item.numero);



let ambos=

numero.slice(-2);



ranking[ambos]=

(ranking[ambos]||0)+1;



}



return Object.keys(ranking)

.sort(

(a,b)=>

ranking[b]-ranking[a]

);



}







async function generarAmbosIA(){



let ranking=

await rankingAmbos();



let salida=[];



for(let n of ranking){



if(!salida.includes(n)){



salida.push(n);



}



if(salida.length>=5)

break;



}



return salida;



}








function generarTernos(ambos){

}








function generarCuaternos(ambos){
