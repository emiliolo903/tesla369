<script>

//////////////////////////////////////////////////
// BASE HISTÓRICA MULTIPROVINCIA V36
//////////////////////////////////////////////////

const DB_KEY="EMI_TESLA_V36_IA_DB";

let base=[];

let pararOCR=false;



try{

base=JSON.parse(
localStorage.getItem(DB_KEY)||"[]"
);


if(!Array.isArray(base)){

base=[];

}


}catch(e){

base=[];

}





//////////////////////////////////////////////////
// MOSTRAR
//////////////////////////////////////////////////

function mostrar(texto){

let salida=document.getElementById("resultado");

if(salida){

salida.innerText=texto;

}

}




//////////////////////////////////////////////////
// ESTADO
//////////////////////////////////////////////////

function actualizarEstado(){

let total=document.getElementById("total");

if(total){

total.innerText=base.length;

}

}





//////////////////////////////////////////////////
// GUARDAR BASE
//////////////////////////////////////////////////

function guardarBase(){

localStorage.setItem(

DB_KEY,

JSON.stringify(base)

);


actualizarEstado();


}







//////////////////////////////////////////////////
// DUPLICADOS
//////////////////////////////////////////////////

function existeRegistro(r){


return base.some(x=>

x.fecha===r.fecha &&

x.turno===r.turno &&

x.provincia===r.provincia &&

x.numero===r.numero


);


}





//////////////////////////////////////////////////
// AGREGAR REGISTRO
//////////////////////////////////////////////////

function agregarRegistro(r){


if(!existeRegistro(r)){


base.push(r);


return true;


}


return false;


}





//////////////////////////////////////////////////
// OCR PDF V36 IA
//////////////////////////////////////////////////

async function iniciarOCR(){


let archivo=

document.getElementById("archivoPDF").files[0];



if(!archivo){

alert("Seleccione PDF");

return;

}



pararOCR=false;



mostrar(
"📄 Procesando PDF..."
);



let provincia=

document.getElementById("provincia").value;



document.getElementById("provActual").innerText=

provincia;





let datos=

await archivo.arrayBuffer();



let pdf=

await pdfjsLib.getDocument({

data:datos

}).promise;





document.getElementById("paginas").innerText=

pdf.numPages;





let worker=

await Tesseract.createWorker("spa");





for(

let pagina=1;

pagina<=pdf.numPages;

pagina++

){


if(pararOCR)

break;



let page=

await pdf.getPage(pagina);



let viewport=

page.getViewport({

scale:2

});



let canvas=

document.createElement("canvas");



canvas.width=

viewport.width;


canvas.height=

viewport.height;





await page.render({

canvasContext:

canvas.getContext("2d"),

viewport

}).promise;





let texto=

await worker.recognize(canvas);





guardarOCR(

texto.data.text,

pagina,

provincia

);






document.getElementById("barra").style.width=

((pagina/pdf.numPages)*100)+"%";



}




await worker.terminate();



guardarBase();



mostrar(

"✅ OCR terminado\n\n"+
"Registros: "+
base.length

);



}







function detenerOCR(){

pararOCR=true;

mostrar(
"⛔ OCR detenido"
);

}





//////////////////////////////////////////////////
// GUARDAR OCR
//////////////////////////////////////////////////

function guardarOCR(

texto,

pagina,

provincia

){


let numeros=

texto.match(/\b\d{4}\b/g)||[];




let turno=

detectarTurno(texto);





let fecha=

new Date()

.toISOString()

.split("T")[0];





numeros.forEach(numero=>{


agregarRegistro({

fecha,

provincia,

turno,

numero,

pagina,

origen:"OCR"


});



});



}





//////////////////////////////////////////////////
// DETECTAR TURNO
//////////////////////////////////////////////////

function detectarTurno(texto){


let t=

texto.toUpperCase();



if(t.includes("PREV"))

return "PREVIA";


if(t.includes("PRIMER"))

return "PRIMERA";


if(t.includes("MATU"))

return "MATUTINA";


if(t.includes("VES"))

return "VESPERTINA";


if(t.includes("NOC"))

return "NOCTURNA";



return "DESCONOCIDO";


}
  //////////////////////////////////////////////////
// CARGA MANUAL V36 IA
//////////////////////////////////////////////////

function guardarManual(){


let provincia=document.getElementById("provincia").value;

let turno=document.getElementById("turnoManual").value;

let texto=document.getElementById("numerosManual").value;



let numeros=texto.match(/\d{4}/g);



if(!numeros){

mostrar("⚠️ Ingrese números de 4 cifras");

return;

}




let fecha=new Date()
.toISOString()
.split("T")[0];



let nuevos=0;



numeros.forEach(numero=>{


if(agregarRegistro({

fecha,
provincia,
turno,
numero,
origen:"MANUAL"

})){

nuevos++;

}


});




guardarBase();



mostrar(

`✅ DATOS GUARDADOS

Provincia:
${provincia}

Turno:
${turno}

Nuevos:
${nuevos}


🧠 Analizando transición...`

);



analizarTransicion(turno);



}






//////////////////////////////////////////////////
// TRANSICIONES V36
//////////////////////////////////////////////////

const ORDEN_TURNOS=[

"PREVIA",
"PRIMERA",
"MATUTINA",
"VESPERTINA",
"NOCTURNA"

];




function turnoSiguiente(turno){


let pos=ORDEN_TURNOS.indexOf(turno);


if(pos===4)

return "PREVIA";


return ORDEN_TURNOS[pos+1];


}







function analizarTransicion(origen){


let destino=turnoSiguiente(origen);



let datos=base.filter(r=>

r.turno===destino

);



if(datos.length<3){


mostrar(

`⚠️ Poco historial

${origen}
↓

${destino}

Registros:
${datos.length}`

);


return;

}



calcularRankingV36(

datos,

origen,

destino

);


}







//////////////////////////////////////////////////
// MOTOR PUNTAJE IA V36 MEJORADO
//////////////////////////////////////////////////

function calcularRankingV36(

datos,

origen,

destino

){



let puntos={};

let terminaciones={};





datos.forEach(r=>{


let numero=r.numero;



if(!/^\d{4}$/.test(numero))

return;





puntos[numero]=

(puntos[numero]||0);




// frecuencia histórica

puntos[numero]+=40;



// transición

puntos[numero]+=25;




// reciente

let dias=

(Date.now()-new Date(r.fecha))

/86400000;



puntos[numero]+=

20/Math.max(1,dias);





let ambos=

numero.slice(-2);



terminaciones[ambos]=

(terminaciones[ambos]||0)+1;




});







Object.keys(puntos).forEach(numero=>{


let ambos=

numero.slice(-2);



puntos[numero]+=

(terminaciones[ambos]||0)*15;



});






let ranking=

Object.keys(puntos)

.map(numero=>({


numero,

puntaje:puntos[numero]


}))


.sort((a,b)=>

b.puntaje-a.puntaje

);





generarResultadoV36(

ranking,

origen,

destino,

datos.length

);


}








//////////////////////////////////////////////////
// GENERADOR INTELIGENTE V36
//////////////////////////////////////////////////

function generarResultadoV36(

ranking,

origen,

destino,

cantidad

){


if(!ranking.length){

mostrar("⚠️ Sin datos");

return;

}



let principal=

ranking[0].numero;



let apoyo=

ranking[1] ?

ranking[1].numero :

principal;






mostrar(`

🧠 EMI TESLA PRO V36 IA


MODELO:

${origen}

↓

${destino}



🔥 CUATERNO PRINCIPAL

${principal}



🟡 CUATERNO APOYO

${apoyo}



⚡ TERNO PRINCIPAL

${principal.slice(-3)}



🟡 TERNO APOYO

${apoyo.slice(-3)}



💥 AMBOS PRINCIPAL

${principal.slice(-2)}



🟡 AMBOS APOYO

${apoyo.slice(-2)}



📊 DATOS ANALIZADOS

${cantidad}


`);



  }
  //////////////////////////////////////////////////
// MATRIZ PROVINCIAS V36
//////////////////////////////////////////////////

function matrizProvincias(){


let matriz={};



base.forEach(r=>{


if(!matriz[r.provincia]){

matriz[r.provincia]={};

}



let ambos=

r.numero.slice(-2);



matriz[r.provincia][ambos]=

(matriz[r.provincia][ambos]||0)+1;



});





let texto=

"🌎 MATRIZ PROVINCIAS V36\n\n";




Object.keys(matriz).forEach(prov=>{


texto+=

"📍 "+prov+"\n";



let top=

Object.entries(matriz[prov])

.sort((a,b)=>b[1]-a[1])

.slice(0,5);



top.forEach(x=>{


texto+=

x[0]+" → "+x[1]+" veces\n";


});



texto+="\n";


});





mostrar(texto);


}







//////////////////////////////////////////////////
// NUCLEOS V36
//////////////////////////////////////////////////

function analizarNucleos(){


let nucleos={};



base.forEach(r=>{


let ambos=

r.numero.slice(-2);



let invertido=

ambos[1]+ambos[0];




nucleos[ambos]=

(nucleos[ambos]||0)+1;



nucleos[invertido]=

(nucleos[invertido]||0)+0.5;



});







let ranking=

Object.entries(nucleos)

.sort((a,b)=>b[1]-a[1])

.slice(0,20);





mostrar(

`🧠 NÚCLEOS DOMINANTES V36


${

ranking.map(x=>

x[0]+" = "+x[1]

).join("\n")

}

`

);



}







//////////////////////////////////////////////////
// TERMINACIONES ENTRE PROVINCIAS
//////////////////////////////////////////////////

function compararProvincias(){


let grupos={};



base.forEach(r=>{


let ambos=r.numero.slice(-2);



if(!grupos[ambos]){

grupos[ambos]=[];

}



grupos[ambos].push(r.provincia);



});





let texto=

"🔄 COINCIDENCIAS ENTRE PROVINCIAS\n\n";




Object.keys(grupos).forEach(x=>{


if(grupos[x].length>1){


texto+=

x+" aparece en: "+

[...new Set(grupos[x])]

.join(", ")

+"\n";


}


});



mostrar(texto);



}
  //////////////////////////////////////////////////
// ACOMPAÑANTES HISTÓRICOS V36
//////////////////////////////////////////////////

function analizarAcompanantes(){

let relaciones={};



base.forEach(r=>{


let ambos=r.numero.slice(-2);



if(!relaciones[ambos]){

relaciones[ambos]={};

}



base.forEach(x=>{


if(

x.numero!==r.numero &&

x.turno===r.turno

){


let otro=x.numero.slice(-2);



relaciones[ambos][otro]=

(relaciones[ambos][otro]||0)+1;


}


});


});





let texto=

"🧠 ACOMPAÑANTES HISTÓRICOS V36\n\n";





Object.keys(relaciones).forEach(a=>{


let top=

Object.entries(relaciones[a])

.sort((x,y)=>y[1]-x[1])

.slice(0,5);



texto+=

"🔥 Núcleo "+a+"\n";



top.forEach(t=>{


texto+=

"→ "+t[0]+" ("+t[1]+" veces)\n";


});


texto+="\n";


});





mostrar(texto);


}







//////////////////////////////////////////////////
// RANKING TERMINACIONES
//////////////////////////////////////////////////

function rankingTerminaciones(){


let datos={};



base.forEach(r=>{


let ambos=

r.numero.slice(-2);



datos[ambos]=

(datos[ambos]||0)+1;



});




let ranking=

Object.entries(datos)

.sort((a,b)=>b[1]-a[1])

.slice(0,20);





mostrar(

`📊 TERMINACIONES MÁS FUERTES V36


${

ranking.map(x=>

x[0]+" = "+x[1]+" veces"

).join("\n")

}

`

);


}







//////////////////////////////////////////////////
// ESTADÍSTICAS GENERALES
//////////////////////////////////////////////////

function estadisticasBase(){


let provincias={};

let turnos={};



base.forEach(r=>{


provincias[r.provincia]=

(provincias[r.provincia]||0)+1;



turnos[r.turno]=

(turnos[r.turno]||0)+1;



});





mostrar(

`📊 ESTADÍSTICAS EMI TESLA V36


TOTAL REGISTROS:

${base.length}



🌎 PROVINCIAS


${

Object.entries(provincias)

.map(x=>

x[0]+" : "+x[1]

)

.join("\n")

}




🔄 TURNOS


${

Object.entries(turnos)

.map(x=>

x[0]+" : "+x[1]

)

.join("\n")

}


`

);


}








//////////////////////////////////////////////////
// ESTADO SISTEMA
//////////////////////////////////////////////////

function estadoSistema(){


mostrar(

`🚀 EMI TESLA PRO V36 IA HISTÓRICA


Estado:

🟢 Activo


Registros:

${base.length}


Motores:

✅ Ranking IA

✅ Transiciones

✅ Matriz Provincias

✅ Núcleos

✅ Acompañantes


Base:

LocalStorage


`

);


}








//////////////////////////////////////////////////
// INICIO SISTEMA
//////////////////////////////////////////////////

window.onload=function(){


actualizarEstado();



mostrar(

`🚀 EMI TESLA PRO V36 INICIADO


Registros cargados:

${base.length}


IA HISTÓRICA LISTA`

);


};
