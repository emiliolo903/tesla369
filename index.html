<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
EMI TESLA PRO V45.1 ESTABLE
</title>


<style>

*{
box-sizing:border-box;
}

body{

margin:0;
padding:15px;
background:#101010;
color:white;
font-family:Arial,sans-serif;

}


h1{

text-align:center;
color:#00ff99;

}


.card{

background:#202020;
border:1px solid #444;
border-radius:12px;
padding:15px;
margin-bottom:15px;

}


h2{

color:#00ff99;

}


button,
input,
select{

width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:none;
font-size:16px;

}


button{

background:#00aa66;
color:white;
font-weight:bold;

}


.resultado{

background:#000;
padding:15px;
border-radius:10px;
min-height:200px;
white-space:pre-wrap;

}


.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;

}


.box{

background:#303030;
padding:10px;
border-radius:8px;
text-align:center;

}

</style>

</head>


<body>


<h1>

🚀 EMI TESLA PRO V45.1

<br>

🧠 BASE ESTABLE

</h1>



<div class="card">

<h2>
📊 ESTADO SISTEMA
</h2>


<div class="grid">


<div class="box">

REGISTROS

<br>

<span id="total">

0

</span>

</div>


<div class="box">

BASE

<br>

<span id="estadoBase">

INICIANDO

</span>

</div>


</div>


</div>




<div class="card">

<h2>
🛠️ PRUEBA SISTEMA
</h2>

<div class="card">

<h2>
✍️ CARGA MANUAL 7 PROVINCIAS
</h2>


<select id="turnoBloque">

<option>PREVIA</option>
<option>PRIMERA</option>
<option>MATUTINA</option>
<option>VESPERTINA</option>
<option>NOCTURNA</option>

</select>


<input id="corrientesBloque" placeholder="Corrientes 4 cifras">

<input id="ciudadBloque" placeholder="Ciudad 4 cifras">

<input id="bonaerenseBloque" placeholder="Bonaerense 4 cifras">

<input id="santafeBloque" placeholder="Santa Fe 4 cifras">

<input id="cordobaBloque" placeholder="Córdoba 4 cifras">

<input id="entreriosBloque" placeholder="Entre Ríos 4 cifras">

<input id="chacoBloque" placeholder="Chaco 4 cifras">


<button onclick="guardarBloqueIA()">

💾 GUARDAR BLOQUE

</button>


</div>
  
<button onclick="probarSistema()">

✅ PROBAR BOTÓN

</button>


<button onclick="limpiarResultado()">

🧹 LIMPIAR

</button>


</div>




<div class="card">

<h2>
📌 RESULTADO
</h2>


<div id="resultado" class="resultado">

EMI TESLA PRO V45.1 INICIANDO...

</div>


</div>





<script>


//////////////////////////////////////////////////
// BASE DATOS V45.1
//////////////////////////////////////////////////


const DB_NAME="EMI_TESLA_PRO_V45_1";

const DB_VERSION=1;

const STORE_NAME="historico";


let db=null;



//////////////////////////////////////////////////
// ABRIR BASE
//////////////////////////////////////////////////


function abrirBase(){

return new Promise((resolve,reject)=>{


let request=

indexedDB.open(
DB_NAME,
DB_VERSION
);



request.onupgradeneeded=function(e){


let base=e.target.result;



if(!base.objectStoreNames.contains(STORE_NAME)){


let tabla=

base.createObjectStore(
STORE_NAME,
{
keyPath:"id",
autoIncrement:true
}
);



tabla.createIndex(
"fecha",
"fecha",
{
unique:false
}
);



tabla.createIndex(
"turno",
"turno",
{
unique:false
}
);



tabla.createIndex(
"provincia",
"provincia",
{
unique:false
}
);


}



};



request.onsuccess=function(e){


db=e.target.result;


document.getElementById(
"estadoBase"
).innerText="ACTIVA";


mostrar(

"✅ BASE V45.1 CARGADA"

);


resolve(db);


};



request.onerror=function(e){

mostrar(
"ERROR BASE"
);

reject(e);

};



});


}


function guardarRegistro(datos){

return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readwrite"
);


let tabla=tx.objectStore(
STORE_NAME
);


tabla.add(datos);


tx.oncomplete=function(){

resolve(true);

};


tx.onerror=function(e){

reject(e);

};


});


}



function leerBase(){

return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readonly"
);


let tabla=tx.objectStore(
STORE_NAME
);


let datos=tabla.getAll();


datos.onsuccess=function(){

resolve(datos.result);

};


datos.onerror=function(e){

reject(e);

};


});


}

//////////////////////////////////////////////////
// MOSTRAR
//////////////////////////////////////////////////


function mostrar(texto){

document.getElementById(
"resultado"
).innerText=texto;

}



//////////////////////////////////////////////////
// BOTONES
//////////////////////////////////////////////////


function probarSistema(){

mostrar(`

✅ SISTEMA OK

Botones funcionando

Base preparada

V45.1 ESTABLE

`);

}



function limpiarResultado(){

mostrar("");

}



//////////////////////////////////////////////////
// INICIO
//////////////////////////////////////////////////


window.onload=async function(){


try{


await abrirBase();


}catch(e){


mostrar(
"ERROR INICIO: "+e
);


}



};
//////////////////////////////////////////////////
// CARGA MANUAL 7 PROVINCIAS V45.1
//////////////////////////////////////////////////

async function guardarBloqueIA(){


let turno=

document.getElementById(
"turnoBloque"
).value;



let provincias={


"CORRIENTES":
document.getElementById("corrientesBloque").value,


"CIUDAD":
document.getElementById("ciudadBloque").value,


"BONAERENSE":
document.getElementById("bonaerenseBloque").value,


"SANTA FE":
document.getElementById("santafeBloque").value,


"CORDOBA":
document.getElementById("cordobaBloque").value,


"ENTRE RIOS":
document.getElementById("entreriosBloque").value,


"CHACO":
document.getElementById("chacoBloque").value


};



let cantidad=0;


for(let provincia in provincias){


let numero=

provincias[provincia].trim();



if(numero==="") continue;



if(!/^\d{4}$/.test(numero)){


mostrar(

"⚠️ Error en "+
provincia+
" debe tener 4 cifras"

);


return;

}



await guardarRegistro({

fecha:new Date()
.toISOString()
.slice(0,10),

turno,

provincia,

numero,

origen:"MANUAL_V45_1"

});



cantidad++;


}



let total=

(await leerBase()).length;



document.getElementById(
"total"
).innerText=total;



mostrar(`

✅ BLOQUE GUARDADO

Turno:

${turno}


Provincias:

${cantidad}


TOTAL REGISTROS:

${total}


`);

  }

</script>


</body>

</html>
