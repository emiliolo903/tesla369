<body>

<option>VESPERTINA</option>

<option>NOCTURNA</option>

</select>

id="numerosManual"

placeholder="1234 5678 9012">

💾 Guardar y Analizar

</button>

<div class="card">


<h2>

🧠 Resultado IA V36

</h2>



<div id="resultado" class="output">

EMI Tesla PRO V36 iniciado

</div>


</div>
<script>

//////////////////////////////////////////////////
// BASE HISTÓRICA V36
//////////////////////////////////////////////////


const DB_KEY =
"EMI_TESLA_V36_DB";


const CICLOS_KEY =
"EMI_TESLA_V36_CICLOS";



let base=[];

let ciclos=[];

let pararOCR=false;





//////////////////////////////////////////////////
// CARGAR BASES
//////////////////////////////////////////////////


try{


base =
JSON.parse(

localStorage.getItem(DB_KEY)||"[]"

);



if(!Array.isArray(base)){

base=[];

}


}catch(e){

base=[];

}





try{


ciclos =
JSON.parse(

localStorage.getItem(CICLOS_KEY)||"[]"

);



if(!Array.isArray(ciclos)){

ciclos=[];

}


}catch(e){

ciclos=[];

}







//////////////////////////////////////////////////
// MOSTRAR RESULTADO
//////////////////////////////////////////////////


function mostrar(texto){


let salida =
document.getElementById("resultado");



if(salida){

salida.innerText=texto;

}


}






//////////////////////////////////////////////////
// ACTUALIZAR ESTADO
//////////////////////////////////////////////////


function actualizarEstado(){


let total =
document.getElementById("total");


if(total){

total.innerText =
base.length;

}



let ciclo =
document.getElementById("ciclosTotal");


if(ciclo){

ciclo.innerText =
ciclos.length;

}


}








//////////////////////////////////////////////////
// GUARDAR BASE
//////////////////////////////////////////////////


function guardarBase(){


localStorage.setItem(

DB_KEY,

JSON.stringify(base)

);



actualizarEstado();


}








//////////////////////////////////////////////////
// GUARDAR CICLOS
//////////////////////////////////////////////////


function guardarCiclos(){


localStorage.setItem(

CICLOS_KEY,

JSON.stringify(ciclos)

);



actualizarEstado();


}








//////////////////////////////////////////////////
// EVITAR DUPLICADOS
//////////////////////////////////////////////////


function existeRegistro(r){


return base.some(x=>

x.numero===r.numero &&

x.turno===r.turno &&

x.fecha===r.fecha

);


}








//////////////////////////////////////////////////
// CREAR CICLO DIARIO
//////////////////////////////////////////////////


function crearCiclo(fecha){


return {


fecha:fecha,


previa:[],


primera:[],


matutina:[],


vespertina:[],


nocturna:[]


};


}








//////////////////////////////////////////////////
// AGREGAR AL CICLO CRONOLÓGICO
//////////////////////////////////////////////////


function agregarAlCiclo(registro){



let ciclo =

ciclos.find(c=>

c.fecha===registro.fecha

);




if(!ciclo){


ciclo =
crearCiclo(registro.fecha);


ciclos.push(ciclo);


}




let turno =

registro.turno.toLowerCase();




if(ciclo[turno]){


ciclo[turno].push(

registro.numero

);


}



guardarCiclos();


}








//////////////////////////////////////////////////
// AGREGAR REGISTRO
//////////////////////////////////////////////////


function agregarRegistro(r){



if(!existeRegistro(r)){



base.push(r);



agregarAlCiclo(r);



return true;


}



return false;


}








//////////////////////////////////////////////////
// INICIO SISTEMA
//////////////////////////////////////////////////


window.addEventListener(

"load",

()=>{


actualizarEstado();



mostrar(

"🚀 EMI Tesla PRO V36 iniciado\n\n"+

"Registros cargados: "+

base.length+

"\n\nCiclos históricos: "+

ciclos.length

);



}

);
  //////////////////////////////////////////////////
// OCR PDF HISTÓRICO V36
//////////////////////////////////////////////////


async function iniciarOCR(){

try{


let archivo =
document.getElementById("archivoPDF").files[0];



if(!archivo){

alert("Seleccione un PDF");

return;

}



pararOCR=false;



document.getElementById("infoOCR").innerText =
"Iniciando OCR...";



let datos =
await archivo.arrayBuffer();



let pdf =
await pdfjsLib.getDocument({

data:datos

}).promise;



document.getElementById("paginas").innerText =
pdf.numPages;



let worker =
await Tesseract.createWorker("spa");





for(

let pagina=1;

pagina<=pdf.numPages;

pagina++

){



if(pararOCR){

break;

}



try{


let page =
await pdf.getPage(pagina);



let viewport =
page.getViewport({

scale:2

});



let canvas =
document.createElement("canvas");



canvas.width =
viewport.width;



canvas.height =
viewport.height;




await page.render({

canvasContext:

canvas.getContext("2d"),

viewport

}).promise;




let resultado =
await worker.recognize(canvas);



guardarOCR(

resultado.data.text,

pagina

);




document.getElementById("infoOCR").innerText =

"Procesando página "+

pagina+

" de "+

pdf.numPages;



document.getElementById("barra").style.width =

((pagina/pdf.numPages)*100)+"%";



}catch(error){


console.log(
"Error OCR página",
pagina,
error
);


}



}




await worker.terminate();



guardarBase();



document.getElementById("infoOCR").innerText =

"OCR finalizado";



mostrar(

"✅ OCR terminado\n\n"+

"Registros: "+

base.length

);



}catch(error){


console.error(error);


mostrar(

"❌ Error OCR\n\n"+

error.message

);


}



}





function detenerOCR(){

pararOCR=true;


mostrar(

"⛔ OCR detenido"

);


}








//////////////////////////////////////////////////
// EXTRAER NÚMEROS
//////////////////////////////////////////////////


function extraerNumeros(texto){


return texto.match(/\b\d{4}\b/g)||[];


}








//////////////////////////////////////////////////
// GUARDAR OCR
//////////////////////////////////////////////////


function guardarOCR(texto,pagina){


if(!texto)
return;



let turno =
detectarTurno(texto);



let fecha =

new Date()

.toISOString()

.split("T")[0];



let numeros =
extraerNumeros(texto);




numeros.forEach(numero=>{


agregarRegistro({

fecha,

turno,

numero,

pagina,

origen:"OCR"

});


});



}








//////////////////////////////////////////////////
// DETECTAR TURNO
//////////////////////////////////////////////////


function detectarTurno(texto){


let t =

texto

.toUpperCase()

.normalize("NFD")

.replace(/[\u0300-\u036f]/g,"");




if(t.includes("PREV"))

return "PREVIA";



if(t.includes("PRIMER"))

return "PRIMERA";



if(t.includes("MATU"))

return "MATUTINA";



if(t.includes("VES"))

return "VESPERTINA";



if(t.includes("NOC"))

return "NOCTURNA";



return "DESCONOCIDO";


  }
  //////////////////////////////////////////////////
// CARGA MANUAL V36
//////////////////////////////////////////////////


function guardarManual(){


let turno =

document.getElementById("turnoManual").value;



let texto =

document.getElementById("numerosManual").value;




let numeros =

texto.match(/\d{4}/g);



if(!numeros){


mostrar(

"⚠️ Ingrese números de 4 cifras"

);


return;


}




let fecha =

new Date()

.toISOString()

.split("T")[0];




let nuevos=0;




numeros.forEach(numero=>{


let registro={


fecha,

turno,

numero,

origen:"MANUAL"


};




if(agregarRegistro(registro)){


nuevos++;


}



});





guardarBase();





mostrar(`

✅ DATOS GUARDADOS


Turno:

${turno}


Nuevos:

${nuevos}


🧠 Analizando transición...

`);




analizarTransicion(turno);



}








//////////////////////////////////////////////////
// TRANSICIÓN HISTÓRICA V36
//////////////////////////////////////////////////


function turnoSiguiente(turno){


let mapa={


"PREVIA":"PRIMERA",

"PRIMERA":"MATUTINA",

"MATUTINA":"VESPERTINA",

"VESPERTINA":"NOCTURNA",

"NOCTURNA":"PREVIA"


};



return mapa[turno]||"";


}





function analizarTransicion(origen){


let destino =
turnoSiguiente(origen);



let datos=[];



ciclos.forEach(ciclo=>{


let siguiente =

ciclo[destino.toLowerCase()];



if(siguiente){


siguiente.forEach(numero=>{


datos.push({

numero,

fecha:ciclo.fecha

});


});


}



});



if(datos.length<3){


mostrar(

"⚠️ Historial insuficiente\n\n"+

origen+" → "+destino

);


return;


}



calcularRankingV36(

datos,

origen,

destino

);


              }
  //////////////////////////////////////////////////
// RANKING IA V36
//////////////////////////////////////////////////


function calcularRankingV36(
datos,
origen,
destino
){


let puntaje={};



datos.forEach(r=>{


let numero=r.numero;



if(!puntaje[numero]){

puntaje[numero]=0;

}



// frecuencia histórica

puntaje[numero]+=50;




// peso cronológico

let dias=

(Date.now()-

new Date(r.fecha))

/86400000;



puntaje[numero]+=

100/

Math.max(

1,

dias

);



});





let ranking=

Object.keys(puntaje)

.map(numero=>{


return {

numero,

puntaje:

puntaje[numero]

};


})

.sort((a,b)=>

b.puntaje-a.puntaje

);




generarResultadoV36(

ranking,

origen,

destino,

datos.length

);



}







//////////////////////////////////////////////////
// GENERADOR IA PRINCIPAL Y APOYO
//////////////////////////////////////////////////


function generarResultadoV36(

ranking,

origen,

destino,

cantidad

){



if(!ranking.length){


mostrar(

"⚠️ Sin datos para analizar"

);


return;

}





let top=

ranking.slice(0,8);





let cuaternoPrincipal=

top.slice(0,4)

.map(x=>x.numero);




let cuaternoApoyo=

top.slice(4,8)

.map(x=>x.numero);





let ternoPrincipal=

cuaternoPrincipal.slice(0,3);



let ternoApoyo=

cuaternoApoyo.slice(0,3);





let ambosPrincipal=

cuaternoPrincipal.map(x=>

x.slice(-2)

);





let ambosApoyo=

cuaternoApoyo.map(x=>

x.slice(-2)

);






mostrar(`

🧠 EMI TESLA PRO V36


MODELO:

${origen}

↓

${destino}




🔥 CUATERNO PRINCIPAL

${cuaternoPrincipal.join(" - ")}



🟡 CUATERNO APOYO

${cuaternoApoyo.join(" - ")}




⚡ TERNO PRINCIPAL

${ternoPrincipal.join(" - ")}



🟡 TERNO APOYO

${ternoApoyo.join(" - ")}




💥 AMBOS PRINCIPAL

${ambosPrincipal.join(" - ")}



🟡 AMBOS APOYO

${ambosApoyo.join(" - ")}




📊 Registros usados:

${cantidad}


`);





}







//////////////////////////////////////////////////
// HERRAMIENTAS V36
//////////////////////////////////////////////////


function exportarBase(){


let respaldo={


version:

"EMI TESLA PRO V36",


fecha:

new Date().toISOString(),


base,

ciclos


};




let archivo=

new Blob(

[

JSON.stringify(

respaldo,

null,

2

)

],

{

type:"application/json"

}

);




let enlace=

document.createElement("a");



enlace.href=

URL.createObjectURL(archivo);



enlace.download=

"EMI_TESLA_PRO_V36_BACKUP.json";



enlace.click();



}





function estadoSistema(){



mostrar(`

🚀 EMI TESLA PRO V36


📊 Registros:

${base.length}


📅 Ciclos:

${ciclos.length}


📄 OCR:

ACTIVO


🧠 Motor IA:

ACTIVO


💾 Base:

LOCAL STORAGE


`);

}



function pruebaSistema(){


mostrar(`

🧪 PRUEBA V36


✅ Base:

${base.length}


✅ Ciclos:

${ciclos.length}


✅ OCR:

LISTO


✅ IA:

LISTA


`);

}




function limpiarBase(){


if(confirm(

"¿Eliminar toda la base histórica?"

)){


base=[];

ciclos=[];



guardarBase();

guardarCiclos();



mostrar(

"🧹 Base eliminada"

);



}

}









<div class="card">


<h2>

🧠 Herramientas EMI Tesla PRO V36

</h2>




<button onclick="estadoSistema()">

🧠 Estado Sistema

</button>



<button onclick="pruebaSistema()">

🧪 Prueba

</button>




<button onclick="exportarBase()">

</button>




<button onclick="limpiarBase()">

🧹 Limpiar Base

</button>



</div>

</script>

</body>
