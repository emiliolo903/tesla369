<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Tesla PRO V19</title>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:#fff;
padding:15px;
}

.container{
max-width:480px;
margin:auto;
}

h1{
color:#00F5E0;
text-align:center;
}

h2{
color:#FFD700;
margin-top:25px;
}

input,textarea{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
font-size:16px;
background:#333;
color:#fff;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#00F5E0;
border:none;
border-radius:8px;
font-size:16px;
margin-bottom:10px;
cursor:pointer;
color:#111;
font-weight:bold;
}

.resultado{
background:#222;
padding:12px;
border-radius:10px;
margin-bottom:10px;
line-height:1.6;
}

span{
color:#00FFAA;
font-weight:bold;
font-size:22px;
}

.alerta{
color:#FFD700;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>🔥 EMI Tesla PRO V19</h1>

<h2>Historial del día</h2>

<textarea id="historial" placeholder="Pegá números de 4 cifras"></textarea>

<button onclick="guardarBloque('previa')">
Guardar Previa
</button>

<button onclick="guardarBloque('primera')">
Guardar Primera
</button>

<button onclick="guardarBloque('matutina')">
Guardar Matutina
</button>

<button onclick="guardarBloque('vespertina')">
Guardar Vespertina
</button>

<button onclick="guardarBloque('nocturna')">
Guardar Nocturna
</button>

<h2>💣 Ambos Inteligentes</h2>

<button onclick="generarAmbos()">
Generar Ambos
</button>

<div id="resultadoAmbos" class="resultado"></div>

<h2>🔥 Método EMI</h2>

<input
type="text"
id="numeroEMI"
placeholder="Ingresá número"
/>

<button onclick="convertirEMIManual()">
Convertir Número EMI
</button>

<button onclick="probarEMI()">
EMI Último Resultado
</button>

<div id="resultadoEMI" class="resultado"></div>

</div>

<script>

/* ================= BLOQUES ================= */

let dia={

previa:[],
primera:[],
matutina:[],
vespertina:[],
nocturna:[]

};

function guardarBloque(tipo){

let texto=document
.getElementById("historial")
.value
.trim();

let nums=texto
.split(/\s+/)
.filter(n=>n.length===4);

dia[tipo]=nums;

alert(tipo+" guardado");

}

/* ================= MÉTODO EMI ================= */

const emiMetodo={

0:[0,0],
1:[0,0],
2:[5,7],
3:[8,0],
4:[6,9],
5:[2,7],
6:[4,9],
7:[5,2],
8:[3,0],
9:[3,4]

};

function aplicarEMI(numero){

let resultado=[];

numero.split('').forEach(d=>{

if(emiMetodo[d]){

resultado.push(

d+" → "+
emiMetodo[d][0]+
"-"+
emiMetodo[d][1]

);

}

});

return resultado.join("<br>");

}

/* ================= EMI MANUAL ================= */

function convertirEMIManual(){

let numero=document
.getElementById("numeroEMI")
.value
.trim();

if(numero.length===0){

document.getElementById(
"resultadoEMI"
).innerHTML="Ingresá número";

return;

}

let emi=aplicarEMI(numero);

document.getElementById(
"resultadoEMI"
).innerHTML=`

<div class="resultado">

🔥 CONVERSIÓN EMI<br><br>

<span>${numero}</span><br><br>

${emi}

</div>

`;

}

/* ================= EMI ÚLTIMO ================= */

function probarEMI(){

let todos=[];

for(let t in dia){

todos=todos.concat(dia[t]);

}

if(todos.length===0){

document.getElementById(
"resultadoEMI"
).innerHTML="Sin datos";

return;

}

let ultimo=todos[todos.length-1];

let emi=aplicarEMI(ultimo);

document.getElementById(
"resultadoEMI"
).innerHTML=`

<div class="resultado">

🔥 EMI DEL ÚLTIMO NÚMERO<br><br>

<span>${ultimo}</span><br><br>

${emi}

</div>

`;

}

/* ================= AMBOS INTELIGENTES ================= */

function obtenerUltimoBloque(){

if(dia.vespertina.length>0){
return dia.vespertina;
}

if(dia.matutina.length>0){
return dia.matutina;
}

if(dia.primera.length>0){
return dia.primera;
}

if(dia.previa.length>0){
return dia.previa;
}

return [];

}

function nombreProximoSorteo(){

if(dia.vespertina.length>0){
return "NOCTURNA";
}

if(dia.matutina.length>0){
return "VESPERTINA";
}

if(dia.primera.length>0){
return "MATUTINA";
}

if(dia.previa.length>0){
return "PRIMERA";
}

return "SIGUIENTE";

}

function generarAmbos(){

let bloque=obtenerUltimoBloque();

if(bloque.length===0){

document.getElementById(
"resultadoAmbos"
).innerHTML="Sin datos";

return;

}

let proximo=nombreProximoSorteo();

/* ================= EXTRAER AMBOS ================= */

let ambos=[];

bloque.forEach(n=>{

ambos.push(n.slice(2,4));

});

/* ================= FRECUENCIA ================= */

let freqDigitos={};

ambos.forEach(a=>{

a.split('').forEach(d=>{

freqDigitos[d]=
(freqDigitos[d]||0)+1;

});

});

/* ================= DOMINANTE ================= */

/* ================= LECTURA CONTEXTUAL ================= */

let pares={};

ambos.forEach(a=>{

pares[a]=(pares[a]||0)+1;

let invertido=a[1]+a[0];

pares[invertido]=(pares[invertido]||0)+0.5;

});

/* ================= DETECTAR NÚCLEOS FUERTES ================= */

let nucleos={};

ambos.forEach(a=>{

let d1=a[0];
let d2=a[1];

nucleos[d1]=(nucleos[d1]||0)+1;
nucleos[d2]=(nucleos[d2]||0)+1;

/* continuidad invertida */

if(d1!==d2){

nucleos[d1]+=0.3;
nucleos[d2]+=0.3;

}

/* priorizar 8 y 2 si aparecen conectados */

if(
(a.includes('8') && a.includes('2'))
||
(a==='28')
||
(a==='82')
){

nucleos['8']=(nucleos['8']||0)+2;
nucleos['2']=(nucleos['2']||0)+2;

}

});

/* ================= DOMINANTE ================= */

let dominante=Object
.entries(nucleos)
.sort((a,b)=>b[1]-a[1])[0][0];

/* ================= ACOMPAÑANTE CONTEXTUAL ================= */

let acompanantes={};

ambos.forEach(a=>{

if(a.includes(dominante)){

let otro=
(a[0]===dominante)
? a[1]
: a[0];

acompanantes[otro]=
(acompanantes[otro]||0)+1;

/* continuidad invertida */

let invertido=otro+dominante;

if(pares[invertido]){
acompanantes[otro]+=pares[invertido];
}

/* priorizar continuidad viva */

if(
(a===dominante+otro)
||
(a===otro+dominante)
){

acompanantes[otro]+=1.5;

}

}

});

let acomp=Object
.entries(acompanantes)
.sort((a,b)=>b[1]-a[1])[0];

let acompReal=acomp
? acomp[0]
: dominante;

/* ================= CONTINUIDAD ================= */

let principal=
dominante+acompReal;

let apoyo=
acompReal+dominante;

/* ================= MUTACIÓN ================= */

let mutaciones={};

ambos.forEach(a=>{

if(!a.includes(dominante)){

a.split('').forEach(d=>{

mutaciones[d]=
(mutaciones[d]||0)+1;

});

}

});

let mutacion=Object
.entries(mutaciones)
.sort((a,b)=>b[1]-a[1])[0];

let refuerzo="-";

if(mutacion){

refuerzo=
mutacion[0]+acompReal;

}

/* ================= ALERTAS ================= */

let alerta="🟢 Núcleo activo";

let cantidadDominante=0;

ambos.forEach(a=>{

if(a.includes(dominante)){
cantidadDominante++;
}

});

if(cantidadDominante>=3){
alerta="⚠️ Continuidad dominante fuerte";
}

if(cantidadDominante>=5){
alerta="💣 Posible agotamiento de núcleo";
}

/* ================= RESULTADO ================= */

document.getElementById(
"resultadoAmbos"
).innerHTML=`

<div class="resultado">

🎯 PROYECCIÓN PARA ${proximo}<br><br>

💣 DOMINANTE DETECTADO<br>
<span>${dominante}</span><br><br>

🎯 AMBOS PRINCIPAL<br>
<span>${principal}</span><br><br>

✔ APOYO ESTRATÉGICO<br>
<span>${apoyo}</span><br><br>

⚠️ POSIBLE MUTACIÓN<br>
<span>${refuerzo}</span><br><br>

<div class="alerta">
${alerta}
</div>

</div>

`;

}

</script>

</body>
</html>
