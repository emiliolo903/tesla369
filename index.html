  <script>

//////////////////////////////////////////////////
// EMI TESLA PRO V37 MEJORADA
// BASE PERMANENTE INDEXEDDB
//////////////////////////////////////////////////

const DB_NAME="EMI_TESLA_V37";

const DB_VERSION=1;

const STORE_NAME="historico";

let db=null;



function abrirBase(){


return new Promise((resolve,reject)=>{


let request=

indexedDB.open(

DB_NAME,

DB_VERSION

);



request.onupgradeneeded=function(e){


let base=e.target.result;



if(!base.objectStoreNames.contains(STORE_NAME)){


let tabla=

base.createObjectStore(

STORE_NAME,

{

keyPath:"id",

autoIncrement:true

}

);



tabla.createIndex(

"provincia",

"provincia",

{unique:false}

);



tabla.createIndex(

"turno",

"turno",

{unique:false}

);



}


};



request.onsuccess=function(e){


db=e.target.result;

resolve(db);


};



request.onerror=function(e){

reject(e);

};



});


}







function guardarRegistro(datos){


return new Promise((resolve,reject)=>{


let tx=

db.transaction(

STORE_NAME,

"readwrite"

);



let tabla=

tx.objectStore(

STORE_NAME

);



tabla.add(datos);



tx.oncomplete=function(){

resolve(true);

};



tx.onerror=function(e){

reject(e);

};



});


}







function leerBase(){


return new Promise((resolve,reject)=>{


let tx=

db.transaction(

STORE_NAME,

"readonly"

);



let tabla=

tx.objectStore(

STORE_NAME

);



let datos=

tabla.getAll();



datos.onsuccess=function(){

resolve(datos.result);

};



datos.onerror=function(e){

reject(e);

};



});


}







async function contarRegistros(){


let datos=

await leerBase();


return datos.length;


}







function mostrar(texto){


let salida=

document.getElementById(

"resultado"

);



if(salida)

salida.innerText=texto;


}








async function guardarManual(){



let texto=

document.getElementById(

"numerosManual"

).value;



let provincia=

document.getElementById(

"provinciaManual"

).value;



let turno=

document.getElementById(

"turnoManual"

).value;



let numeros=

texto.match(/\d{4}/g);



if(!numeros){


mostrar(

"⚠️ Ingrese números de 4 cifras"

);


return;

}





for(let numero of numeros){



await guardarRegistro({


fecha:

new Date()

.toISOString()

.split("T")[0],


provincia,

turno,

numero,

origen:"MANUAL"



});


}




let total=

await contarRegistros();



document.getElementById(

"total"

).innerText=

total;



mostrar(

"✅ Datos guardados\n\n"+

"Registros: "+total

);



}

  <script>

//////////////////////////////////////////////////
// EMI TESLA PRO V37 MEJORADA
// OCR PDF
//////////////////////////////////////////////////

let pararOCR=false;




async function iniciarOCR(){



let archivo=

document.getElementById(

"archivoPDF"

).files[0];



if(!archivo){


alert(

"Seleccione un PDF"

);


return;

}



pararOCR=false;



try{



let buffer=

await archivo.arrayBuffer();



let pdf=

await pdfjsLib.getDocument({

data:buffer

}).promise;



document.getElementById(

"estadoOCR"

).innerText=

"PROCESANDO";




let worker=

await Tesseract.createWorker(

"spa"

);





for(

let p=1;

p<=pdf.numPages;

p++

){



if(pararOCR)

break;



let pagina=

await pdf.getPage(p);



let viewport=

pagina.getViewport({

scale:3

});



let canvas=

document.createElement(

"canvas"

);



canvas.width=

viewport.width;



canvas.height=

viewport.height;



let ctx=

canvas.getContext("2d");



await pagina.render({

canvasContext:ctx,

viewport

}).promise;





let resultado=

await worker.recognize(

canvas

);



let texto=

resultado.data.text.toUpperCase();





let numeros=

texto.match(/\d{4}/g)||[];





let provincia=

detectarProvincia(

texto

);



let turno=

detectarTurno(

texto

);





for(let numero of numeros){



await guardarRegistro({


fecha:

new Date()

.toISOString()

.split("T")[0],


provincia,

turno,

numero,

origen:"OCR"


});


}





document.getElementById(

"estadoOCR"

).innerText=

"Página "+p+" / "+pdf.numPages;



}





await worker.terminate();



let total=

await contarRegistros();



document.getElementById(

"total"

).innerText=

total;



mostrar(

"✅ OCR FINALIZADO\n\n"+

"Registros guardados: "+total

);



}

catch(error){


mostrar(

"❌ Error OCR\n\n"+error

);


}



}






function detenerOCR(){

pararOCR=true;

}





function detectarProvincia(t){



if(t.includes("CORRIENTES"))

return "CORRIENTES";



if(t.includes("SANTA FE"))

return "SANTA FE";



if(t.includes("CORDOBA"))

return "CORDOBA";



if(t.includes("CHACO"))

return "CHACO";



if(t.includes("ENTRE RIOS"))

return "ENTRE RIOS";



if(t.includes("BONAERENSE"))

return "BONAERENSE";



return "DESCONOCIDA";


}







function detectarTurno(t){


if(t.includes("PREVIA"))

return "PREVIA";


if(t.includes("PRIMERA"))

return "PRIMERA";


if(t.includes("MATUTINA"))

return "MATUTINA";


if(t.includes("VESPERTINA"))

return "VESPERTINA";


if(t.includes("NOCTURNA"))

return "NOCTURNA";


return "DESCONOCIDO";


}


  </script>
  <script>

//////////////////////////////////////////////////
// EMI TESLA PRO V37 MEJORADA
// MOTOR TESLA
//////////////////////////////////////////////////


async function generarTesla(){


let datos=

await leerBase();



if(datos.length===0){


mostrar(

"⚠️ No hay datos históricos"

);


return;

}



let mapa={};



datos.forEach(r=>{


let n=r.numero;



if(!n)

return;



let ambos=

n.slice(-2);



mapa[ambos]=

(mapa[ambos]||0)+1;



});



let orden=

Object.keys(mapa)

.sort((a,b)=>

mapa[b]-mapa[a]

);



let a=

orden[0]||"--";


let b=

orden[1]||"--";



let c=

orden[2]||"--";




mostrar(

"🚀 GENERADOR TESLA V37\n\n"+

"🔥 Ambos principal\n"+

a+

"\n\n"+

"🟡 Ambos respaldo\n"+

b+

"\n\n"+

"⚡ Tercera opción\n"+

c+

"\n\n"+

"Registros analizados: "+datos.length

);



}








//////////////////////////////////////////////////
// ESTADISTICAS
//////////////////////////////////////////////////


async function estadisticasBase(){



let datos=

await leerBase();



let ocr=

datos.filter(x=>

x.origen==="OCR"

).length;



let manual=

datos.filter(x=>

x.origen==="MANUAL"

).length;



let provincias={};



datos.forEach(x=>{


provincias[x.provincia]=

(provincias[x.provincia]||0)+1;


});



let texto=

"📊 ESTADÍSTICAS V37\n\n"+

"Total registros: "+datos.length+

"\n\nOCR: "+ocr+

"\nManual: "+manual+

"\n\n";



Object.keys(provincias)

.forEach(p=>{


texto+=

p+" : "+provincias[p]+"\n";


});



mostrar(texto);



}









//////////////////////////////////////////////////
// PATRONES HISTÓRICOS
//////////////////////////////////////////////////


async function analizarPatrones(){



let datos=

await leerBase();



let mapa={};



datos.forEach(r=>{


let ambos=

r.numero.slice(-2);



mapa[ambos]=

(mapa[ambos]||0)+1;


});



let orden=

Object.keys(mapa)

.sort((a,b)=>

mapa[b]-mapa[a]

);



let salida=

"🔬 PATRONES HISTÓRICOS\n\n";



orden.slice(0,20)

.forEach(x=>{


salida+=

x+" = "+mapa[x]+" veces\n";


});



mostrar(salida);



}









//////////////////////////////////////////////////
// PATRONES NOCTURNA
//////////////////////////////////////////////////


async function analizarNocturna(){



let datos=

await leerBase();



let mapa={};



datos

.filter(x=>

x.turno==="NOCTURNA"

)

.forEach(r=>{


let ambos=

r.numero.slice(-2);



mapa[ambos]=

(mapa[ambos]||0)+1;



});



let salida=

"🌙 PATRONES NOCTURNA\n\n";



Object.keys(mapa)

.sort((a,b)=>

mapa[b]-mapa[a]

)

.slice(0,20)

.forEach(x=>{


salida+=

x+" = "+mapa[x]+"\n";


});



mostrar(salida);



}


  </script>
  <script>

//////////////////////////////////////////////////
// ACOMPAÑANTE EXACTO
//////////////////////////////////////////////////


async function buscarAcompanante(){


let numero=

document.getElementById(

"numerosManual"

).value.trim();



if(!numero.match(/^\d{4}$/)){


mostrar(

"⚠️ Ingrese un cuaterno de 4 cifras"

);


return;

}



let datos=

await leerBase();



let ambos=

numero.slice(-2);



let mapa={};



datos.forEach(r=>{


if(r.numero.slice(-2)===ambos){



let inicio=

r.numero.slice(0,2);



mapa[inicio]=

(mapa[inicio]||0)+1;


}



});




let orden=

Object.keys(mapa)

.sort((a,b)=>

mapa[b]-mapa[a]

);




mostrar(

"🎯 ACOMPAÑANTE EXACTO\n\n"+

"Base: "+numero+

"\n\n"+

"Principal: "+

(orden[0]||"--")+

"\n\n"+

"Respaldo: "+

(orden[1]||"--")

);



}

total;

"✅ Base permanente activa\n"+

"✅ OCR listo\n"+

"✅ Motor Tesla listo"

);



}

catch(error){


mostrar(

);



}


}
