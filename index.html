<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EMI Tesla PRO V24</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: #fff;
    padding: 15px;
}
button {
    padding: 10px;
    margin: 5px;
}
input {
    margin: 10px 0;
}
.box {
    border: 1px solid #444;
    padding: 10px;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>🚀 EMI Tesla PRO V24</h1>

<input type="file" id="fileInput">

<button onclick="processFile()">Analizar Archivo</button>
<button onclick="clearDB()">Limpiar</button>
<button onclick="showPrediction()">AMBOS PRO MAX</button>

<div class="box" id="results"></div>
<div class="box" id="stats"></div>

<script>

//////////////////////////////
// 🧠 BASE DE DATOS
//////////////////////////////

const db = {
    sorteos: [],
    indexNumero: {},
    learning: {}
};

//////////////////////////////
// 📥 IMPORTADOR
//////////////////////////////

function importFile(file) {
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsText(file);
    });
}

//////////////////////////////
// 🧹 PARSER SIMPLE
//////////////////////////////

function parseText(text) {
    const lines = text.split("\n");
    let parsed = [];

    lines.forEach(l => {
        const nums = l.match(/\d{4}/g);
        const date = l.match(/\d{2}\/\d{2}\/\d{4}/)?.[0];

        if (nums) {
            parsed.push({
                fecha: date,
                numeros: nums
            });
        }
    });

    return parsed;
}

//////////////////////////////
// 📊 DB INSERT
//////////////////////////////

function insert(data) {
    db.sorteos.push(data);

    data.numeros.forEach(n => {
        if (!db.indexNumero[n]) db.indexNumero[n] = [];
        db.indexNumero[n].push(data);
    });
}

//////////////////////////////
// 🔥 CLUSTERS
//////////////////////////////

function buildClusters() {
    let map = {};

    db.sorteos.forEach(s => {
        const nums = s.numeros || [];

        for (let i = 0; i < nums.length; i++) {
            for (let j = i + 1; j < nums.length; j++) {
                const key = nums[i] + "-" + nums[j];
                map[key] = (map[key] || 0) + 1;
            }
        }
    });

    return map;
}

//////////////////////////////
// 🧠 SCORE V24
//////////////////////////////

function score(num, clusters) {
    const freq = db.indexNumero[num]?.length || 0;
    const learn = db.learning[num]?.peso || 1;

    const rec = db.sorteos.slice(-20)
        .filter(s => s.numeros.includes(num)).length;

    const cluster = Object.keys(clusters)
        .filter(k => k.includes(num)).length;

    return (freq*5 + rec*6 + cluster*7) * learn;
}

//////////////////////////////
// 🔮 PREDICCIÓN
//////////////////////////////

function predict() {
    const clusters = buildClusters();
    const nums = Object.keys(db.indexNumero);

    return nums.map(n => ({
        num: n,
        score: score(n, clusters)
    }))
    .sort((a,b)=>b.score-a.score)
    .slice(0,10);
}

//////////////////////////////
// 🧠 LEARNING
//////////////////////////////

function learn(pred, real) {
    pred.forEach(p => {
        if (!db.learning[p.num]) db.learning[p.num] = {peso:1};

        if (real.includes(p.num)) {
            db.learning[p.num].peso += 0.2;
        } else {
            db.learning[p.num].peso -= 0.1;
        }

        if (db.learning[p.num].peso < 0.1)
            db.learning[p.num].peso = 0.1;
    });
}

//////////////////////////////
// 🚀 PROCESO ARCHIVO
//////////////////////////////

async function processFile() {
    const file = document.getElementById("fileInput").files[0];
    const text = await importFile(file);

    const parsed = parseText(text);

    parsed.forEach(p => insert(p));

    render();
}

//////////////////////////////
// 📊 RENDER
//////////////////////////////

function render() {
    document.getElementById("stats").innerHTML =
        "Sorteos: " + db.sorteos.length +
        "<br>Números: " + Object.keys(db.indexNumero).length;
}

//////////////////////////////
// 🔮 MOSTRAR PREDICCIÓN
//////////////////////////////

function showPrediction() {
    const res = predict();

    let html = "<h2>🔥 AMBOS PRO MAX</h2>";

    res.forEach(r => {
        html += `Número: ${r.num} | Score: ${r.score.toFixed(2)}<br>`;
    });

    document.getElementById("results").innerHTML = html;
}

//////////////////////////////
// 🧹 LIMPIAR
//////////////////////////////

function clearDB() {
    db.sorteos = [];
    db.indexNumero = {};
    db.learning = {};

    document.getElementById("results").innerHTML = "";
    render();
}

</script>

</body>
</html>
