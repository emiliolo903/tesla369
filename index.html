//////////////////////////////////////////////////
// EMI TESLA PRO V38
// BASE HISTORICA INDEXEDDB
//////////////////////////////////////////////////


const DB_NAME="EMI_TESLA_V38";

const DB_VERSION=1;

const STORE_NAME="historico";


let db=null;

let pararOCR=false;




function abrirBase(){


return new Promise((resolve,reject)=>{


let request=

indexedDB.open(

DB_NAME,

DB_VERSION

);



request.onupgradeneeded=function(e){


let base=e.target.result;



if(!base.objectStoreNames.contains(STORE_NAME)){


let tabla=

base.createObjectStore(

STORE_NAME,

{

keyPath:"id",

autoIncrement:true

}

);



tabla.createIndex(
"provincia",
"provincia",
{unique:false}
);



tabla.createIndex(
"turno",
"turno",
{unique:false}
);



}


};




request.onsuccess=function(e){

db=e.target.result;

resolve(db);

};



request.onerror=function(e){

reject(e);

};



});


}






function guardarRegistro(datos){


return new Promise((resolve,reject)=>{


let tx=

db.transaction(

STORE_NAME,

"readwrite"

);



let tabla=

tx.objectStore(

STORE_NAME

);



tabla.add(datos);



tx.oncomplete=function(){

resolve(true);

};



tx.onerror=function(e){

reject(e);

};



});


}







function leerBase(){


return new Promise((resolve,reject)=>{


let tx=

db.transaction(

STORE_NAME,

"readonly"

);



let tabla=

tx.objectStore(

STORE_NAME

);



let datos=

tabla.getAll();



datos.onsuccess=function(){

resolve(datos.result);

};



datos.onerror=function(e){

reject(e);

};



});


}






async function contarRegistros(){


let datos=

await leerBase();


return datos.length;


}







function mostrar(texto){


let salida=

document.getElementById(

"resultado"

);



if(salida)

salida.innerText=texto;


}






async function guardarManual(){



let texto=

document.getElementById(

"numerosManual"

).value;



let provincia=

document.getElementById(

"provinciaManual"

).value;



let turno=

document.getElementById(

"turnoManual"

).value;




let numeros=

texto.match(/\d{4}/g);



if(!numeros){


mostrar(

"⚠️ Ingrese números de 4 cifras"

);


return;


}




for(let numero of numeros){



await guardarRegistro({


fecha:

new Date()

.toISOString()

.split("T")[0],


provincia,

turno,

numero,

origen:"MANUAL"


});


}





let total=

await contarRegistros();



document.getElementById(

"total"

).innerText=total;



mostrar(

"✅ Datos guardados\n\n"+

"Provincia: "+provincia+

"\nTurno: "+turno+

"\nRegistros: "+total

);



}

async function iniciarOCR(){


let archivo=

document.getElementById("archivoPDF").files[0];



if(!archivo){

alert("Seleccione un PDF");

return;

}



pararOCR=false;



try{


document.getElementById("estadoOCR").innerText=

"PROCESANDO";



let buffer=

await archivo.arrayBuffer();



let pdf=

await pdfjsLib.getDocument({

data:buffer

}).promise;




let worker=

await Tesseract.createWorker("spa");




for(

let p=1;

p<=pdf.numPages;

p++

){



if(pararOCR)

break;



let pagina=

await pdf.getPage(p);



let viewport=

pagina.getViewport({

scale:3

});



let canvas=

document.createElement("canvas");



canvas.width=

viewport.width;



canvas.height=

viewport.height;



let ctx=

canvas.getContext("2d");




await pagina.render({

canvasContext:ctx,

viewport

}).promise;




let lectura=

await worker.recognize(canvas);



let texto=

lectura.data.text

.toUpperCase();





let numeros=

texto.match(/\d{4}/g)||[];





let provincia=

detectarProvincia(texto);



let turno=

detectarTurno(texto);





for(let numero of numeros){



await guardarRegistro({


fecha:

new Date()

.toISOString()

.split("T")[0],


provincia,

turno,

numero,

origen:"OCR"


});



}



document.getElementById("estadoOCR").innerText=

"Página "+p+" / "+pdf.numPages;



}





await worker.terminate();




let total=

await contarRegistros();



document.getElementById("total").innerText=

total;



mostrar(

"✅ OCR FINALIZADO\n\n"+

"Registros guardados: "+total

);



}

catch(e){


mostrar(

"❌ Error OCR\n\n"+e

);


}



}





function detenerOCR(){

pararOCR=true;

}





function detectarProvincia(t){


if(t.includes("CORRIENTES"))

return "CORRIENTES";


if(t.includes("SANTA FE"))

return "SANTA FE";

return "CORDOBA";

return "CHACO";

return "ENTRE RIOS";


if(t.includes("BONAERENSE"))

return "BONAERENSE";


if(t.includes("CIUDAD"))

return "CIUDAD";



return "DESCONOCIDA";


}






function detectarTurno(t){


if(t.includes("PREVIA"))

return "PREVIA";


if(t.includes("PRIMERA"))

return "PRIMERA";


if(t.includes("MATUTINA"))

return "MATUTINA";


if(t.includes("VESPERTINA"))

return "VESPERTINA";


if(t.includes("NOCTURNA"))

async function buscarAcompananteV2(){


let entrada=

document.getElementById("numerosManual").value.trim();



if(!/^\d{4}$/.test(entrada)){


mostrar(

"⚠️ Ingrese un cuaterno de 4 cifras"

);


return;

}





let datos=

await leerBase();



let ambos=

entrada.slice(-2);



let acompanantes={};



datos.forEach(r=>{


if(

r.numero.slice(-2)===ambos

){



let cabeza=

r.numero.slice(0,2);



acompanantes[cabeza]=

(acompanantes[cabeza]||0)+1;



}



});






let ranking=

Object.keys(acompanantes)

.sort((a,b)=>

acompanantes[b]-acompanantes[a]

);





mostrar(`

🎯 ACOMPAÑANTE EXACTO V2



Base:

${entrada}



💥 Ambos analizado:

${ambos}



🔥 Principal:

${ranking[0]||"--"}${ambos}



🟡 Apoyo:

${ranking[1]||"--"}${ambos}



📊 Veces encontrado:

${acompanantes[ranking[0]]||0}



`);

}

async function analizarPatrones(){


let datos=

await leerBase();



let mapa={};

let ambos=

r.numero.slice(-2);



mapa[ambos]=

(mapa[ambos]||0)+1;



});

Object.keys(mapa)

.sort((a,b)=>

mapa[b]-mapa[a]

.slice(0,20);






let salida=

"🔬 PATRONES HISTÓRICOS V38\n\n";

x+

mapa[x]+

});



mostrar(salida);



}
