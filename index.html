//////////////////////////////////////////////////
// BASE DATOS V45.1
//////////////////////////////////////////////////


const DB_NAME="EMI_TESLA_PRO_V45_1";

const DB_VERSION=3;

const STORE_NAME="historico";

const STORE_MEMORIA="memoriaIA";
  
let db=null;



//////////////////////////////////////////////////
// ABRIR BASE
//////////////////////////////////////////////////


function abrirBase(){

return new Promise((resolve,reject)=>{


let request=

indexedDB.open(
DB_NAME,
DB_VERSION
);



request.onupgradeneeded=function(e){


let base=e.target.result;



if(!base.objectStoreNames.contains(STORE_NAME)){


let tabla=

base.createObjectStore(
STORE_NAME,
{
keyPath:"id",
autoIncrement:true
}
);



tabla.createIndex(
"fecha",
"fecha",
{
unique:false
}
);



tabla.createIndex(
"turno",
"turno",
{
unique:false
}
);



tabla.createIndex(
"provincia",
"provincia",
{
unique:false
}
);


}

// MEMORIA IA

if(!base.objectStoreNames.contains(STORE_MEMORIA)){


let memoria =
base.createObjectStore(
STORE_MEMORIA,
{
keyPath:"id",
autoIncrement:true
}
);


memoria.createIndex(
"fecha",
"fecha",
{
unique:false
}
);


  }

};



request.onsuccess=function(e){


db=e.target.result;


document.getElementById(
"estadoBase"
).innerText="ACTIVA";


mostrar(

"✅ BASE V45.1 CARGADA"

);


resolve(db);


};



request.onerror=function(e){

mostrar(
"ERROR BASE"
);

reject(e);

};



});


}


function guardarRegistro(datos){

return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readwrite"
);


let tabla=tx.objectStore(
STORE_NAME
);


tabla.add(datos);


tx.oncomplete=function(){

resolve(true);

};


tx.onerror=function(e){

reject(e);

};


});


}



function leerBase(){

return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readonly"
);


let tabla=tx.objectStore(
STORE_NAME
);


let datos=tabla.getAll();


datos.onsuccess=function(){

resolve(datos.result);

};


datos.onerror=function(e){

reject(e);

};


});


}
  //////////////////////////////////////////////////
// MEMORIA IA V45.1
//////////////////////////////////////////////////

function guardarMemoriaIA(datos){

return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_MEMORIA,
"readwrite"
);


let tabla=tx.objectStore(
STORE_MEMORIA
);


tabla.add(datos);


tx.oncomplete=function(){

resolve(true);

};


tx.onerror=function(e){

reject(e);

};


});

}



function leerMemoriaIA(){

return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_MEMORIA,
"readonly"
);


let tabla=tx.objectStore(
STORE_MEMORIA
);


let datos=tabla.getAll();


datos.onsuccess=function(){

resolve(datos.result);

};


datos.onerror=function(e){

reject(e);

};


});

}
  
//////////////////////////////////////////////////
// IA APRENDIZAJE HISTÓRICO V45.1
//////////////////////////////////////////////////

let MODELO_IA=null;


async function aprenderBaseIA(){


let datos=await leerBase();

//////////////////////////////////////////////////
// APRENDIZAJE POR TURNO V45.2
//////////////////////////////////////////////////

MODELO_TURNO={
PREVIA:{},
PRIMERA:{},
MATUTINA:{},
VESPERTINA:{},
NOCTURNA:{}
};


MODELO_PROVINCIA={};


MODELO_ACOMPANANTES={};



for(let r of datos){


let turno=r.turno;

let ambos=r.numero.slice(-2);



//
// MEMORIA SEPARADA POR TURNO
//

if(MODELO_TURNO[turno]){


if(!MODELO_TURNO[turno][ambos]){

MODELO_TURNO[turno][ambos]=0;

}


MODELO_TURNO[turno][ambos]++;


}



//
// MEMORIA PROVINCIA
//

let prov=r.provincia;


if(!MODELO_PROVINCIA[prov]){

MODELO_PROVINCIA[prov]={};

}



MODELO_PROVINCIA[prov][ambos]=

(MODELO_PROVINCIA[prov][ambos]||0)+1;



}



MODELO_TURNO_LISTO=true;

//////////////////////////////////////////////////
// TRANSICIONES ENTRE TURNOS V45.2
//////////////////////////////////////////////////

let ORDEN_TURNOS_V45_2={

"PREVIA":"PRIMERA",
"PRIMERA":"MATUTINA",
"MATUTINA":"VESPERTINA",
"VESPERTINA":"NOCTURNA",
"NOCTURNA":"PREVIA"

};



let TRANSICIONES_TURNO={};



for(let a of datos){


let siguiente=

ORDEN_TURNOS_V45_2[a.turno];



if(!siguiente) continue;



let ambosOrigen=

a.numero.slice(-2);



for(let b of datos){


if(a.fecha!==b.fecha)
continue;



if(b.turno!==siguiente)
continue;



let ambosDestino=

b.numero.slice(-2);



let clave=

a.turno+
"→"+
siguiente+
"|"+
ambosOrigen;



if(!TRANSICIONES_TURNO[clave]){

TRANSICIONES_TURNO[clave]={};

}



TRANSICIONES_TURNO[clave][ambosDestino]=

(TRANSICIONES_TURNO[clave][ambosDestino]||0)+1;



}


}



console.log(
"TRANSICIONES TURNO V45.2",
TRANSICIONES_TURNO
);
  
console.log(
"APRENDIZAJE V45.2 CARGADO",
MODELO_TURNO,
MODELO_PROVINCIA
);
//////////////////////////////////////////////////
// ARRASTRE PROVINCIA → PROVINCIA V45.2
//////////////////////////////////////////////////

let ARRASTRE_PROVINCIAS={};


for(let a of datos){

    let ambosOrigen=a.numero.slice(-2);

    for(let b of datos){

        if(a===b) continue;

        if(a.fecha!==b.fecha) continue;

        let ambosDestino=b.numero.slice(-2);

        let clave=

        a.provincia+
        "→"+
        b.provincia;

        if(!ARRASTRE_PROVINCIAS[clave]){

            ARRASTRE_PROVINCIAS[clave]={};

        }

        let relacion=

        ambosOrigen+
        "→"+
        ambosDestino;

        ARRASTRE_PROVINCIAS[clave][relacion]=

        (ARRASTRE_PROVINCIAS[clave][relacion]||0)+1;

    }

}


MODELO_PROVINCIA.ARRASTRES=

ARRASTRE_PROVINCIAS;


console.log(

"ARRASTRES PROVINCIA V45.2",

ARRASTRE_PROVINCIAS

);
  //////////////////////////////////////////////////
// APRENDER ACOMPAÑANTES V45.2
//////////////////////////////////////////////////

MODELO_ACOMPANANTES={};


for(let r of datos){

    let numero=r.numero;

    let ambos=numero.slice(-2);

    let terno=numero.slice(-3);

    let cuaterno=numero;

    if(!MODELO_ACOMPANANTES[ambos]){

        MODELO_ACOMPANANTES[ambos]={

            ternos:{},

            cuaternos:{}

        };

    }


    MODELO_ACOMPANANTES[ambos].ternos[terno]=

    (MODELO_ACOMPANANTES[ambos].ternos[terno]||0)+1;


    MODELO_ACOMPANANTES[ambos].cuaternos[cuaterno]=

    (MODELO_ACOMPANANTES[ambos].cuaternos[cuaterno]||0)+1;

}


console.log(

"ACOMPAÑANTES V45.2",

MODELO_ACOMPANANTES

);
  
let modelo={

frecuencia:{},

transiciones:{},

provincia:{}

};



let orden={

"PREVIA":"PRIMERA",

"PRIMERA":"MATUTINA",

"MATUTINA":"VESPERTINA",

"VESPERTINA":"NOCTURNA",

"NOCTURNA":"PREVIA"

};



// FRECUENCIA DE AMBOS

for(let r of datos){


let ambos=r.numero.slice(-2);



modelo.frecuencia[ambos]=

(modelo.frecuencia[ambos]||0)+1;



let claveProvincia=

r.provincia;



if(!modelo.provincia[claveProvincia]){

modelo.provincia[claveProvincia]={};

}



modelo.provincia[claveProvincia][ambos]=

(modelo.provincia[claveProvincia][ambos]||0)+1;


}




// APRENDER PASO ENTRE TURNOS

for(let a of datos){


let siguiente=

orden[a.turno];



if(!siguiente)
continue;



for(let b of datos){


if(a.fecha!==b.fecha)
continue;


if(b.turno!==siguiente)
continue;



let origen=

a.numero.slice(-2);



let destino=

b.numero.slice(-2);



let clave=

origen+"->"+destino;



modelo.transiciones[clave]=

(modelo.transiciones[clave]||0)+1;



}



}



MODELO_IA=modelo;


return modelo;

//////////////////////////////////////////////////
// MOTOR APRENDIZAJE AVANZADO V45.2
//////////////////////////////////////////////////

let MODELO_TURNO={

PREVIA:{},
PRIMERA:{},
MATUTINA:{},
VESPERTINA:{},
NOCTURNA:{}

};


let MODELO_PROVINCIA={};


let MODELO_ACOMPANANTES={};


let MODELO_TURNO_LISTO=false;



//////////////////////////////////////////////////
// CONFIGURACIÓN APRENDIZAJE V45.2
//////////////////////////////////////////////////

const CONFIG_IA_V45_2={

PESO_TURNO:100,

PESO_PROVINCIA:50,

PESO_ACOMPANANTE:30

};
  
}

//////////////////////////////////////////////////
// GENERADOR FINAL IA V45.1
//////////////////////////////////////////////////

async function generarResultadoIA(){


let datos=await leerBase();


if(datos.length<5){

mostrar(
"⚠️ Falta historial para aprender"
);

return;

}



// Generar ambos

let ambos=

await generarAmbosIA();



if(ambos.length===0){

mostrar(
"⚠️ No hay coincidencias"
);

return;

}



// Ranking de ternos y cuaternos

let rankingTerno={};

let rankingCuaterno={};



for(let r of datos){


let nro=r.numero;



let ultimoDos=

nro.slice(-2);



if(!ambos.includes(ultimoDos))
continue;



// Terno

let terno=

nro.slice(-3);



rankingTerno[terno]=

(rankingTerno[terno]||0)+1;



// Cuaterno

rankingCuaterno[nro]=

(rankingCuaterno[nro]||0)+1;



}




let ternos=

Object.keys(rankingTerno)

.sort((a,b)=>

rankingTerno[b]-
rankingTerno[a]

)

.slice(0,2);





let cuaternos=

Object.keys(rankingCuaterno)

.sort((a,b)=>

rankingCuaterno[b]-
rankingCuaterno[a]

)

.slice(0,2);


// GUARDAR JUGADA EN MEMORIA IA

await guardarMemoriaIA({

fecha:new Date().toISOString(),

ambos:ambos,

ternos:ternos,

cuaternos:cuaternos,

origen:"GENERACION_IA_V45_1"

});



mostrar(`


🧠 EMI TESLA PRO IA


====================


🔥 AMBOS FUERTES


1) ${ambos[0]||"--"}

2) ${ambos[1]||"--"}

3) ${ambos[2]||"--"}



🎯 TERNOS


1) ${ternos[0]||"--"}

2) ${ternos[1]||"--"}



🏆 CUATERNOS


1) ${cuaternos[0]||"--"}

2) ${cuaternos[1]||"--"}



📚 APRENDIZAJE ACTIVO


✅ PDF histórico

✅ Carga manual

✅ Transición entre turnos

✅ Frecuencia

`);

  }
//////////////////////////////////////////////////
// MATRIZ IA TURNO + PROVINCIA V45.1
//////////////////////////////////////////////////

let MATRIZ_IA={};



async function construirMatrizIA(){


let datos=

await leerBase();



let matriz={

turnos:{},

provincias:{}

};



let siguiente={

"PREVIA":"PRIMERA",

"PRIMERA":"MATUTINA",

"MATUTINA":"VESPERTINA",

"VESPERTINA":"NOCTURNA",

"NOCTURNA":"PREVIA"

};



// MATRIZ ENTRE TURNOS

for(let a of datos){


let destino=

siguiente[a.turno];



if(!destino)
continue;



for(let b of datos){


if(a.fecha!==b.fecha)
continue;


if(b.turno!==destino)

let origen=

// MATRIZ PROVINCIAL

//////////////////////////////////////////////////
// RANKING DE AMBOS
//////////////////////////////////////////////////

async function generarAmbosIA(turno){


let modelo=

await aprenderBaseIA();



let ranking={};



for(let clave in modelo.transiciones){


let partes=

clave.split("->");



let salida=

partes[1];



ranking[salida]=

(ranking[salida]||0)+

modelo.transiciones[clave]*10;



}



// sumar frecuencia

for(let n in modelo.frecuencia){


ranking[n]=

(ranking[n]||0)+

modelo.frecuencia[n];


}




return Object.keys(ranking)

.sort((a,b)=>

ranking[b]-ranking[a]

)

.slice(0,3);


  }

//////////////////////////////////////////////////
// OCR HISTÓRICO AVANZADO V45.1
//////////////////////////////////////////////////

let pararOCR=false;


function detectarTurnoOCR(texto){

texto=texto.toUpperCase();


if(texto.includes("PREVIA"))
return "PREVIA";


if(texto.includes("PRIMERA"))
return "PRIMERA";


if(texto.includes("MATUTINA"))
return "MATUTINA";


if(texto.includes("VESPERTINA"))
return "VESPERTINA";


if(texto.includes("NOCTURNA"))
return "NOCTURNA";


return "SIN_TURNO";

}



function detectarFechaOCR(texto){


let fecha=

texto.match(
/\d{2}[\/\-]\d{2}[\/\-]\d{4}/
);



if(fecha){

return fecha[0];

}


return new Date()
.toISOString()
.slice(0,10);

}




//////////////////////////////////////////////////
// OCR HISTÓRICO INTELIGENTE V45.2
//////////////////////////////////////////////////

async function iniciarOCR(){


let archivo=

document.getElementById(
"archivoPDF"
).files[0];


if(!archivo){

mostrar(
"⚠️ Seleccione PDF"
);

return;

}



try{


pararOCR=false;


let buffer=

await archivo.arrayBuffer();



let pdf=

await pdfjsLib
.getDocument({
data:buffer
})
.promise;



let worker=

await Tesseract
.createWorker("spa");



let totalRegistros=0;


let conteoTurnos={

PREVIA:0,
PRIMERA:0,
MATUTINA:0,
VESPERTINA:0,
NOCTURNA:0,
SIN_TURNO:0

};


let ultimoTurno="INICIANDO";



for(
let pagina=1;
pagina<=pdf.numPages;
pagina++
){


if(pararOCR)
break;



mostrar(`

📄 OCR HISTÓRICO V45.2


PÁGINA:

${pagina}

DE

${pdf.numPages}


📚 REGISTROS:

${totalRegistros}


🔄 TURNO:

${ultimoTurno}

`);




let page=

await pdf.getPage(pagina);



let viewport=

page.getViewport({
scale:3
});



let canvas=

document.createElement(
"canvas"
);



canvas.width=
viewport.width;


canvas.height=
viewport.height;



let ctx=

canvas.getContext(
"2d"
);



await page.render({

canvasContext:ctx,

viewport

}).promise;



let lectura=

await worker.recognize(
canvas
);



let texto=

lectura.data.text
.toUpperCase();



let turno=

detectarTurnoOCR(
texto
);



ultimoTurno=turno;


if(conteoTurnos[turno]!==undefined){

conteoTurnos[turno]++;

}



let fecha=

detectarFechaOCR(
texto
);



let numeros=

texto.match(
/\b\d{4}\b/g
)||[];




for(let numero of numeros){


await guardarRegistro({

fecha,

turno,

provincia:"AUTO",

numero,

origen:"OCR_HISTORICO_V45_2"

});


totalRegistros++;


}



mostrar(`

📄 OCR PROCESANDO


PÁGINA:

${pagina}

DE

${pdf.numPages}


📚 REGISTROS NUEVOS:

${totalRegistros}


🔄 ÚLTIMO TURNO:

//////////////////////////////////////////////////

async function rankingInteligenteV45(){

    let datos = await leerBase();

    if(datos.length===0){

        mostrar("⚠️ Sin datos históricos.");

        return;

    }

    let turnoOrigen =
    document.getElementById("turnoBloque").value;

    const SIGUIENTE={

        PREVIA:"PRIMERA",
        PRIMERA:"MATUTINA",
        MATUTINA:"VESPERTINA",
        VESPERTINA:"NOCTURNA",
        NOCTURNA:"PREVIA"

    };

    let turnoDestino=
    SIGUIENTE[turnoOrigen];

    let origen=
    datos.filter(r=>r.turno===turnoOrigen);

    let destino=
    datos.filter(r=>r.turno===turnoDestino);

    if(origen.length===0){

        mostrar("⚠️ No hay datos del turno "+turnoOrigen);

        return;

    }

    let ranking={};

    for(let o of origen){

        let ambosOrigen=
        o.numero.slice(-2);

        for(let d of destino){

            let ambosDestino=
            d.numero.slice(-2);

            if(o.fecha!==d.fecha) continue;

            ranking[ambosDestino]=
            (ranking[ambosDestino]||0)+100;

            if(ambosOrigen===ambosDestino){

                ranking[ambosDestino]+=40;

            }

            if(
                ambosOrigen[0]===ambosDestino[1] &&
                ambosOrigen[1]===ambosDestino[0]
            ){

                ranking[ambosDestino]+=20;

            }

        }

    }
      //////////////////////////////////////////////////
    // FRECUENCIA HISTÓRICA
    //////////////////////////////////////////////////

    let frecuencia={};

    for(let r of datos){

        let ambos=r.numero.slice(-2);

        frecuencia[ambos]=(frecuencia[ambos]||0)+1;

        ranking[ambos]=
        (ranking[ambos]||0)+frecuencia[ambos];

    }


    //////////////////////////////////////////////////
    // ARRASTRE ENTRE PROVINCIAS
    //////////////////////////////////////////////////

    let provincias={};

    for(let r of datos){

        if(!provincias[r.provincia]){

            provincias[r.provincia]={};

        }

        let ambos=r.numero.slice(-2);

        provincias[r.provincia][ambos]=
        (provincias[r.provincia][ambos]||0)+1;

    }


    for(let provincia in provincias){

        for(let ambos in provincias[provincia]){

            ranking[ambos]=
            (ranking[ambos]||0)+
            (provincias[provincia][ambos]*5);

        }

    }


    //////////////////////////////////////////////////
    // MEMORIA IA (EVITAR REPETIR)
    //////////////////////////////////////////////////

    let memoria=await leerMemoriaIA();

    if(memoria.length){

        let ultima=memoria[memoria.length-1];

        if(ultima.ambos){

            ultima.ambos.forEach(n=>{

                if(ranking[n]){

                    ranking[n]-=35;

                }

            });

        }

    }


    //////////////////////////////////////////////////
    // ORDENAR RANKING
    //////////////////////////////////////////////////

    let ambos=
    Object.keys(ranking)
    .sort((a,b)=>ranking[b]-ranking[a])
    .slice(0,3);
  
        //////////////////////////////////////////////////
    // GENERAR TERNOS Y CUATERNOS
    //////////////////////////////////////////////////

    let rankingTernos={};
    let rankingCuaternos={};

    for(let r of datos){

        let nro=r.numero;

        let ambosDato=nro.slice(-2);

        if(!ambos.includes(ambosDato)) continue;

        let terno=nro.slice(-3);

        let cuaterno=nro.slice(-4);

        rankingTernos[terno]=
        (rankingTernos[terno]||0)+1;

        rankingCuaternos[cuaterno]=
        (rankingCuaternos[cuaterno]||0)+1;

        if(r.turno===turnoDestino){

            rankingTernos[terno]+=20;
            rankingCuaternos[cuaterno]+=20;

        }

        if(r.turno===turnoOrigen){

            rankingTernos[terno]+=10;
            rankingCuaternos[cuaterno]+=10;

        }

    }


    let ternos=
    Object.keys(rankingTernos)
    .sort((a,b)=>
        rankingTernos[b]-rankingTernos[a]
    )
    .slice(0,2);


    let cuaternos=
    Object.keys(rankingCuaternos)
    .sort((a,b)=>
        rankingCuaternos[b]-rankingCuaternos[a]
    )
    .slice(0,2);


    //////////////////////////////////////////////////
    // GUARDAR MEMORIA IA
    //////////////////////////////////////////////////

    await guardarMemoriaIA({

        fecha:new Date().toISOString(),

        turno:turnoOrigen,

        destino:turnoDestino,

        ambos:ambos,

        ternos:ternos,

        cuaternos:cuaternos,

        origen:"RANKING_V45_2"

    });
      //////////////////////////////////////////////////
    // MOSTRAR RESULTADO
    //////////////////////////////////////////////////

    mostrar(`

🧠 RANKING IA V45.2

${turnoOrigen} ➜ ${turnoDestino}

======================

🔥 AMBOS

1) ${ambos[0]||"--"}

2) ${ambos[1]||"--"}

3) ${ambos[2]||"--"}

======================

🎯 TERNOS

1) ${ternos[0]||"--"}

2) ${ternos[1]||"--"}

======================

🏆 CUATERNOS

1) ${cuaternos[0]||"--"}

2) ${cuaternos[1]||"--"}

======================

📊 BASE ANALIZADA

Registros: ${datos.length}

Turno origen: ${origen.length}

Turno destino: ${destino.length}

✅ Frecuencia histórica

✅ Transición entre turnos

✅ Arrastre entre provincias

✅ Memoria IA activa

`);

}

async function auditoriaV45(){

    let datos = await leerBase();


    if(datos.length===0){

        mostrar("⚠️ No hay registros en la base");

        return;

    }


    let resumen={};


    let turnos=[
        "PREVIA",
        "PRIMERA",
        "MATUTINA",
        "VESPERTINA",
        "NOCTURNA"
    ];


    let provincias=[
        "CORRIENTES",
        "CIUDAD",
        "BONAERENSE",
        "SANTA FE",
        "CORDOBA",
        "ENTRE RIOS",
        "CHACO",
        "AUTO"
    ];



    // Crear estructura

    turnos.forEach(t=>{

        resumen[t]={};

        provincias.forEach(p=>{

            resumen[t][p]=0;

        });

    });



    // Contar registros

    for(let r of datos){


        let turno=r.turno || "SIN_TURNO";

        let provincia=r.provincia || "SIN_PROVINCIA";


        if(!resumen[turno]){

            resumen[turno]={};

        }


        if(resumen[turno][provincia]===undefined){

            resumen[turno][provincia]=0;

        }


        resumen[turno][provincia]++;


    }



    let texto=`

🛡️ AUDITORÍA IA V45.2

======================

📚 REGISTROS TOTALES:

${datos.length}


======================

📊 CONTEO POR TURNO Y PROVINCIA

`;



    for(let turno in resumen){


        texto+=`

🔹 ${turno}

`;

        for(let provincia in resumen[turno]){


            if(resumen[turno][provincia]>0){


                texto+=
                provincia+
                ": "+
                resumen[turno][provincia]+
                "\n";


            }

        }

    }



    texto+=`

======================

💾 BASE:
ACTIVA


🧠 IA:
APRENDIZAJE ACTIVO


✅ AUDITORÍA COMPLETA

`;



    mostrar(texto);


}
