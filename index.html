<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EMI Tesla PRO V24 FULL</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:#fff;
    padding:15px;
}

button{
    padding:10px;
    margin:5px;
    cursor:pointer;
}

.box{
    border:1px solid #444;
    padding:10px;
    margin-top:10px;
    white-space:pre-wrap;
    max-height:300px;
    overflow:auto;
}
</style>
</head>

<body>

<h2>🚀 EMI Tesla PRO V24 FULL SYSTEM</h2>

<input type="file" id="fileInput">

<br>

<button onclick="loadFile()">📥 Cargar archivo</button>
<button onclick="runOCR()">📄 OCR + Limpiar</button>
<button onclick="buildDB()">🧠 Crear Base</button>
<button onclick="showPrediction()">🔮 AMBOS PRO</button>
<button onclick="exportData()">📤 Exportar</button>
<button onclick="clearAll()">🧹 Limpiar</button>

<div class="box" id="log"></div>
<div class="box" id="result"></div>

<script>

//////////////////////////////
// 📦 BASE
//////////////////////////////

let rawFile = "";
let cleanedText = "";
let db = [];

//////////////////////////////
// 📥 CARGAR
//////////////////////////////

function loadFile(){
    const file = document.getElementById("fileInput").files[0];

    if(!file){
        log("⚠️ No hay archivo");
        return;
    }

    const reader = new FileReader();

    reader.onload = e => {
        rawFile = e.target.result;
        log("📥 Archivo cargado");
    };

    reader.readAsText(file);
}

//////////////////////////////
// 📄 OCR / LIMPIEZA
//////////////////////////////

function runOCR(){

    if(!rawFile){
        log("⚠️ Cargá un archivo primero");
        return;
    }

    let text = rawFile;

    text = text.replace(/\s+/g," ");
    text = text.replace(/[^0-9a-zA-ZáéíóúÁÉÍÓÚ\/\-\n ]/g,"");

    cleanedText = text;

    log("📄 OCR listo");
}

//////////////////////////////
// 🧠 PARSER
//////////////////////////////

function buildDB(){

    if(!cleanedText){
        log("⚠️ Ejecutá OCR primero");
        return;
    }

    db = [];

    const lines = cleanedText.split("\n");

    lines.forEach(l => {

        const nums = l.match(/\d{4}/g);
        const date = l.match(/\d{2}\/\d{2}\/\d{4}/)?.[0];

        if(nums){
            db.push({
                fecha: date || null,
                numeros: nums
            });
        }
    });

    log("🧠 DB creada: " + db.length + " registros");
}

//////////////////////////////
// 🔮 PREDICCIÓN SIMPLE
//////////////////////////////

function predict(){

    let map = {};

    db.forEach(d => {
        d.numeros.forEach(n => {
            map[n] = (map[n] || 0) + 1;
        });
    });

    return Object.entries(map)
        .map(([num,score]) => ({num,score}))
        .sort((a,b)=>b.score-a.score)
        .slice(0,10);
}

function showPrediction(){

    const res = predict();

    let html = "🔮 AMBOS PRO MAX\n\n";

    res.forEach(r=>{
        html += `Número: ${r.num} | Score: ${r.score}\n`;
    });

    document.getElementById("result").innerText = html;
}

//////////////////////////////
// 📤 EXPORTAR
//////////////////////////////

function exportData(){

    const blob = new Blob(
        [JSON.stringify(db,null,2)],
        {type:"application/json"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "emi_tesla_v24_db.json";
    a.click();

    log("📤 Exportado");
}

//////////////////////////////
// 🧹 LIMPIAR
//////////////////////////////

function clearAll(){
    rawFile="";
    cleanedText="";
    db=[];
    document.getElementById("fileInput").value="";

    document.getElementById("result").innerText="";
    log("🧹 Limpio");
}

//////////////////////////////
// 🖥️ LOG
//////////////////////////////

function log(msg){
    document.getElementById("log").innerText += "\n" + msg;
}

</script>

</body>
</html>
