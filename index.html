<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EMI Tesla PRO V34 FINAL</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{font-family:Arial;background:#111;color:#fff;padding:15px}
button,select,input{padding:8px;margin:4px}
.box{border:1px solid #444;padding:10px;margin-top:10px;max-height:300px;overflow:auto;white-space:pre-wrap}
.bar{height:10px;background:#333;margin-top:10px}
.bar>div{height:10px;background:#00ff88;width:0%}
.small{font-size:12px;color:#aaa}
</style>
</head>

<body>

<h2>🚀 EMI Tesla PRO V34 FINAL</h2>

<h3>📄 OCR PDF</h3>
<input type="file" id="fileInput">
<button onclick="startOCR()">Iniciar OCR</button>
<button onclick="cancelOCR()">Cancelar</button>

<div class="bar"><div id="barFill"></div></div>
<div id="ocrStatus" class="small"></div>

<hr>

<h3>✍️ Manual</h3>
<select id="turnoManual">
<option>PREVIA</option>
<option>PRIMERA</option>
<option>MATUTINA</option>
<option>VESPERTINA</option>
<option>NOCTURNA</option>
</select>

<input id="numsManual" placeholder="1234 5678">
<button onclick="addManual()">Guardar</button>

<hr>

<h3>🔮 Predicción</h3>
<button onclick="runPrediction()">Generar Predicción</button>

<hr>

<h3>📊 Historial</h3>
<button onclick="showDB()">Ver Base</button>
<button onclick="showPredictions()">Ver Predicciones</button>
<button onclick="validatePrediction()">Validar</button>

<hr>

<h3>📤 Backup</h3>
<button onclick="exportData()">Exportar</button>
<input type="file" onchange="importData(event)">

<div class="box" id="out"></div>

<script>

let db = JSON.parse(localStorage.getItem("v34_db")||"[]");
let predictions = JSON.parse(localStorage.getItem("v34_pred")||"[]");
let worker=null;
let cancel=false;

function save(){
localStorage.setItem("v34_db",JSON.stringify(db));
localStorage.setItem("v34_pred",JSON.stringify(predictions));
}

function addRecord(r){
db.push(r); save();
}

function addManual(){
let turno=document.getElementById("turnoManual").value;
let nums=document.getElementById("numsManual").value.match(/\d{4}/g);
if(!nums)return alert("sin datos");
addRecord({fecha:new Date().toISOString(),turno,numeros:nums,origen:"manual"});
}

function analyze(){
let freq={},rec={},trans={};
db.forEach(r=>r.numeros.forEach(n=>freq[n]=(freq[n]||0)+1));
db.slice(-50).forEach(r=>r.numeros.forEach(n=>rec[n]=(rec[n]||0)+2));

for(let i=0;i<db.length-1;i++){
db[i].numeros.forEach(x=>{
db[i+1].numeros.forEach(()=>trans[x]=(trans[x]||0)+1);
});
}

return Object.entries(freq).map(([n,f])=>({
num:n,
score:f*5+(rec[n]||0)*10+(trans[n]||0)*3
})).sort((a,b)=>b.score-a.score);
}

function predict(turno){
let top=analyze().slice(0,20);
return {
cuaterno:top.slice(0,4).map(x=>x.num),
terno:top.slice(0,3).map(x=>x.num),
ambos:top.slice(0,6).map(x=>x.num)
};
}

function runPrediction(){
let turno=prompt("turno actual");
let p=predict(turno);
predictions.push({turno,p});
save();
document.getElementById("out").innerText=JSON.stringify(p,null,2);
}

function showDB(){
document.getElementById("out").innerText=JSON.stringify(db.slice(-10),null,2);
}

function showPredictions(){
document.getElementById("out").innerText=JSON.stringify(predictions.slice(-10),null,2);
}

function validatePrediction(){
alert("función base demo");
}

function exportData(){
let blob=new Blob([JSON.stringify({db,predictions})],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="v34_backup.json";
a.click();
}

function importData(e){
let r=new FileReader();
r.onload=ev=>{
let d=JSON.parse(ev.target.result);
db=d.db||[];
predictions=d.predictions||[];
save();
};
r.readAsText(e.target.files[0]);
}

async function startOCR(){
let file=document.getElementById("fileInput").files[0];
if(!file)return;

let reader=new FileReader();
reader.onload=async e=>{
let pdf=await pdfjsLib.getDocument({data:new Uint8Array(e.target.result)}).promise;
worker=await Tesseract.createWorker("eng+spa");

for(let i=1;i<=pdf.numPages;i++){
if(cancel)break;

let page=await pdf.getPage(i);
let canvas=document.createElement("canvas");
let ctx=canvas.getContext("2d");

let vp=page.getViewport({scale:2});
canvas.width=vp.width;
canvas.height=vp.height;

await page.render({canvasContext:ctx,viewport:vp}).promise;

document.getElementById("ocrStatus").innerText=`Página ${i}/${pdf.numPages}`;
document.getElementById("barFill").style.width=(i/pdf.numPages*100)+"%";

let res=await worker.recognize(canvas);
let nums=res.data.text.match(/\d{4}/g);

if(nums){
addRecord({
fecha:new Date().toISOString(),
turno:"OCR",
numeros:nums,
origen:"ocr"
});
}
}

await worker.terminate();
alert("OCR listo");
};

reader.readAsArrayBuffer(file);
}

function cancelOCR(){cancel=true;}

</script>

</body>
</html>
