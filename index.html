//////////////////////////////////////////////////
// BLOQUE 1/8
// BASE SISTEMA + INDEXEDDB
//////////////////////////////////////////////////


let SISTEMA_V48={

activo:true,

memoria:false,

matriz:false,

pdf:false

};



const DB_NAME_V48="EMI_TESLA_PRO_V47_FINAL";

const DB_VERSION_V48=1;



const STORES_V48={

historico:"historico",

matrizTurnos:"matrizTurnos",

matrizProvincias:"matrizProvincias",

auditoria:"auditoria"

};



let dbV48=null;



function abrirBaseV48(){


return new Promise((resolve,reject)=>{


let request=indexedDB.open(

DB_NAME_V48,

DB_VERSION_V48

);



request.onupgradeneeded=function(e){


let db=e.target.result;


Object.values(STORES_V48).forEach(store=>{


if(!db.objectStoreNames.contains(store)){


db.createObjectStore(

store,

{
keyPath:"id",
autoIncrement:true
}

);


}


});


};



request.onsuccess=function(e){


dbV48=e.target.result;


let estado=document.getElementById(
"estadoBase"
);


if(estado){

estado.innerText="ACTIVA";

}


resolve(true);


};



request.onerror=function(e){

reject(e);

};


});


}




function guardarV48(store,dato){


return new Promise((resolve,reject)=>{


if(!dbV48){

reject("BASE NO ABIERTA");

return;

}


let tx=dbV48.transaction(

store,

"readwrite"

);


let tabla=tx.objectStore(store);


tabla.add(dato);


tx.oncomplete=()=>resolve(true);


tx.onerror=e=>reject(e);


});


}



function leerV48(store){


return new Promise((resolve,reject)=>{


let tx=dbV48.transaction(

store,

"readonly"

);


let tabla=tx.objectStore(store);


let consulta=tabla.getAll();


consulta.onsuccess=()=>{

resolve(consulta.result);

};


consulta.onerror=e=>reject(e);


});


}

if(total){

total.innerText=datos.length;

// BLOQUE 2/8
// OCR PDF HISTÓRICO V48
//////////////////////////////////////////////////

let DETENER_OCR_V48=false;
let auditoriaCarga={

PREVIA:0,

PRIMERA:0,

MATUTINA:0,

VESPERTINA:0,

NOCTURNA:0

};

function detectarFechaV48(texto){

    let fecha=texto.match(
        /\d{2}[\/\-]\d{2}[\/\-]\d{4}/
    );


    if(!fecha){

        return new Date()
        .toISOString()
        .slice(0,10);

    }


    let p=fecha[0]
    .replace(/-/g,"/")
    .split("/");


    return p[2]+"-"+p[1]+"-"+p[0];

}



function detectarTurnoV48(texto){

    texto=texto.toUpperCase();


    if(texto.includes("PREVIA"))
        return "PREVIA";

    if(texto.includes("PRIMERA"))
        return "PRIMERA";

    if(texto.includes("MATUTINA"))
        return "MATUTINA";

    if(texto.includes("VESPERTINA"))
        return "VESPERTINA";

    if(texto.includes("NOCTURNA"))
        return "NOCTURNA";


    return "SIN_TURNO";

}



function extraerRegistrosPDFV48(texto,pagina){


    texto=texto.toUpperCase();


    let fecha=detectarFechaV48(texto);

    let turno=detectarTurnoV48(texto);


    let provincias=[

        "CORRIENTES",
        "CIUDAD",
        "BONAERENSE",
        "SANTA FE",
        "CORDOBA",
        "ENTRE RIOS",
        "CHACO"

    ];


    let registros=[];



    for(let provincia of provincias){


        let pos=texto.indexOf(provincia);


        if(pos===-1)
            continue;


        let bloque=
        texto.substring(
            pos,
            pos+300
        );


        let numeros=
        bloque.match(/\b\d{4}\b/g);



        if(!numeros)
            continue;



        for(let numero of numeros){


            registros.push({

                fecha:fecha,

                turno:turno,

                provincia:provincia,

                numero:numero,

                pagina:pagina,

                origen:"OCR_V48"

            });


        }


    }


    return registros;

}





async function iniciarOCR(){


let archivo=document.getElementById(
"archivoPDF"
).files[0];


if(!archivo){


mostrarV48(
"⚠️ SELECCIONE PDF"
);


return;

}



DETENER_OCR_V48=false;



let buffer=
await archivo.arrayBuffer();



let pdf=
await pdfjsLib
.getDocument({
data:buffer
})
.promise;



let worker=
await Tesseract
.createWorker("spa");



for(
let pagina=1;
pagina<=pdf.numPages;
pagina++
){


if(DETENER_OCR_V48)
break;



document.getElementById(
"progresoOCR"
).innerText=

"Procesando página "+
pagina+
" / "+
pdf.numPages;



let page=
await pdf.getPage(pagina);



let viewport=
page.getViewport({
scale:2
});



let canvas=
document.createElement("canvas");



canvas.width=
viewport.width;


canvas.height=
viewport.height;



await page.render({

canvasContext:
canvas.getContext("2d"),

viewport:viewport

}).promise;



let lectura=
await worker.recognize(canvas);



let registros=
extraerRegistrosPDFV48(
lectura.data.text,
pagina
);



for(let r of registros){

    await guardarV48(
        STORES_V48.historico,
        r
    );

    if(auditoriaCarga[r.turno]!==undefined){

        auditoriaCarga[r.turno]++;

    }

}

document.getElementById("auditoria").innerText=

"🛡 IA APRENDIENDO...\n\n"+

"PREVIA: "+auditoriaCarga.PREVIA+" cargados\n"+

"PRIMERA: "+auditoriaCarga.PRIMERA+" cargados\n"+

"MATUTINA: "+auditoriaCarga.MATUTINA+" cargados\n"+

"VESPERTINA: "+auditoriaCarga.VESPERTINA+" cargados\n"+

"NOCTURNA: "+auditoriaCarga.NOCTURNA+" cargados\n\n"+

"📄 Página "+pagina+" de "+pdf.numPages;


}



await worker.terminate();

await actualizarRegistrosV48();

await construirMemoriaV48();

await construirMatrizTurnosV48();

await construirMatrizProvinciasV48();

document.getElementById(
"estadoMemoria"
).innerText="LISTA";

document.getElementById(
"estadoMatriz"
).innerText="ACTIVA";

document.getElementById("auditoria").innerText=

"✅ CARGA COMPLETA\n\n"+

"PREVIA ✔ "+auditoriaCarga.PREVIA+"\n"+

"PRIMERA ✔ "+auditoriaCarga.PRIMERA+"\n"+

"MATUTINA ✔ "+auditoriaCarga.MATUTINA+"\n"+

"VESPERTINA ✔ "+auditoriaCarga.VESPERTINA+"\n"+

"NOCTURNA ✔ "+auditoriaCarga.NOCTURNA+"\n\n"+

"🧠 MEMORIA IA: LISTA\n"+

"📊 MATRIZ: ACTIVA\n"+

"🚀 IA PREPARADA PARA PREDECIR";

mostrarV48(
"✅ PDF PROCESADO\n\nLA IA YA PUEDE GENERAR PREDICCIONES"
);


}



function detenerOCR(){


DETENER_OCR_V48=true;


mostrarV48(
"⛔ OCR DETENIDO"
);


    }

    //////////////////////////////////////////////////
// BLOQUE 4/8
// MEMORIA IA + MATRIZ TURNOS V48
//////////////////////////////////////////////////


let MEMORIA_V48={};

let MATRIZ_TURNOS_V48={};



async function construirMemoriaV48(){


let datos =
await leerV48(
STORES_V48.historico
);



MEMORIA_V48={};



for(let d of datos){


if(
!d.fecha ||
!d.turno ||
!d.provincia ||
!d.numero
)

continue;



if(!MEMORIA_V48[d.fecha])
MEMORIA_V48[d.fecha]={};



if(!MEMORIA_V48[d.fecha][d.turno])
MEMORIA_V48[d.fecha][d.turno]={};



if(!MEMORIA_V48[d.fecha][d.turno][d.provincia])
MEMORIA_V48[d.fecha][d.turno][d.provincia]=[];



MEMORIA_V48[d.fecha]
[d.turno]
[d.provincia]
.push(
String(d.numero)
);



}



return MEMORIA_V48;


}





async function construirMatrizTurnosV48(){


await construirMemoriaV48();



MATRIZ_TURNOS_V48={};



let orden=[

"PREVIA",
"PRIMERA",
"MATUTINA",
"VESPERTINA",
"NOCTURNA"

];



for(let fecha in MEMORIA_V48){


let dia=
MEMORIA_V48[fecha];



for(let i=0;i<orden.length;i++){


let origen=orden[i];

let destino=
(i===4)
?
"PREVIA"
:
orden[i+1];



if(
!dia[origen] ||
!dia[destino]
)

continue;



for(let provincia in dia[origen]){


if(!dia[destino][provincia])
continue;



let base=
String(
dia[origen][provincia][0]
)
.slice(-2);



let salida=
String(
dia[destino][provincia][0]
)
.slice(-2);



if(!MATRIZ_TURNOS_V48[base])
MATRIZ_TURNOS_V48[base]={};



if(!MATRIZ_TURNOS_V48[base][salida])
MATRIZ_TURNOS_V48[base][salida]=0;



MATRIZ_TURNOS_V48[base][salida]++;


}


}


}



let estado =
document.getElementById(
"estadoMatriz"
);



if(estado){

estado.innerText="ACTIVA";

}



return MATRIZ_TURNOS_V48;


    }
    //////////////////////////////////////////////////
// BLOQUE 5/8
// MATRIZ PROVINCIAS V48
//////////////////////////////////////////////////

let MATRIZ_PROV_V48={};



async function construirMatrizProvinciasV48(){


let datos =
await leerV48(
STORES_V48.historico
);



MATRIZ_PROV_V48={};



for(let i=0;i<datos.length-1;i++){


let actual=datos[i];

let siguiente=datos[i+1];



if(
!actual.numero ||
!siguiente.numero
)

continue;



let base=
String(actual.numero)
.slice(-2);



let salida=
String(siguiente.numero)
.slice(-2);



let clave=
actual.provincia+
" → "+
siguiente.provincia;



if(!MATRIZ_PROV_V48[clave])
MATRIZ_PROV_V48[clave]={};



if(!MATRIZ_PROV_V48[clave][base])
MATRIZ_PROV_V48[clave][base]={};



if(!MATRIZ_PROV_V48[clave][base][salida])
MATRIZ_PROV_V48[clave][base][salida]=0;



MATRIZ_PROV_V48[clave][base][salida]++;



}



await guardarV48(

STORES_V48.matrizProvincias,

{

fecha:new Date(),

matriz:MATRIZ_PROV_V48

}

);



return MATRIZ_PROV_V48;


}





function mostrarMatrizIA(){


let texto=
"🔄 MATRIZ IA V48\n\n";


let cantidad=0;



for(let clave in MATRIZ_PROV_V48){


texto+=
clave+

cantidad++;


if(cantidad>=20)
break;


}



if(cantidad===0){

texto+="SIN DATOS DE MATRIZ";

}



mostrarV48(texto);


    }
    //////////////////////////////////////////////////
// BLOQUE 6/8
// NÚCLEO IA V48
//////////////////////////////////////////////////


let NUCLEO_V48={

dominante:null,

segundo:null,

sobreviviente:null,

ranking:{}

};



async function analizarNucleoV48(){


let datos=
await leerV48(
STORES_V48.historico
);



let frecuencia={};



for(let d of datos){


if(!d.numero)
continue;



let n=
String(d.numero)
.slice(-2);



frecuencia[n]=
(frecuencia[n]||0)+1;


}



let ranking=
Object.keys(frecuencia)
.sort(

(a,b)=>
frecuencia[b]-frecuencia[a]

);



NUCLEO_V48.ranking=
frecuencia;



NUCLEO_V48.dominante=
ranking[0] || null;



NUCLEO_V48.segundo=
ranking[1] || null;



for(let n of ranking){


if(
n!==NUCLEO_V48.dominante &&
n!==NUCLEO_V48.segundo
){

NUCLEO_V48.sobreviviente=n;

break;

}


}



return NUCLEO_V48;


    }
    //////////////////////////////////////////////////
// BLOQUE 7/8
// MOTOR TESLA 3-6-9 + GENERADOR IA V48
//////////////////////////////////////////////////


const TESLA_V48={


"0":["0","0"],

"1":["0","0"],

"2":["5","7"],

"3":["8","0"],

"4":["6","9"],

"5":["2","7"],

"6":["4","9"],

"7":["5","2"],

"8":["3","0"],

"9":["3","4"]


};



function aplicarTeslaV48(numero){


numero=String(numero);


let salida="";


for(let digito of numero){


if(TESLA_V48[digito]){


salida+=TESLA_V48[digito][0];


}


}


return salida.slice(0,2);


}





function obtenerBases7Provincias(){


let ids=[

"corrientes",
"ciudad",
"bonaerense",
"santaFe",
"cordoba",
"entreRios",
"chaco"

];



let bases=[];



for(let id of ids){


let valor=
document.getElementById(id)
.value
.trim();



if(valor.length===4){


bases.push(
valor.slice(-2)
);


}



}



return bases;


}





function generarTesla(){


let bases=
obtenerBases7Provincias();



let salida=
"⚡ TESLA 3-6-9 V48\n\n";



if(bases.length===0){


salida+="CARGUE LOS DATOS DE LAS PROVINCIAS";


mostrarV48(salida);

return;


}



for(let n of bases){


salida+=

n+
" → "+
aplicarTeslaV48(n)
+
"\n";


}



mostrarV48(salida);


}

// TRANSICIÓN DE TURNOS + ACOMPAÑANTES
//////////////////////////////////////////////////


function invertirNumeroV48(n){

    n=String(n);

    return n[1]+n[0];

}



async function buscarCandidatosTurnoV48(base){


let datos=
await leerV48(
STORES_V48.historico
);



let pesos={};



base=String(base).slice(-2);



for(let i=0;i<datos.length-1;i++){


let actual=
String(datos[i].numero)
.slice(-2);



let siguiente=
String(datos[i+1].numero)
.slice(-2);



if(actual===base){


pesos[siguiente]=
(pesos[siguiente]||0)+3;


}



if(actual===invertirNumeroV48(base)){


pesos[siguiente]=
(pesos[siguiente]||0)+1;


}



}



let ranking=
Object.keys(pesos)
.sort(
(a,b)=>pesos[b]-pesos[a]
);



return ranking;


}

function obtenerSiguienteTurnoV48(turno){

    let mapa={

        "PREVIA":"PRIMERA",

        "PRIMERA":"MATUTINA",

        "MATUTINA":"VESPERTINA",

        "VESPERTINA":"NOCTURNA",

        "NOCTURNA":"PREVIA"

    };


    return mapa[turno] || "PRIMERA";

}



async function analizarTransicionTurnoV48(base, turnoOrigen){

    let destino=obtenerSiguienteTurnoV48(turnoOrigen);

    let datos=await leerV48(STORES_V48.historico);
const ordenTurnos={
    PREVIA:0,
    PRIMERA:1,
    MATUTINA:2,
    VESPERTINA:3,
    NOCTURNA:4
};

datos.sort((a,b)=>{

    if(a.fecha!==b.fecha)
        return a.fecha.localeCompare(b.fecha);

    if(ordenTurnos[a.turno]!==ordenTurnos[b.turno])
        return ordenTurnos[a.turno]-ordenTurnos[b.turno];

    return a.provincia.localeCompare(b.provincia);

});
    let pesos={};
    let encontrados=0;

    base=String(base).slice(-2);

    for(let i=0;i<datos.length-1;i++){

        let actual=datos[i];
        let siguiente=datos[i+1];
if(actual.turno!==turnoOrigen)
    continue;

if(actual.provincia!==siguiente.provincia)
    continue;

if(
    siguiente.turno!==destino &&
    siguiente.turno!=="SIN_TURNO"
)
    continue;
        

        let origen=String(actual.numero).slice(-2);
        let salida=String(siguiente.numero).slice(-2);

        if(origen===base)
            
            encontrados++;
        
            pesos[salida]=(pesos[salida]||0)+10;
    }

        if(origen===base[1]+base[0])
            pesos[salida]=(pesos[salida]||0)+5;

        if(origen[0]===base[0])
            pesos[salida]=(pesos[salida]||0)+2;

        if(origen[1]===base[1])
            pesos[salida]=(pesos[salida]||0)+2;
        
    
    }
    console.log("===== AUDITORIA TRANSICION V48 =====");

console.log("Turno origen:", turnoOrigen);

console.log("Destino buscado:", destino);

console.log("Base analizada:", base);

console.log("Registros totales:", datos.length);

console.log("Coincidencias encontradas:", encontrados);

console.log("Pesos obtenidos:", pesos);

console.log("====================================");

    return Object.keys(pesos).sort((a,b)=>pesos[b]-pesos[a]);
           }
