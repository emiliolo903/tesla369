let APRENDIZAJE_PT_V51 = {};

function registrarAprendizajePTV51(
    provincia,
    turno,
    tipo
){

    if(!APRENDIZAJE_PT_V51[provincia]){
        APRENDIZAJE_PT_V51[provincia]={};
    }

    if(!APRENDIZAJE_PT_V51[provincia][turno]){
        APRENDIZAJE_PT_V51[provincia][turno]={

            aciertos:0,
            invertidos:0,
            cercanos:0,
            errores:0

        };
    }

    APRENDIZAJE_PT_V51[provincia][turno][tipo]++;

}

function obtenerPesoPTV51(
    provincia,
    turno
){

    if(
        !APRENDIZAJE_PT_V51[provincia] ||
        !APRENDIZAJE_PT_V51[provincia][turno]
    ){
        return 0;
    }

    let d =
    APRENDIZAJE_PT_V51[provincia][turno];

    return (

        d.aciertos*3 +

        d.invertidos*2 +

        d.cercanos -

        d.errores

    );

    }

function abrirBaseV48(){


return new Promise((resolve,reject)=>{


let request=indexedDB.open(

DB_NAME_V48,

DB_VERSION_V48

);



request.onupgradeneeded=function(e){


let db=e.target.result;


Object.values(STORES_V48).forEach(store=>{


if(!db.objectStoreNames.contains(store)){


db.createObjectStore(

store,

{
keyPath:"id",
autoIncrement:true
}

);


}


});


};



request.onsuccess=function(e){


dbV48=e.target.result;


let estado=document.getElementById(
"estadoBase"
);


if(estado){

estado.innerText="ACTIVA";

}


resolve(true);


};



request.onerror=function(e){

reject(e);

};


});


}




function guardarV48(store,dato){


return new Promise((resolve,reject)=>{


if(!dbV48){

reject("BASE NO ABIERTA");

return;

}


let tx=dbV48.transaction(

store,

"readwrite"

);


let tabla=tx.objectStore(store);


tabla.add(dato);


tx.oncomplete=()=>resolve(true);


tx.onerror=e=>reject(e);


});


}



function leerV48(store){


return new Promise((resolve,reject)=>{


let tx=dbV48.transaction(

store,

"readonly"

);


let tabla=tx.objectStore(store);


let consulta=tabla.getAll();


consulta.onsuccess=()=>{

resolve(consulta.result);

};


consulta.onerror=e=>reject(e);


});


}

function detectarFechaV48(texto){

    let fecha=texto.match(
        /\d{2}[\/\-]\d{2}[\/\-]\d{4}/
    );


    if(!fecha){

        return new Date()
        .toISOString()
        .slice(0,10);

    }


    let p=fecha[0]
    .replace(/-/g,"/")
    .split("/");


    return p[2]+"-"+p[1]+"-"+p[0];

}



function detectarTurnoV48(texto){

    texto=texto.toUpperCase();


    if(texto.includes("PREVIA"))
        return "PREVIA";

    if(texto.includes("PRIMERA"))
        return "PRIMERA";

    if(texto.includes("MATUTINA"))
        return "MATUTINA";

    if(texto.includes("VESPERTINA"))
        return "VESPERTINA";

    if(texto.includes("NOCTURNA"))
        return "NOCTURNA";


    return "SIN_TURNO";

}



function extraerRegistrosPDFV48(texto,pagina){


    texto=texto.toUpperCase();


    let fecha=detectarFechaV48(texto);

    let turno=detectarTurnoV48(texto);


    let provincias=[

        "CORRIENTES",
        "CIUDAD",
        "BONAERENSE",
        "SANTA FE",
        "CORDOBA",
        "ENTRE RIOS",
        "CHACO"

    ];


    let registros=[];



    for(let provincia of provincias){


        let pos=texto.indexOf(provincia);


        if(pos===-1)
            continue;


        let bloque=
        texto.substring(
            pos,
            pos+300
        );


        let numeros=
        bloque.match(/\b\d{4}\b/g);



        if(!numeros)
            continue;



        for(let numero of numeros){


            registros.push({

                fecha:fecha,

                turno:turno,

                provincia:provincia,

                numero:numero,

                pagina:pagina,

                origen:"OCR_V48"

            });


        }


    }


    return registros;

}

async function evaluarAprendizajeV49(
    turno,
    resultados
){


let predicciones =
await leerV48(
    STORES_V48.predicciones
);


if(predicciones.length===0)
return;


let ultima =
predicciones[predicciones.length-1];


let estadistica =
{

total:1,

acierto:0,

invertido:0,

cerca:0,

error:0

};



for(let provincia in resultados){


let real =
String(resultados[provincia])
.slice(-2);



for(let p of ultima.ambos){

if(real===p){

    estadistica.acierto++;

    registrarAprendizajePTV51(
        provincia,
        turno,
        "aciertos"
    );

}

else if(real===p[1]+p[0]){

    estadistica.invertido++;

    registrarAprendizajePTV51(
        provincia,
        turno,
        "invertidos"
    );

}

else if(
Math.abs(
Number(real)-Number(p)
)===1
){

    estadistica.cerca++;

    registrarAprendizajePTV51(
        provincia,
        turno,
        "cercanos"
    );

}



}


}



if(
estadistica.acierto===0 &&
estadistica.invertido===0 &&
estadistica.cerca===0
){

    estadistica.error++;

    for(let provincia in resultados){

        registrarAprendizajePTV51(
            provincia,
            turno,
            "errores"
        );

    }

}



await guardarV48(

STORES_V48.aprendizaje,

{

fecha:new Date(),

turno:turno,

resultado:estadistica

}

);
    
 // await actualizarPesosIAV50();
    
await actualizarPesosIAV50();
    
await guardarAprendizajePTV51();

console.log(
"APRENDIZAJE RESULTADO V49",
estadistica
);


}

let PESOS_IA_V50 = {

    transicion:30,

    nucleoDominante:20,

    segundoNucleo:12,

    sobreviviente:6,

    tesla:15,

    mismaDecena:2,

    mismaUnidad:2

};

async function actualizarPesosIAV50(){

    let historial = await leerV48(STORES_V48.aprendizaje);

    if(historial.length===0) return;

    let total=0;
    let aciertos=0;
    let invertidos=0;
    let cercanos=0;

    for(let h of historial){

        if(!h.resultado) continue;

        total += h.resultado.total || 0;
        aciertos += h.resultado.acierto || 0;
        invertidos += h.resultado.invertido || 0;
        cercanos += h.resultado.cerca || 0;

    }

    let precision =
    (aciertos + invertidos*0.7 + cercanos*0.3) /
    Math.max(total,1);

    if(precision>=0.80){

        PESOS_IA_V50.transicion =
        Math.min(PESOS_IA_V50.transicion+1,50);

        PESOS_IA_V50.tesla =
        Math.min(PESOS_IA_V50.tesla+1,30);

        PESOS_IA_V50.nucleoDominante =
        Math.min(PESOS_IA_V50.nucleoDominante+1,30);

    }

    if(precision<=0.40){

        PESOS_IA_V50.transicion =
        Math.max(PESOS_IA_V50.transicion-1,10);

        PESOS_IA_V50.tesla =
        Math.max(PESOS_IA_V50.tesla-1,5);

        PESOS_IA_V50.nucleoDominante =
        Math.max(PESOS_IA_V50.nucleoDominante-1,5);

    }

            }

async function construirMemoriaV48(){


let datos =
await leerV48(
STORES_V48.historico
);



MEMORIA_V48={};



for(let d of datos){


if(
!d.fecha ||
!d.turno ||
!d.provincia ||
!d.numero
)

continue;



if(!MEMORIA_V48[d.fecha])
MEMORIA_V48[d.fecha]={};



if(!MEMORIA_V48[d.fecha][d.turno])
MEMORIA_V48[d.fecha][d.turno]={};



if(!MEMORIA_V48[d.fecha][d.turno][d.provincia])
MEMORIA_V48[d.fecha][d.turno][d.provincia]=[];



MEMORIA_V48[d.fecha]
[d.turno]
[d.provincia]
.push(
String(d.numero)
);



}



return MEMORIA_V48;


}





async function construirMatrizTurnosV48(){


await construirMemoriaV48();



MATRIZ_TURNOS_V48={};



let orden=[

"PREVIA",
"PRIMERA",
"MATUTINA",
"VESPERTINA",
"NOCTURNA"

];



for(let fecha in MEMORIA_V48){


let dia=
MEMORIA_V48[fecha];



for(let i=0;i<orden.length;i++){


let origen=orden[i];

let destino=
(i===4)
?
"PREVIA"
:
orden[i+1];



if(
!dia[origen] ||
!dia[destino]
)

continue;



for(let provincia in dia[origen]){


if(!dia[destino][provincia])
continue;



let base=
String(
dia[origen][provincia][0]
)
.slice(-2);



let salida=
String(
dia[destino][provincia][0]
)
.slice(-2);



if(!MATRIZ_TURNOS_V48[base])
MATRIZ_TURNOS_V48[base]={};



if(!MATRIZ_TURNOS_V48[base][salida])
MATRIZ_TURNOS_V48[base][salida]=0;



MATRIZ_TURNOS_V48[base][salida]++;


}


}


}



let estado =
document.getElementById(
"estadoMatriz"
);



if(estado){

estado.innerText="ACTIVA";

}



return MATRIZ_TURNOS_V48;


    }

async function analizarTransicionTurnoV48(
    base,
    turnoOrigen,
    datos = null
){
    let destino =
    obtenerSiguienteTurnoV48(turnoOrigen);

    if(!datos){

    datos =
    await leerV48(
        STORES_V48.historico
    );

    }

    base =
    String(base).slice(-2);

    let pesos = {};

    let inversion =
    base[1] + base[0];

    for(let i=0;i<datos.length;i++){

        let actual = datos[i];

        if(!actual.numero)
            continue;

        if(actual.turno !== turnoOrigen)
            continue;

        if(
            String(actual.numero).slice(-2)!==base &&
            String(actual.numero).slice(-2)!==inversion
        )
            continue;

        for(let j=0;j<datos.length;j++){

            let siguiente = datos[j];

            if(
                siguiente.fecha !== actual.fecha
            )
                continue;

            if(
                siguiente.provincia !== actual.provincia
            )
                continue;

            if(
                siguiente.turno !== destino
            )
                continue;

            let salida =
            String(siguiente.numero).slice(-2);

            if(
                salida===base ||
                salida===inversion
            )
                continue;

            if(!pesos[salida])
                pesos[salida]=0;

            ////////////////////////////////////////////////////
            // PESO HISTÓRICO REAL
            ////////////////////////////////////////////////////

            pesos[salida]+=30;

            ////////////////////////////////////////////////////
            // NÚCLEO DOMINANTE
            ////////////////////////////////////////////////////
            

            if(
                NUCLEO_V48.dominante &&
                salida===NUCLEO_V48.dominante
            ){
                pesos[salida]+=20;
            }

            if(
                NUCLEO_V48.segundo &&
                salida===NUCLEO_V48.segundo
            ){
                pesos[salida]+=12;
            }

            if(
                NUCLEO_V48.sobreviviente &&
                salida===NUCLEO_V48.sobreviviente
            ){
                pesos[salida]+=6;
            }
            

            ////////////////////////////////////////////////////
            // TESLA
            ////////////////////////////////////////////////////

            let tesla =
            aplicarTeslaV48(base);

            if(
                salida===tesla
            ){
                pesos[salida]+=15;
            }

            ////////////////////////////////////////////////////
            // DÍGITOS FUERTES
            ////////////////////////////////////////////////////

            if(
                salida.includes(base[0])
            ){
                pesos[salida]+=2;
            }

            if(
                salida.includes(base[1])
            ){
                pesos[salida]+=2;
            }

        }

    }

    ////////////////////////////////////////////////////
    // MATRIZ HISTÓRICA GENERAL
    ////////////////////////////////////////////////////

    let frecuencia={};

    for(let n in pesos){

        frecuencia[n]=pesos[n];
    }

    let orden =

    Object.keys(frecuencia)

    .sort(
        (a,b)=>
        frecuencia[b]-frecuencia[a]
    );

    ////////////////////////////////////////////////////
    // SI NO ENCUENTRA DATOS
    ////////////////////////////////////////////////////

    if(orden.length===0){

        let todos={};

        for(let d of datos){

            if(!d.numero)
                continue;

            let n=
            String(d.numero).slice(-2);

            todos[n]=
            (todos[n]||0)+1;
        }

        orden=

        Object.keys(todos)

        .sort(
            (a,b)=>
            todos[b]-todos[a]
        );
    }

    ////////////////////////////////////////////////////
    // ELIMINAR DUPLICADOS
    ////////////////////////////////////////////////////

    let final=[];

    for(let n of orden){

        if(
            !final.includes(n)
        ){

            final.push(n);

        }

        if(final.length>=10)
            break;
    }

    console.log(
        "BASE:",
        base
    );

    console.log(
        "PREDICCIÓN:",
        final
    );

    return final;

        }

async function corregirAmbosIAV48(ambos, turnoOrigen){

    let destino = obtenerSiguienteTurnoV48(turnoOrigen);

    let datos = await leerV48(STORES_V48.historico);

    let mejor = ambos;
    let mejorPeso = -1;

    let variantes = [];

    let a = parseInt(ambos[0]);
    let b = parseInt(ambos[1]);

    variantes.push(ambos);

    variantes.push(ambos[1]+ambos[0]);

    variantes.push(
        String(a)+String((b+1)%10)
    );

    variantes.push(
        String(a)+String((b+9)%10)
    );

    variantes.push(
        String((a+1)%10)+String(b)
    );

    variantes.push(
        String((a+9)%10)+String(b)
    );

    variantes=[...new Set(variantes)];

    for(let candidato of variantes){

        let peso=0;

        for(let r of datos){

            if(r.turno!==destino)
                continue;

            let num=String(r.numero).slice(-2);

            if(num===candidato)
                peso+=10;

            if(num===candidato[1]+candidato[0])
                peso+=6;

            if(num[0]===candidato[0])
                peso+=2;

            if(num[1]===candidato[1])
                peso+=2;

        }

        if(peso>mejorPeso){

            mejorPeso=peso;
            mejor=candidato;

        }

    }

    return mejor;

}

async function buscarAcompananteExactoV48(base){

    let datos = await leerV48(
        STORES_V48.historico
    );


    let ranking={};


    base=String(base).slice(-2);



    for(let d of datos){


        if(!d.numero)
            continue;


        let numero =
        String(d.numero).slice(-2);



        // busca números con misma decena

        if(numero[0]===base[0]){


            ranking[numero]=
            (ranking[numero]||0)+3;


        }



        // busca misma unidad


        if(numero[1]===base[1]){


            ranking[numero]=
            (ranking[numero]||0)+2;


        }



        // invertido


        if(numero===base[1]+base[0]){


            ranking[numero]=
            (ranking[numero]||0)+5;


        }



        // diferencia de 1


        let diferencia =
        Math.abs(
            Number(numero)-Number(base)
        );



        if(diferencia===1){


            ranking[numero]=
            (ranking[numero]||0)+4;


        }


    }



    return Object.keys(ranking)
    .sort(
        (a,b)=>
        ranking[b]-ranking[a]
    )
    .slice(0,5);


    }

        // Premio a candidatos fuertes

function guardarErrorIA_V52(
prediccion,
real
){

    prediccion =
    String(prediccion)
    .slice(-2);


    real =
    String(real)
    .slice(-2);



    if(!MEMORIA_ERRORES_IA_V52[prediccion]){

        MEMORIA_ERRORES_IA_V52[prediccion]={

            cerca:0,
            invertido:0,
            cambios:{}

        };

    }



    // invertido

    if(
        real ===
        prediccion[1]+prediccion[0]
    ){

        MEMORIA_ERRORES_IA_V52[prediccion]
        .invertido++;

    }



    // diferencia

    let diferencia =

    Math.abs(
        parseInt(prediccion) -
        parseInt(real)
    );



    if(diferencia<=2){

        MEMORIA_ERRORES_IA_V52[prediccion]
        .cerca++;

    }



    if(
        !MEMORIA_ERRORES_IA_V52[prediccion]
        .cambios[real]
    ){

        MEMORIA_ERRORES_IA_V52[prediccion]
        .cambios[real]=0;

    }


    MEMORIA_ERRORES_IA_V52[prediccion]
    .cambios[real]++;



    localStorage.setItem(
        "MEMORIA_ERRORES_IA_V52",
        JSON.stringify(
            MEMORIA_ERRORES_IA_V52
        )
    );

function aplicarCorreccionErroresIA_V52(
    candidatos
){

    let ranking={};



    for(let n of candidatos){


        n =
        String(n)
        .slice(-2);



        if(!ranking[n])
            ranking[n]=0;



        // peso original

        ranking[n]+=10;



        let memoria =
        MEMORIA_ERRORES_IA_V52[n];



        if(!memoria)
            continue;



        //////////////////////////////////////////////////
        // PREMIAR CORRECCIONES HISTÓRICAS
        //////////////////////////////////////////////////


        for(let cambio in memoria.cambios){


            ranking[cambio] =

            (ranking[cambio] || 0)
            +
            memoria.cambios[cambio] * 3;


        }



        //////////////////////////////////////////////////
        // SI FALLÓ MUCHO INVERTIDO
        //////////////////////////////////////////////////

        if(
            memoria.invertido > 2
        ){

            let invertido =
            n[1]+n[0];


            ranking[invertido] =

            (ranking[invertido] || 0)
            +
            memoria.invertido * 2;

        }



    }



    return Object.keys(ranking)

    .sort(
        (a,b)=>
        ranking[b]-ranking[a]
    );

}

function registrarResultadoV55(
predicho,
real,
turnoOrigen,
turnoDestino
){

predicho=String(predicho).slice(-2);
real=String(real).slice(-2);

let clave=turnoOrigen+"->"+turnoDestino;

if(!MEMORIA_V55.transiciones[clave])
MEMORIA_V55.transiciones[clave]={};

if(!MEMORIA_V55.transiciones[clave][predicho])
MEMORIA_V55.transiciones[clave][predicho]=0;

if(predicho===real){

MEMORIA_V55.aciertos[predicho]=
(MEMORIA_V55.aciertos[predicho]||0)+1;

MEMORIA_V55.transiciones[clave][predicho]+=5;

return;

}

if(predicho===real[1]+real[0]){

MEMORIA_V55.invertidos[predicho]=
(MEMORIA_V55.invertidos[predicho]||0)+1;

MEMORIA_V55.transiciones[clave][predicho]+=3;

return;

}

let d=Math.abs(
Number(predicho)-Number(real)
);

if(d===1){

MEMORIA_V55.cerca1[predicho]=
(MEMORIA_V55.cerca1[predicho]||0)+1;

MEMORIA_V55.transiciones[clave][predicho]+=2;

return;

}

if(d===2){

MEMORIA_V55.cerca2[predicho]=
(MEMORIA_V55.cerca2[predicho]||0)+1;

MEMORIA_V55.transiciones[clave][predicho]+=1;

return;

}

MEMORIA_V55.errores[predicho]=
(MEMORIA_V55.errores[predicho]||0)+1;

MEMORIA_V55.transiciones[clave][predicho]-=1;

}

/////////////////////////////////////////////////////////////
// OBTENER PESO IA
/////////////////////////////////////////////////////////////

function obtenerPesoV55(
numero,
turnoOrigen,
turnoDestino
){

numero=String(numero).slice(-2);

let peso=0;

let clave=
turnoOrigen+"->"+turnoDestino;

if(
MEMORIA_V55.transiciones[clave] &&
MEMORIA_V55.transiciones[clave][numero]
){

peso+=
MEMORIA_V55.transiciones[clave][numero];

}

peso+=
(MEMORIA_V55.aciertos[numero]||0)*4;

peso+=
(MEMORIA_V55.invertidos[numero]||0)*2;

peso+=
(MEMORIA_V55.cerca1[numero]||0);

peso+=
(MEMORIA_V55.cerca2[numero]||0)*0.5;

peso-=
(MEMORIA_V55.errores[numero]||0);

return peso;

    }
    /////////////////////////////////////////////////////////////
// MOTOR DE RANKING IA V55
/////////////////////////////////////////////////////////////

function construirRankingV55(
ranking,
turnoOrigen,
turnoDestino
){

let nuevo={...ranking};

for(let numero in nuevo){

let peso=0;

peso+=nuevo[numero];

peso+=obtenerPesoV55(
numero,
turnoOrigen,
turnoDestino
);

// Premio Tesla

try{

let tesla=
aplicarTeslaV48(numero);

if(tesla===numero)
peso+=8;

}catch(e){}

// Penalizar repetición

if(
MEMORIA_V55.ultimaGeneracion
.includes(numero)
){

peso-=12;

}

// Premio por transición fuerte

let clave=
turnoOrigen+"->"+turnoDestino;

if(
MEMORIA_V55.transiciones[clave] &&
MEMORIA_V55.transiciones[clave][numero]
){

peso+=
MEMORIA_V55.transiciones
[clave][numero];

}

nuevo[numero]=peso;

}

return Object.keys(nuevo)

.sort(
(a,b)=>nuevo[b]-nuevo[a]
);

}
    /////////////////////////////////////////////////////////////
// SELECCIÓN INTELIGENTE V55
/////////////////////////////////////////////////////////////

function seleccionarAmbosV55(
orden
){

let ambos=[];

for(let numero of orden){

numero=
String(numero)
.padStart(2,"0");

if(ambos.includes(numero))
continue;

// evita repetidos

if(
MEMORIA_V55.ultimaGeneracion
.includes(numero)
)
continue;

ambos.push(numero);

if(ambos.length===3)
break;

}

MEMORIA_V55.ultimaGeneracion=
[...ambos];

return ambos;

}
    /////////////////////////////////////////////////////////////
// BLOQUE 4
// CONEXIÓN DEL MOTOR V55
/////////////////////////////////////////////////////////////

function aplicarMotorV55(
ranking,
turnoOrigen,
turnoDestino
){

// Construye el ranking inteligente
let orden = construirRankingV55(
ranking,
turnoOrigen,
turnoDestino
);

// Selecciona los 3 mejores ambos
let ambos = seleccionarAmbosV55(
orden
);

// Devuelve el resultado
return {

orden: orden,

ambos: ambos

};

}

// CORRECTOR DE DESVIACIÓN IA V55.2
// Ajusta errores repetidos del motor
//////////////////////////////////////////////////////

async function aplicarCorrectorDesviacionV55_2(
    ranking
){
    

    let historial =
    await leerV48(
        STORES_V48.predicciones
    );


    let correcciones={};



    let resultados =
    await leerV48(
        STORES_V48.historico
    );



    for(let pred of historial){


        if(!pred.ambos)
            continue;



        // buscar resultado posterior

        let realEncontrado =
        resultados.find(r=>{

            return (
            r.fecha &&
            new Date(r.fecha) >
            new Date(pred.fecha)
            );

        });



        if(!realEncontrado)
            continue;



        let real =
        String(realEncontrado.numero)
        .slice(-2);



        for(let p of pred.ambos){


            p =
            String(p)
            .padStart(2,"0");



            if(p===real)
                continue;



            let cambios=[];



            // cambio unidad

            if(
            p[0]===real[0]
            ){

                cambios.push(real);

            }



            // cambio decena

            if(
            p[1]===real[1]
            ){

                cambios.push(real);

            }



            // invertido

            if(
            p[1]+p[0]===real
            ){

                cambios.push(real);

            }



            for(let c of cambios){

                if(!correcciones[c])
                    correcciones[c]=0;


                correcciones[c]+=3;

            }


        }


    }



    // aplicar pesos aprendidos


    for(let n in correcciones){


        if(!ranking[n])
            ranking[n]=0;


        ranking[n]+=
        correcciones[n];


    }



    console.log(
    "CORRECTOR V55.2",
    correcciones
    );


    return ranking;


            }

    //////////////////////////////////////////////////////
// EVALUADOR INTELIGENTE V55.1
//////////////////////////////////////////////////////

function evaluarPrediccionV55_1(
prediccion,
real
){

let resultado={

directo:false,
invertido:false,
cerca1:false,
cerca2:false,
mismaDecena:false,
mismaUnidad:false

};


real=
String(real)
.padStart(2,"0");


for(let p of prediccion){

p=
String(p)
.padStart(2,"0");


if(p===real){

resultado.directo=true;

}


if(
p[1]+p[0]===real
){

resultado.invertido=true;

}


if(
p[0]===real[0]
){

resultado.mismaDecena=true;

}


if(
p[1]===real[1]
){

resultado.mismaUnidad=true;

}


let diferencia =
Math.abs(
parseInt(p)-parseInt(real)
);


if(diferencia===1){

resultado.cerca1=true;

}


if(diferencia===2){

resultado.cerca2=true;

}


}


return resultado;

}

async function ejecutarBacktestingV49(){

let historial = await leerV48(
    STORES_V48.historico
);


console.log(

historial.length
);

    

    if(!historial || historial.length < 200){

        return {
            error:"No hay suficiente historial"
        };

    }


    let resultado = {

        total:0,

        directo:0,

        invertido:0,

        cerca:0,

        fallo:0

    };
    
    console.log("3 - EMPIEZA LOOP");



    // empieza después de tener datos suficientes

    for(
        
let i = 100;
i < 300;
i++
){


        // datos disponibles hasta ese momento

        let entrenamiento =
        historial.slice(0,i);



        // genera una predicción usando
        // la lógica actual de la app

        let turnoBacktest =

historial[i-1].turno
||
historial[i-1].sorteo
||
"NOCTURNA";



let prediccion =
await generarPrediccionBacktestV50(
    entrenamiento,
    turnoBacktest
);
        
        console.log(
"4 - PREDICCION",
prediccion
);

        let real =
        String(
            historial[i].numero
        ).slice(-2);



        resultado.total++;



        ////////////////////////////////////////////////
// EVALUACION V55.1
////////////////////////////////////////////////

let evaluacion =
evaluarPrediccionV55_1(
    prediccion,
    real
);


console.log(
"EVALUACION V55.1",
evaluacion
);


if(evaluacion.directo){

resultado.directo++;

}

else if(evaluacion.invertido){

resultado.invertido++;

}

else if(
evaluacion.cerca1 ||
evaluacion.cerca2 ||
evaluacion.mismaDecena ||
evaluacion.mismaUnidad
){

resultado.cerca++;

}

else{

resultado.fallo++;

}

    }



    resultado.porcentajeAcierto =

    (
        resultado.directo /
        resultado.total * 100

    ).toFixed(2);



    return resultado;

}

    return Object.keys(ranking)

    .sort(
        (a,b)=>
        ranking[b]-ranking[a]
    )

    .slice(0,3);
