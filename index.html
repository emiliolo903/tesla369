<script>


//////////////////////////////////////////////////
// EMI TESLA PRO V47 FINAL COMPLETO
// INICIO SISTEMA
//////////////////////////////////////////////////



let SISTEMA_V47={


activo:true,

pdfCargado:false,

memoria:false,

matriz:false


};




//////////////////////////////////////////////////
// BLOQUE 2
// BASE PERMANENTE INDEXEDDB V47
//////////////////////////////////////////////////


const DB_NAME_V47 =
"EMI_TESLA_PRO_V47_FINAL";


const DB_VERSION_V47 = 1;



const STORES_V47={


historico:
"historico",


matrizTurnos:
"matrizTurnos",


matrizProvincias:
"matrizProvincias",


acompanantes:
"acompanantes",


aprendizaje:
"aprendizaje",


auditoria:
"auditoria"


};



let dbV47=null;





function abrirBaseV47(){


return new Promise((resolve,reject)=>{


let request=

indexedDB.open(

DB_NAME_V47,

DB_VERSION_V47

);





request.onupgradeneeded=function(e){


let db=e.target.result;



Object.values(STORES_V47)
.forEach(store=>{


if(
!db.objectStoreNames.contains(store)
){


db.createObjectStore(

store,

{

keyPath:"id",

autoIncrement:true

}

);


}


});


};





request.onsuccess=function(e){


dbV47=e.target.result;



document.getElementById(
"estadoBase"
).innerText="ACTIVA";



resolve(true);



};





request.onerror=function(e){


reject(e);


};



});


}








function guardarV47(store,dato){


return new Promise((resolve,reject)=>{


let tx=

dbV47.transaction(

store,

"readwrite"

);



let tabla=

tx.objectStore(store);



tabla.add(dato);




tx.oncomplete=function(){


resolve(true);


};




tx.onerror=function(e){


reject(e);


};



});


}








function leerV47(store){


return new Promise((resolve,reject)=>{


let tx=

dbV47.transaction(

store,

"readonly"

);



let tabla=

tx.objectStore(store);



let consulta=

tabla.getAll();




consulta.onsuccess=function(){


resolve(
consulta.result
);


};




consulta.onerror=function(e){


reject(e);


};



});


}







async function actualizarRegistrosV47(){

await leerV47(
STORES_V47.historico
);



document.getElementById(

"totalRegistros"

datos.length;



}

    //////////////////////////////////////////////////
// BLOQUE 3
// OCR PDF HISTÓRICO V47
//////////////////////////////////////////////////


let OCR_ACTIVO_V47=false;

let DETENER_OCR_V47=false;







function detectarFechaV47(texto){



let fecha=

texto.match(
/\d{2}[\/\-]\d{2}[\/\-]\d{4}/
);



if(!fecha)
return "SIN_FECHA";



let p=

fecha[0]
.replace(/-/g,"/")
.split("/");



return p[2]+"-"+p[1]+"-"+p[0];


}








function detectarTurnoV47(texto){


texto=

texto.toUpperCase();



if(texto.includes("PREVIA"))
return "PREVIA";


if(texto.includes("PRIMERA"))
return "PRIMERA";


if(texto.includes("MATUTINA"))
return "MATUTINA";


if(texto.includes("VESPERTINA"))
return "VESPERTINA";


if(texto.includes("NOCTURNA"))
return "NOCTURNA";



return "SIN_TURNO";


}








async function iniciarOCR(){



let archivo=

document.getElementById(
"archivoPDF"
).files[0];



if(!archivo){


mostrarV47(
"Seleccione PDF"
);


return;


}



DETENER_OCR_V47=false;



let buffer=

await archivo.arrayBuffer();




let pdf=

await pdfjsLib
.getDocument({

data:buffer

})
.promise;





let worker=

await Tesseract
.createWorker("spa");






for(
let pagina=1;
pagina<=pdf.numPages;
pagina++
){



if(DETENER_OCR_V47)
break;




document.getElementById(
"progresoOCR"
).innerHTML=

"Procesando página "+
pagina+
" de "+
pdf.numPages;





let page=

await pdf.getPage(
pagina
);





let viewport=

page.getViewport({

scale:2

});





let canvas=

document.createElement(
"canvas"
);



canvas.width=
viewport.width;



canvas.height=
viewport.height;





await page.render({

canvasContext:

canvas.getContext("2d"),

viewport

}).promise;






let lectura=

await worker.recognize(canvas);



let texto=

lectura.data.text;





await guardarV47(

STORES_V47.historico,

{


pagina:pagina,


texto:texto.toUpperCase(),


fecha:detectarFechaV47(texto),


turno:detectarTurnoV47(texto),


origen:"PDF_OCR_V47"


}

);



}





await worker.terminate();





document.getElementById(
"estadoMemoria"
).innerText=

"APRENDIENDO";



await actualizarRegistrosV47();



mostrarV47(

"✅ PDF GUARDADO EN MEMORIA"

);



}








function detenerOCR(){


DETENER_OCR_V47=true;


mostrarV47(

}
    //////////////////////////////////////////////////
// BLOQUE 4
// MEMORIA HISTÓRICA V47
//////////////////////////////////////////////////


let MEMORIA_V47={};



async function construirMemoriaV47(){


let datos=

await leerV47(
STORES_V47.historico
);



MEMORIA_V47={};





for(let d of datos){



if(!MEMORIA_V47[d.fecha]){


MEMORIA_V47[d.fecha]={};


}





if(!MEMORIA_V47[d.fecha][d.turno]){


MEMORIA_V47[d.fecha][d.turno]={};


}





if(!MEMORIA_V47[d.fecha][d.turno][d.provincia]){


MEMORIA_V47[d.fecha][d.turno][d.provincia]=[];

}



if(d.numero){


MEMORIA_V47[d.fecha][d.turno][d.provincia]
.push(d.numero);


}



}




return MEMORIA_V47;



}
    //////////////////////////////////////////////////
// BLOQUE 5
// MATRIZ PREVIA-PRIMERA-MATUTINA
//////////////////////////////////////////////////



let MATRIZ_TURNOS_V47={};




async function construirMatrizTurnosV47(){


await construirMemoriaV47();



MATRIZ_TURNOS_V47={};




let orden=[


"PREVIA",

"PRIMERA",

"MATUTINA",

"VESPERTINA",

"NOCTURNA"


];






for(let fecha in MEMORIA_V47){



let dia=

MEMORIA_V47[fecha];





for(let i=0;i<orden.length;i++){



let origen=

orden[i];



let destino;



if(i===4)

destino="PREVIA";

else

destino=orden[i+1];







if(
!dia[origen] ||
!dia[destino]
)

continue;





for(let provincia in dia[origen]){



let numeroOrigen=

String(
dia[origen][provincia][0]
)
.slice(-2);




let numeroDestino=

String(
dia[destino][provincia][0]
)
.slice(-2);







if(!MATRIZ_TURNOS_V47[numeroOrigen]){


MATRIZ_TURNOS_V47[numeroOrigen]={};


}




MATRIZ_TURNOS_V47[numeroOrigen][numeroDestino]=


(MATRIZ_TURNOS_V47[numeroOrigen][numeroDestino]||0)+1;



}



}



}





await guardarV47(

STORES_V47.matrizTurnos,

{


fecha:new Date(),

matriz:MATRIZ_TURNOS_V47


}

);



document.getElementById(
"estadoMatriz"
).innerText="ACTIVA";



return MATRIZ_TURNOS_V47;



}
    //////////////////////////////////////////////////
// BLOQUE 6
// PROVINCIA X PROVINCIA
// CONTINUIDAD E INVERTIDOS
//////////////////////////////////////////////////


let MATRIZ_PROV_V47={};




async function construirMatrizProvinciasV47(){


let datos=

await leerV47(
STORES_V47.historico
);




MATRIZ_PROV_V47={};






for(let i=0;i<datos.length-1;i++){



let actual=

datos[i];



let siguiente=

datos[i+1];





if(
!actual.numero ||
!siguiente.numero
)

continue;






let base=

String(actual.numero)
.slice(-2);



let salida=

String(siguiente.numero)
.slice(-2);





let clave=

actual.provincia+
" → "+
siguiente.provincia;







if(!MATRIZ_PROV_V47[clave]){


MATRIZ_PROV_V47[clave]={};


}





if(!MATRIZ_PROV_V47[clave][base]){


MATRIZ_PROV_V47[clave][base]={};


}





if(
!MATRIZ_PROV_V47[clave][base][salida]
){


MATRIZ_PROV_V47[clave][base][salida]=0;


}





MATRIZ_PROV_V47[clave][base][salida]++;



}






await guardarV47(

STORES_V47.matrizProvincias,

{


fecha:new Date(),

matriz:MATRIZ_PROV_V47


}

);



return MATRIZ_PROV_V47;



}







function pesoMovimientoV47(base,salida){



let peso=0;



// continuidad

if(base===salida)

peso+=5;




// invertido

if(

base[0]===salida[1]

&&

base[1]===salida[0]

)

peso+=3;




return peso;


}
    //////////////////////////////////////////////////
// BLOQUE 7
// NÚCLEO DOMINANTE V47
//////////////////////////////////////////////////


let NUCLEO_V47={

dominante:null,

segundo:null,

sobreviviente:null,

ranking:{}

};






async function analizarNucleoV47(){


let datos=

await leerV47(
STORES_V47.historico
);



let frecuencia={};



for(let d of datos){


if(!d.numero)
continue;



let n=

String(d.numero)
.slice(-2);



frecuencia[n]=

(frecuencia[n]||0)+1;



}






let ranking=

Object.keys(frecuencia)
.sort(

(a,b)=>

frecuencia[b]-
frecuencia[a]

);






NUCLEO_V47.ranking=

frecuencia;



NUCLEO_V47.dominante=

ranking[0] || null;



NUCLEO_V47.segundo=

ranking[1] || null;





// sobreviviente

for(let n of ranking){



if(
n!==NUCLEO_V47.dominante
&&
n!==NUCLEO_V47.segundo
){



NUCLEO_V47.sobreviviente=n;

break;


}



}





return NUCLEO_V47;



}
    //////////////////////////////////////////////////
// BLOQUE 8
// ACOMPAÑANTE AVANZADO
//////////////////////////////////////////////////



async function buscarAcompananteV47(base){


let datos=

await leerV47(
STORES_V47.historico
);



let fuerza={};





for(let i=0;i<datos.length-1;i++){



let actual=

String(datos[i].numero)
.slice(-2);



let siguiente=

String(datos[i+1].numero)
.slice(-2);




if(actual!==base)

continue;




if(!fuerza[siguiente]){


fuerza[siguiente]={

frecuencia:0,

continuidad:0,

invertido:0


};


}




fuerza[siguiente].frecuencia++;





if(base===siguiente){


fuerza[siguiente].continuidad++;


}




if(

base[0]===siguiente[1]

&&

base[1]===siguiente[0]

){


fuerza[siguiente].invertido++;


}




}







let ranking=[];



for(let n in fuerza){


let peso=

fuerza[n].frecuencia

+

(fuerza[n].continuidad*5)

+

(fuerza[n].invertido*3);





ranking.push({

numero:n,

peso:peso

});


}






ranking.sort(

(a,b)=>

b.peso-a.peso

);





return ranking
.slice(0,5)
.map(x=>x.numero);



}







async function quitarRepetidosV47(lista){



let datos=

await leerV47(
STORES_V47.historico
);



let usados={};



for(let d of datos){


if(d.numero){


usados[
String(d.numero).slice(-2)
]=true;


}


}





return lista.filter(

x=>

!usados[x]

);



}
    //////////////////////////////////////////////////
// BLOQUE 9
// GENERADOR FINAL V47
//////////////////////////////////////////////////



const TESLA_V47={


0:["0","0"],

1:["0","0"],

2:["5","7"],

3:["8","0"],

4:["6","9"],

5:["2","7"],

6:["4","9"],

7:["5","2"],

8:["3","0"],

9:["3","4"]


};








function aplicarTeslaV47(numero){



let salida="";



for(let d of numero){


if(TESLA_V47[d]){


salida+=TESLA_V47[d][0];


}


}



return salida.slice(0,2);



}







async function generarResultadoIA(){



let nucleo=

await analizarNucleoV47();





let candidatos=[];





if(nucleo.dominante)

candidatos.push(
nucleo.dominante
);



if(nucleo.segundo)

candidatos.push(
nucleo.segundo
);



if(nucleo.sobreviviente)

candidatos.push(
nucleo.sobreviviente
);






for(let n of candidatos){



let acomp=

await buscarAcompananteV47(n);



candidatos.push(...acomp);



}





for(let n of [...candidatos]){


let tesla=

aplicarTeslaV47(n);



if(tesla)

candidatos.push(tesla);



}







candidatos=

[...new Set(candidatos)];





let finales=

await quitarRepetidosV47(
candidatos
);





let ambos=

finales.slice(0,3);





let principal=

ambos[0] || candidatos[0];







let ternos=[

principal+principal[0],

principal+principal[1]

];







let cuaternos=[

principal+
principal[0]+
principal[1],


principal+
principal[1]+
principal[0]

];







mostrarV47(`


🧠 EMI TESLA PRO V47 FINAL


🔥 AMBOS


1) ${ambos[0]||"--"}

2) ${ambos[1]||"--"}

3) ${ambos[2]||"--"}



⭐ AMBOS PRINCIPAL


${principal}



🎯 TERNOS


${ternos.join("\n")}



🏆 CUATERNOS


${cuaternos.join("\n")}




🧠 NÚCLEO DOMINANTE

${nucleo.dominante}



⭐ SEGUNDO NÚCLEO

${nucleo.segundo}



🛡 SOBREVIVIENTE

${nucleo.sobreviviente}



ANÁLISIS:

✔ PDF

✔ MATRIZ

✔ PROVINCIAS

✔ CONTINUIDAD

✔ INVERTIDOS

✔ TESLA 3-6-9


`);



}
