<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EMI Tesla PRO V31 - IA MEMORY</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{font-family:Arial;background:#111;color:#fff;padding:15px}
button,select,input{padding:8px;margin:4px}
.box{border:1px solid #444;padding:10px;margin-top:10px;max-height:300px;overflow:auto;white-space:pre-wrap}
</style>
</head>

<body>

<h2>🚀 EMI Tesla PRO V31 - IA MEMORIA DINÁMICA</h2>

<h3>🧠 Carga Manual</h3>

<select id="turnoManual">
<option>PREVIA</option>
<option>PRIMERA</option>
<option>MATUTINA</option>
<option>VESPERTINA</option>
<option>NOCTURNA</option>
</select>

<input id="numsManual" placeholder="Ej: 1234 5678 9012">
<button onclick="addManual()">➕ Guardar</button>

<hr>

<h3>📄 OCR PDF</h3>
<input type="file" id="fileInput">
<button onclick="processPDF()">📥 Cargar PDF</button>

<hr>

<h3>🔮 Predicción IA</h3>

<select id="turnoPredict">
<option>PREVIA</option>
<option>PRIMERA</option>
<option>MATUTINA</option>
<option>VESPERTINA</option>
<option>NOCTURNA</option>
</select>

<button onclick="predict()">🔮 Analizar IA</button>
<button onclick="clearDB()">🧹 Limpiar</button>

<div class="box" id="out"></div>

<script>

//////////////////////////////
// 💾 BASE GLOBAL
//////////////////////////////

let db = JSON.parse(localStorage.getItem("v31_db") || "[]");

function save(){
localStorage.setItem("v31_db", JSON.stringify(db));
}

//////////////////////////////
// ➕ MANUAL INPUT
//////////////////////////////

function addManual(){

const turno = document.getElementById("turnoManual").value;
const nums = document.getElementById("numsManual").value.match(/\d{4}/g);

if(!nums) return alert("Sin números válidos");

db.push({
fecha:new Date().toISOString().split("T")[0],
turno,
numeros:nums,
origen:"manual"
});

save();
alert("Guardado en base");
}

//////////////////////////////
// 📄 OCR PDF
//////////////////////////////

async function processPDF(){

const file=document.getElementById("fileInput").files[0];
if(!file) return alert("Subí PDF");

const reader=new FileReader();

reader.onload=async function(e){

const pdfData=new Uint8Array(e.target.result);
const pdf=await pdfjsLib.getDocument({data:pdfData}).promise;

for(let i=1;i<=pdf.numPages;i++){

const page=await pdf.getPage(i);
const canvas=document.createElement("canvas");
const ctx=canvas.getContext("2d");

const vp=page.getViewport({scale:2});
canvas.width=vp.width;
canvas.height=vp.height;

await page.render({canvasContext:ctx,viewport:vp}).promise;

const img=canvas.toDataURL();

await ocrPage(img,i);
}

save();
alert("PDF cargado a base");
};

reader.readAsArrayBuffer(file);
}

//////////////////////////////
// 👁 OCR
//////////////////////////////

async function ocrPage(img,page){

const worker=await Tesseract.createWorker("eng");
await worker.loadLanguage("eng+spa");
await worker.initialize("eng+spa");

const res=await worker.recognize(img);
await worker.terminate();

const text=res.data.text;
const nums=text.match(/\d{4}/g);

if(nums){

db.push({
fecha:"pagina "+page,
turno:detectTurn(text),
numeros:nums,
origen:"ocr"
});
}
}

function detectTurn(t){
t=t.toLowerCase();
if(t.includes("previa"))return "PREVIA";
if(t.includes("primera"))return "PRIMERA";
if(t.includes("matutina"))return "MATUTINA";
if(t.includes("vespertina"))return "VESPERTINA";
if(t.includes("nocturna"))return "NOCTURNA";
return "DESCONOCIDO";
}

//////////////////////////////
// 🧠 IA CON PESO DINÁMICO
//////////////////////////////

function predict(){

const turno=document.getElementById("turnoPredict").value;

let freq={};
let recency={};
let transition={};

// 🔥 recencia (últimos registros pesan más)
let last=db.slice(-30);

// 📊 frecuencia global
db.forEach(d=>{
d.numeros.forEach(n=>{
freq[n]=(freq[n]||0)+1;
});
});

// 🔗 transición entre registros consecutivos
for(let i=0;i<db.length-1;i++){
let a=db[i];
let b=db[i+1];

a.numeros.forEach(x=>{
b.numeros.forEach(y=>{
transition[x]=(transition[x]||0)+1;
});
});
}

// 🧠 recencia por número
last.forEach(d=>{
d.numeros.forEach(n=>{
recency[n]=(recency[n]||0)+1;
});
});

// 🔮 score final
let ranked=Object.entries(freq).map(([num,f])=>{

let r=recency[num]||0;
let t=transition[num]||0;

// 💥 PESO DINÁMICO REAL
let score=(f*5)+(r*10)+(t*3);

return {num,score};
});

ranked.sort((a,b)=>b.score-a.score);

let top=ranked.slice(0,15);

let cuaterno=top.slice(0,4).map(x=>x.num);
let terno=top.slice(0,3).map(x=>x.num);
let ambos=top.slice(0,6).map(x=>x.num);

document.getElementById("out").innerText=
`
🔮 V31 IA PREDICCIÓN (PESO DINÁMICO)

🎯 TURNO: ${turno}

🔥 CUATERNO:
${cuaterno.join(" - ")}

⚡ TERNO:
${terno.join(" - ")}

💥 AMBOS:
${ambos.join(" - ")}

📊 BASE TOTAL: ${db.length}
🧠 MODELO: frecuencia + recencia + transición
`;
}

//////////////////////////////
// 🧹 RESET
//////////////////////////////

function clearDB(){
db=[];
save();
document.getElementById("out").innerText="";
}

</script>

</body>
</html>
