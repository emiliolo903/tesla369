<script>
  //////////////////////////////////////////////////
// EMI TESLA PRO V38
// BASE INDEXEDDB
//////////////////////////////////////////////////

const DB_NAME="EMI_TESLA_V38";

const DB_VERSION=1;

const STORE_NAME="historico";


let db=null;

let pararOCR=false;



function abrirBase(){


return new Promise((resolve,reject)=>{


let request=indexedDB.open(
DB_NAME,
DB_VERSION
);



request.onupgradeneeded=function(e){


let base=e.target.result;



if(!base.objectStoreNames.contains(STORE_NAME)){


let tabla=base.createObjectStore(
STORE_NAME,
{
keyPath:"id",
autoIncrement:true
}
);



tabla.createIndex(
"provincia",
"provincia",
{unique:false}
);



tabla.createIndex(
"turno",
"turno",
{unique:false}
);


}


};




request.onsuccess=function(e){

db=e.target.result;

resolve(db);

};



request.onerror=function(e){

reject(e);

};


});


}






function guardarRegistro(datos){


return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readwrite"
);



let tabla=tx.objectStore(
STORE_NAME
);



tabla.add(datos);



tx.oncomplete=function(){

resolve(true);

};



tx.onerror=function(e){

reject(e);

};


});


}







function leerBase(){


return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readonly"
);



let tabla=tx.objectStore(
STORE_NAME
);



let datos=tabla.getAll();



datos.onsuccess=function(){

resolve(datos.result);

};



datos.onerror=function(e){

reject(e);

};


});


}






async function contarRegistros(){

let datos=await leerBase();

return datos.length;

}






function mostrar(texto){


let salida=document.getElementById(
"resultado"
);



if(salida){

salida.innerText=texto;

}


}







async function guardarManual(){


let texto=document.getElementById(
"numerosManual"
).value;



let provincia=document.getElementById(
"provinciaManual"
).value;



let turno=document.getElementById(
"turnoManual"
).value;



let numeros=texto.match(/\d{4}/g);



if(!numeros){


mostrar(
"⚠️ Ingrese números de 4 cifras"
);


return;

}





for(let numero of numeros){


await guardarRegistro({


fecha:new Date()
.toISOString()
.split("T")[0],


provincia,

turno,

numero,

origen:"MANUAL"


});


}




let total=await contarRegistros();



document.getElementById(
"total"
).innerText=total;



mostrar(

"✅ Datos guardados\n\n"+
"Provincia: "+provincia+
"\nTurno: "+turno+
"\nTotal registros: "+total

);


  }
  //////////////////////////////////////////////////
// EMI TESLA PRO V38
// OCR HISTÓRICO LIMPIO
//////////////////////////////////////////////////


async function iniciarOCR(){


let archivo=

document.getElementById("archivoPDF").files[0];



if(!archivo){

alert("Seleccione un PDF");

return;

}



pararOCR=false;



try{


document.getElementById("estadoOCR").innerText=

"PROCESANDO";



let buffer=

await archivo.arrayBuffer();



let pdf=

await pdfjsLib.getDocument({

data:buffer

}).promise;




let worker=

await Tesseract.createWorker("spa");





for(let p=1;p<=pdf.numPages;p++){



if(pararOCR)

break;




let pagina=

await pdf.getPage(p);



let viewport=

pagina.getViewport({

scale:3

});



let canvas=

document.createElement("canvas");



canvas.width=

viewport.width;



canvas.height=

viewport.height;



let ctx=

canvas.getContext("2d");





await pagina.render({

canvasContext:ctx,

viewport

}).promise;




let lectura=

await worker.recognize(canvas);



let texto=

lectura.data.text.toUpperCase();





let numeros=

texto.match(/\d{4}/g)||[];





let provincia=

detectarProvincia(texto);



let turno=

detectarTurno(texto);






for(let numero of numeros){



await guardarRegistro({


fecha:new Date()

.toISOString()

.split("T")[0],


provincia,

turno,

numero,

origen:"OCR"


});


}





document.getElementById("estadoOCR").innerText=

"Página "+p+" / "+pdf.numPages;



}






await worker.terminate();



let total=

await contarRegistros();



document.getElementById("total").innerText=

total;



mostrar(

"✅ OCR FINALIZADO\n\n"+

"Registros guardados: "+total

);



}

catch(e){


mostrar(

"❌ ERROR OCR\n\n"+e

);


}



}





function detenerOCR(){

pararOCR=true;

}





function detectarProvincia(t){


if(t.includes("CORRIENTES"))

return "CORRIENTES";


if(t.includes("SANTA FE"))

return "SANTA FE";


if(t.includes("CORDOBA"))

return "CORDOBA";


if(t.includes("CHACO"))

return "CHACO";


if(t.includes("ENTRE RIOS"))

return "ENTRE RIOS";


if(t.includes("BONAERENSE"))

return "BONAERENSE";


if(t.includes("CIUDAD"))

return "CIUDAD";


return "DESCONOCIDA";


}





function detectarTurno(t){


if(t.includes("PREVIA"))

return "PREVIA";


if(t.includes("PRIMERA"))

return "PRIMERA";


if(t.includes("MATUTINA"))

return "MATUTINA";


if(t.includes("VESPERTINA"))

return "VESPERTINA";


if(t.includes("NOCTURNA"))

return "NOCTURNA";


return "DESCONOCIDO";


  }

// EMI TESLA PRO V38
// MOTOR IA MATRIZ
//////////////////////////////////////////////////



async function generarJuegoCompletoIA(){


let datos=

await leerBase();



if(datos.length<5){

mostrar("⚠️ Falta historial");

return;

}



let ranking={};



datos.forEach(r=>{


let n=r.numero;



if(!ranking[n])

ranking[n]=0;



ranking[n]+=10;



if(r.turno==="NOCTURNA")

ranking[n]+=20;



});





let lista=

Object.keys(ranking)

.sort((a,b)=>

ranking[b]-ranking[a]

);





let principal=

lista.slice(0,4);



let apoyo=

lista.slice(4,8);






mostrar(`

🧠 EMI TESLA PRO V38 IA



🔥 CUATERNO PRINCIPAL

${principal.join(" - ")}



🟡 CUATERNO APOYO

${apoyo.join(" - ")}



⚡ TERNO PRINCIPAL

${principal.slice(0,3).join(" - ")}



🟡 TERNO APOYO

${apoyo.slice(0,3).join(" - ")}



💥 AMBOS PRINCIPAL

${principal.map(x=>x.slice(-2)).join(" - ")}



🟡 AMBOS APOYO

${apoyo.map(x=>x.slice(-2)).join(" - ")}



📊 Registros:

${datos.length}


`);

}







async function generarTeslaIA(){


let datos=

await leerBase();



let mapa={};



datos.forEach(r=>{


let a=r.numero.slice(-2);



mapa[a]=(mapa[a]||0)+1;



});




let orden=

Object.keys(mapa)

.sort((a,b)=>

mapa[b]-mapa[a]

);



mostrar(`

🚀 TESLA V38



🔥 Principal:

${orden[0]||"--"}



🟡 Apoyo:

${orden[1]||"--"}



⚡ Tercero:

${orden[2]||"--"}



`);

}





async function analizarMatriz(){


let datos=

await leerBase();



let matriz={};



datos.forEach(a=>{


datos.forEach(b=>{


if(

a.provincia!==b.provincia &&

a.numero.slice(-2)===b.numero.slice(-2)

){


let clave=

a.provincia+" → "+b.provincia;



matriz[clave]=

(matriz[clave]||0)+1;


}



});



});




let salida=

"🌎 MATRIZ PROVINCIAL\n\n";



Object.keys(matriz)

.sort((a,b)=>

matriz[b]-matriz[a]

)

.slice(0,20)

.forEach(x=>{


salida+=

x+" = "+matriz[x]+"\n";


});



mostrar(salida);



}






async function analizarTransicionIA(){


let datos=

await leerBase();



let turnos=[

"PREVIA",

"PRIMERA",

"MATUTINA",

"VESPERTINA",

"NOCTURNA"

];



let salida=

"🔄 TRANSICIÓN IA\n\n";



datos.forEach(r=>{


let pos=

turnos.indexOf(r.turno);



if(pos>=0){


let siguiente=

turnos[(pos+1)%5];


salida+=

r.turno+

" → "+

siguiente+

" : "+

r.numero.slice(-2)

+"\n";


}



});



mostrar(salida);



   }
  //////////////////////////////////////////////////
// EMI TESLA PRO V38
// FINAL DEL SISTEMA
//////////////////////////////////////////////////



async function buscarAcompananteV2(){


let entrada=

document.getElementById("numerosManual").value.trim();



if(!/^\d{4}$/.test(entrada)){


mostrar("⚠️ Ingrese cuaterno de 4 cifras");

return;

}



let datos=

await leerBase();



let ambos=

entrada.slice(-2);



let mapa={};



datos.forEach(r=>{


if(r.numero.slice(-2)===ambos){


let inicio=

r.numero.slice(0,2);



mapa[inicio]=(mapa[inicio]||0)+1;



}



});





let orden=

Object.keys(mapa)

.sort((a,b)=>

mapa[b]-mapa[a]

);





mostrar(`

🎯 ACOMPAÑANTE EXACTO V2



Base:

${entrada}



🔥 Principal:

${orden[0]||"--"}${ambos}



🟡 Apoyo:

${orden[1]||"--"}${ambos}



`);

}





async function analizarPatrones(){


let datos=

await leerBase();



let mapa={};



datos.forEach(r=>{


let a=r.numero.slice(-2);



mapa[a]=(mapa[a]||0)+1;



});




mostrar(

"🔬 PATRONES HISTÓRICOS\n\n"+

Object.keys(mapa)

.sort((a,b)=>mapa[b]-mapa[a])

.slice(0,20)

.map(x=>x+" = "+mapa[x])

.join("\n")

);



}







async function analizarNocturna(){


let datos=

await leerBase();



let mapa={};



datos.filter(r=>r.turno==="NOCTURNA")

.forEach(r=>{


let a=r.numero.slice(-2);



mapa[a]=(mapa[a]||0)+1;



});



mostrar(

"🌙 PATRONES NOCTURNA\n\n"+

Object.keys(mapa)

.sort((a,b)=>mapa[b]-mapa[a])

.slice(0,20)

.map(x=>x+" = "+mapa[x])

.join("\n")

);



}







window.onload=async function(){


try{


await abrirBase();



let total=

await contarRegistros();



document.getElementById("total").innerText=

total;



document.getElementById("estadoBase").innerText=

"ACTIVA";



mostrar(`

🚀 EMI TESLA PRO V38 IA MATRIZ


✅ Base activa

✅ OCR listo

✅ Motor IA listo

✅ Matriz lista

${total}


`);



}

catch(e){


mostrar("❌ Error inicio\n"+e);


}


}


</script>
