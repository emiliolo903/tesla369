<script>

//////////////////////////////////////////////////
// EMI TESLA PRO V38
// BASE PERMANENTE INDEXEDDB
//////////////////////////////////////////////////

const DB_NAME="EMI_TESLA_V38";

const STORE_NAME="registros";

let db=null;



function abrirBase(){


return new Promise((resolve,reject)=>{


let request=

indexedDB.open(

DB_NAME,

1

);



request.onupgradeneeded=function(e){


let base=e.target.result;



if(!base.objectStoreNames.contains(STORE_NAME)){


let tabla=

base.createObjectStore(

STORE_NAME,

{

keyPath:"id",

autoIncrement:true

}

);



tabla.createIndex(

"provincia",

"provincia",

{unique:false}

);


tabla.createIndex(

"turno",

"turno",

{unique:false}

);



}



};



request.onsuccess=function(e){


db=e.target.result;

resolve(db);


};



request.onerror=function(e){

reject(e);

};



});


}








function guardarRegistro(datos){


return new Promise((resolve,reject)=>{


let tx=

db.transaction(

STORE_NAME,

"readwrite"

);



let tabla=

tx.objectStore(

STORE_NAME

);



tabla.add(datos);



tx.oncomplete=function(){

resolve(true);

};



tx.onerror=function(e){

reject(e);

};



});


}








function leerBase(){


return new Promise((resolve,reject)=>{


let tx=

db.transaction(

STORE_NAME,

"readonly"

);



let tabla=

tx.objectStore(

STORE_NAME

);



let consulta=

tabla.getAll();



consulta.onsuccess=function(){


resolve(

consulta.result

);


};



consulta.onerror=function(e){

reject(e);

};



});


}







async function contarRegistros(){


let datos=

await leerBase();



return datos.length;


}







function mostrarResultado(texto){


let salida=

document.getElementById(

"resultado"

);



if(salida)

salida.innerText=texto;


}







async function guardarManual(){


let numero=

document.getElementById(

"numero"

).value;



let provincia=

document.getElementById(

"provincia"

).value;



let turno=

document.getElementById(

"turno"

).value;




if(!/^\d{4}$/.test(numero)){


alert(

"Ingrese 4 cifras"

);


return;

}



await guardarRegistro({


fecha:

new Date()

.toISOString()

.split("T")[0],


provincia,

turno,

numero,

origen:"MANUAL"


});



let total=

await contarRegistros();



document.getElementById(

"total"

).innerText=total;



mostrarResultado(

"✅ Registro guardado\n\n"+

numero

);



}


</script>
<script>

//////////////////////////////////////////////////
// EMI TESLA PRO V38
// OCR PDF INTEGRADO
//////////////////////////////////////////////////

let detenerLectura=false;




async function procesarPDF(){



let archivo=

document.getElementById(

"archivoPDF"

).files[0];



if(!archivo){


alert(

"Seleccione PDF"

);


return;

}



detenerLectura=false;



try{


let datos=

await archivo.arrayBuffer();



let pdf=

await pdfjsLib.getDocument({

data:datos

}).promise;




let worker=

await Tesseract.createWorker(

"spa"

);



for(

let pagina=1;

pagina<=pdf.numPages;

pagina++

){



if(detenerLectura)

break;



let page=

await pdf.getPage(pagina);



let viewport=

page.getViewport({

scale:2

});



let canvas=

document.createElement(

"canvas"

);



canvas.width=

viewport.width;



canvas.height=

viewport.height;



await page.render({

canvasContext:

canvas.getContext("2d"),

viewport

}).promise;



let resultado=

await worker.recognize(

canvas

);



let texto=

resultado.data.text.toUpperCase();



let numeros=

texto.match(/\d{4}/g)||[];




for(let numero of numeros){



await guardarRegistro({


fecha:

new Date()

.toISOString()

.split("T")[0],


provincia:

detectarProvincia(texto),


turno:

detectarTurno(texto),


numero,

origen:"OCR"



});


}



document.getElementById(

"estadoOCR"

).innerText=

"Página "+pagina+"/"+pdf.numPages;



}



await worker.terminate();



let total=

await contarRegistros();



document.getElementById(

"total"

).innerText=

total;



mostrarResultado(

"✅ PDF PROCESADO\n\n"+

"Registros: "+total

);



}

catch(error){


mostrarResultado(

"❌ Error OCR\n\n"+error

);


}



}





function detenerOCR(){

detenerLectura=true;

}







function detectarProvincia(texto){


if(texto.includes("CORRIENTES"))
return "CORRIENTES";


if(texto.includes("SANTA FE"))
return "SANTA FE";


if(texto.includes("CORDOBA"))
return "CORDOBA";


return "DESCONOCIDA";


}





function detectarTurno(texto){


if(texto.includes("PREVIA"))
return "PREVIA";


if(texto.includes("PRIMERA"))
return "PRIMERA";


if(texto.includes("MATUTINA"))
return "MATUTINA";


if(texto.includes("VESPERTINA"))
return "VESPERTINA";


if(texto.includes("NOCTURNA"))
return "NOCTURNA";


return "DESCONOCIDO";


}


</script>
<script>

//////////////////////////////////////////////////
// EMI TESLA PRO V38
// MOTOR IA
//////////////////////////////////////////////////


async function analizarIA(){


let provincia=

document.getElementById("provincia").value;


let turno=

document.getElementById("turno").value;



let datos=

await leerBase();



let siguiente=

turnoSiguiente(turno);



let historial=

datos.filter(x=>

x.provincia===provincia &&

x.turno===siguiente

);



if(historial.length===0){


mostrarResultado(

"⚠️ Sin historial suficiente"

);


return;


}



let mapa={};



historial.forEach(r=>{


mapa[r.numero]=

(mapa[r.numero]||0)+1;


});



let ranking=

Object.keys(mapa)

.sort((a,b)=>

mapa[b]-mapa[a]

);



let principal=

ranking[0]||"--";


let apoyo=

ranking[1]||"--";




mostrarResultado(

"🧠 EMI TESLA PRO V38\n\n"+

"Transición:\n"+

turno+

" → "+

siguiente+

"\n\n"+

"🔥 Cuaterno principal\n"+

principal+

"\n\n"+

"🟡 Cuaterno apoyo\n"+

apoyo+

"\n\n"+

"💥 Ambos\n"+

principal.slice(-2)

);


}







function turnoSiguiente(turno){


let lista=[

"PREVIA",

"PRIMERA",

"MATUTINA",

"VESPERTINA",

"NOCTURNA"

];



let p=

lista.indexOf(turno);



if(p===4)

return "PREVIA";



return lista[p+1];


}








//////////////////////////////////////////////////
// MATRIZ
//////////////////////////////////////////////////


async function generarMatriz(){


let provincia=

document.getElementById("provincia").value;



let datos=

await leerBase();



let mapa={};



datos

.filter(x=>

x.provincia===provincia

)

.forEach(r=>{


let ambos=

r.numero.slice(-2);



mapa[ambos]=

(mapa[ambos]||0)+1;


});



let salida=

"🌎 MATRIZ "+provincia+"\n\n";



Object.keys(mapa)

.sort((a,b)=>

mapa[b]-mapa[a]

)

.slice(0,20)

.forEach(x=>{


salida+=

x+" = "+mapa[x]+" veces\n";


});



mostrarResultado(salida);



}








//////////////////////////////////////////////////
// ACOMPAÑANTE EXACTO
//////////////////////////////////////////////////


async function buscarAcompanante(){



let numero=

document.getElementById("numero").value;



let provincia=

document.getElementById("provincia").value;



let datos=

await leerBase();



let objetivo=

numero.slice(-2);



let mapa={};



datos

.filter(x=>

x.provincia===provincia &&

x.numero.slice(-2)===objetivo

)

.forEach(r=>{


let inicio=

r.numero.slice(0,2);



mapa[inicio]=

(mapa[inicio]||0)+1;



});




let orden=

Object.keys(mapa)

.sort((a,b)=>

mapa[b]-mapa[a]

);



mostrarResultado(

"🎯 ACOMPAÑANTE EXACTO\n\n"+

"Base: "+numero+

"\n\nPrincipal: "+

(orden[0]||"--")+

"\nRespaldo: "+

(orden[1]||"--")

);



}


</script>
