<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Tesla PRO V35.1 IA HISTORICA</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
background:#101010;
color:white;
font-family:Arial;
padding:15px;
}

h1{
text-align:center;
color:#00ff99;
}

.card{
background:#202020;
border:1px solid #444;
border-radius:12px;
padding:15px;
margin:12px 0;
}

button,input,select{
padding:10px;
margin:5px;
border-radius:6px;
border:none;
}

button{
background:#00aa66;
color:white;
font-weight:bold;
}

button:hover{
background:#00dd88;
}


.progress{
height:20px;
background:#333;
border-radius:10px;
overflow:hidden;
}

#barra{
height:100%;
width:0%;
background:#00ff99;
}


.output{
background:#000;
padding:15px;
border-radius:8px;
white-space:pre-wrap;
min-height:150px;
}



.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}


.box{
background:#292929;
padding:10px;
border-radius:8px;
text-align:center;
}



</style>


</head>


<body>


<h1>
🚀 EMI Tesla PRO V35.1
<br>
🧠 IA HISTORICA
</h1>



<div class="card">

<h2>📊 Estado Base</h2>


<div class="grid">

<div class="box">
Registros
<br>
<span id="total">
0
</span>
</div>


<div class="box">
Paginas OCR
<br>
<span id="paginas">
0
</span>
</div>


<div class="box">
Estado
<br>
<span id="estado">
Listo
</span>
</div>


<div class="box">
Modelo
<br>
V35.1
</div>


</div>


</div>




<div class="card">

<h2>📄 Cargar PDF Histórico</h2>


<input 
type="file"
id="archivoPDF"
accept=".pdf">


<br>


<button onclick="iniciarOCR()">
📥 Extraer Base OCR
</button>


<button onclick="detenerOCR()">
⛔ Parar
</button>



<div class="progress">

<div id="barra"></div>

</div>


<p id="infoOCR">
Esperando PDF...
</p>


</div>





<div class="card">


<h2>✍️ Carga Resultado Manual</h2>


<select id="turnoManual">

<option>PREVIA</option>

<option>PRIMERA</option>

<option>MATUTINA</option>

<option>VESPERTINA</option>

<option>NOCTURNA</option>

</select>



<input 
id="numerosManual"
placeholder="Ej: 7134 2588 9001">


<button onclick="guardarManual()">
💾 Guardar y Analizar
</button>


</div>




<div class="card">

<h2>🔮 Resultado IA</h2>


<div id="resultado" class="output">

EMI Tesla PRO V35.1 iniciado

</div>


</div>
<script>

//////////////////////////////////////////////////
// BASE HISTORICA V35.1
//////////////////////////////////////////////////


let base=
JSON.parse(
localStorage.getItem("EMI_V35_1_DB") || "[]"
);



let pararOCR=false;



function guardarBase(){

localStorage.setItem(
"EMI_V35_1_DB",
JSON.stringify(base)
);

actualizarEstado();

}




function actualizarEstado(){

document.getElementById(
"total"
).innerText=
base.length;

}



function mostrar(texto){

document.getElementById(
"resultado"
).innerText=
texto;

}




//////////////////////////////////////////////////
// CARGA MANUAL + ANALISIS AUTOMATICO
//////////////////////////////////////////////////


function guardarManual(){


let turno=
document.getElementById(
"turnoManual"
).value;



let texto=
document.getElementById(
"numerosManual"
).value;



let numeros=
texto.match(
/\d{4}/g
);



if(!numeros){

alert(
"No hay números"
);

return;

}



numeros.forEach(
n=>{


base.push({

fecha:
new Date()
.toISOString()
.split("T")[0],


turno:turno,


numero:n,


origen:"MANUAL"


});


}
);



guardarBase();



mostrar(

"✅ Guardado\n\n"+
"Turno: "+
turno+
"\n\nAnalizando siguiente turno..."

);



setTimeout(
function(){

analizarTransicion(
turno
);

},
500
);



}





//////////////////////////////////////////////////
// OCR PDF HISTORICO
//////////////////////////////////////////////////


async function iniciarOCR(){


let archivo=
document.getElementById(
"archivoPDF"
).files[0];



if(!archivo){

alert(
"Seleccione PDF"
);

return;

}



pararOCR=false;



document.getElementById(
"estado"
).innerText=
"Procesando";



let datos=
await archivo.arrayBuffer();



let pdf=
await pdfjsLib
.getDocument(
{
data:datos
}
)
.promise;



document.getElementById(
"paginas"
).innerText=
pdf.numPages;




let worker=
await Tesseract
.createWorker(
"spa"
);




for(
let pagina=1;
pagina<=pdf.numPages;
pagina++
){


if(pararOCR)
break;



document.getElementById(
"infoOCR"
).innerText=

"Procesando página "+
pagina+
" de "+
pdf.numPages;





let page=
await pdf.getPage(
pagina
);



let view=
page.getViewport(
{
scale:2
}
);



let canvas=
document.createElement(
"canvas"
);



canvas.width=
view.width;



canvas.height=
view.height;




await page.render({

canvasContext:
canvas.getContext("2d"),

viewport:view

})
.promise;






let resultado=
await worker.recognize(
canvas
);



let texto=
resultado.data.text;



guardarOCR(
texto,
pagina
);





let porcentaje=
pagina/pdf.numPages*100;



document.getElementById(
"barra"
).style.width=
porcentaje+"%";



}



await worker.terminate();



guardarBase();



document.getElementById(
"estado"
).innerText=
"Finalizado";



document.getElementById(
"infoOCR"
).innerText=
"OCR completo";


}




function detenerOCR(){

pararOCR=true;

mostrar(
"⛔ OCR detenido"
);

}




//////////////////////////////////////////////////
// GUARDAR DATOS OCR
//////////////////////////////////////////////////


function guardarOCR(
texto,
pagina
){



let numeros=
texto.match(
/\d{4}/g
);



if(!numeros)
return;



let turno=
detectarTurno(
texto
);



numeros.forEach(
n=>{


base.push({

fecha:
new Date()
.toISOString()
.split("T")[0],


turno:turno,


numero:n,


pagina:pagina,


origen:"OCR"


});


}
);



}





//////////////////////////////////////////////////
// DETECCION TURNO MEJORADA
//////////////////////////////////////////////////


function detectarTurno(texto){


let t=
texto.toUpperCase();



// OCR puede separar letras

t=t
.replace(/\s+/g," ");



if(
t.includes("PREV")
)
return "PREVIA";



if(
t.includes("PRIMER")
)
return "PRIMERA";



if(
t.includes("MATU")
)
return "MATUTINA";



if(
t.includes("VES")
)
return "VESPERTINA";



if(
t.includes("NOC")
)
return "NOCTURNA";



return "DESCONOCIDO";


}



actualizarEstado();


  </script>
  <script>

//////////////////////////////////////////////////
// MOTOR IA HISTORICO V35.1
//////////////////////////////////////////////////


function turnoSiguiente(turno){


let mapa={


"PREVIA":
"PRIMERA",


"PRIMERA":
"MATUTINA",


"MATUTINA":
"VESPERTINA",


"VESPERTINA":
"NOCTURNA",


"NOCTURNA":
"PREVIA"


};


return mapa[turno] || "";

}





async function analizarTransicion(
turnoOrigen
){



let destino=
turnoSiguiente(
turnoOrigen
);



let datos=
base.filter(
r=>
r.turno==destino
);



if(
datos.length<1
){


mostrar(

"⚠️ No hay suficiente historial\n\n"+
turnoOrigen+
" → "+
destino

);



return;

}




let frecuencia={};

let recientes={};





datos.forEach(
(r,i)=>{


frecuencia[r.numero]=
(frecuencia[r.numero]||0)+1;



// peso de registros nuevos

recientes[r.numero]=
(recientes[r.numero]||0)
+
(i+1);



}
);





let ranking=
Object.keys(
frecuencia
)
.map(
numero=>{


let score=


(frecuencia[numero]*40)

+

(recientes[numero]*25)

+

(numeroTerminacion(numero)*15)

+

(Math.random()*20);



return {

numero,
score

};



}
)

.sort(
(a,b)=>b.score-a.score
);







let top=
ranking.slice(
0,
12
);





let cuaterno1=
top.slice(
0,
4
)
.map(
x=>x.numero
);



let cuaterno2=
top.slice(
4,
8
)
.map(
x=>x.numero
);





let terno1=
top.slice(
0,
3
)
.map(
x=>x.numero
);



let terno2=
top.slice(
3,
6
)
.map(
x=>x.numero
);





let ambos1=
top.slice(
0,
6
)
mapearAmbos();



let ambos2=
top.slice(
6,
12
)
mapearAmbos();







mostrar(

"🧠 EMI TESLA PRO V35.1\n\n"+

"MODELO:\n"+
turnoOrigen+
" → "+
destino+

"\n\n🔥 CUATERNO 1:\n"+
cuaterno1.join(" - ")

+

"\n\n🔥 CUATERNO 2:\n"+
cuaterno2.join(" - ")

+

"\n\n⚡ TERNO 1:\n"+
terno1.join(" - ")

+

"\n\n⚡ TERNO 2:\n"+
terno2.join(" - ")

+

"\n\n💥 AMBOS 1:\n"+
ambos1.join(" - ")

+

"\n\n💥 AMBOS 2:\n"+
ambos2.join(" - ")

+

"\n\n📊 Datos usados: "+
datos.length

);



}




//////////////////////////////////////////////////
// TERMINACIONES
//////////////////////////////////////////////////


function numeroTerminacion(n){


let ultimos=
n.slice(-2);



return parseInt(
ultimos
);



}




//////////////////////////////////////////////////
// CONVERTIR A AMBOS
//////////////////////////////////////////////////


function mapearAmbos(){

return this.map(
x=>
x.numero.slice(-2)
);

}





//////////////////////////////////////////////////
// RESUMEN BASE
//////////////////////////////////////////////////


function resumenBase(){



let turnos={};



base.forEach(
r=>{


turnos[r.turno]=
(turnos[r.turno]||0)+1;


}
);



mostrar(

"📊 BASE HISTORICA\n\n"+
"Total registros: "+
base.length+

"\n\n"+
JSON.stringify(
turnos,
null,
2
)

);



}




//////////////////////////////////////////////////
// EXPORTAR BASE
//////////////////////////////////////////////////


function exportarBase(){


let archivo=
new Blob(
[
JSON.stringify(
base,
null,
2
)
],
{
type:"application/json"
}
);



let link=
document.createElement(
"a"
);



link.href=
URL.createObjectURL(
archivo
);



link.download=
"EMI_TESLA_V35_1_BASE.json";



link.click();


}





mostrar(

"🚀 EMI Tesla PRO V35.1 listo\n\n"+
"Registros cargados: "+
base.length

);



</script>


<div class="card">

<h2>🧠 Herramientas</h2>


<button onclick="resumenBase()">
📊 Resumen
</button>


<button onclick="exportarBase()">
💾 Backup
</button>


</div>



</body>
</html>
