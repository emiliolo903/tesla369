<script>


//////////////////////////////////////////////////
// BASE DATOS V45.1
//////////////////////////////////////////////////


const DB_NAME="EMI_TESLA_PRO_V45_1";

const DB_VERSION=1;

const STORE_NAME="historico";


let db=null;



//////////////////////////////////////////////////
// ABRIR BASE
//////////////////////////////////////////////////


function abrirBase(){

return new Promise((resolve,reject)=>{


let request=

indexedDB.open(
DB_NAME,
DB_VERSION
);



request.onupgradeneeded=function(e){


let base=e.target.result;



if(!base.objectStoreNames.contains(STORE_NAME)){


let tabla=

base.createObjectStore(
STORE_NAME,
{
keyPath:"id",
autoIncrement:true
}
);



tabla.createIndex(
"fecha",
"fecha",
{
unique:false
}
);



tabla.createIndex(
"turno",
"turno",
{
unique:false
}
);



tabla.createIndex(
"provincia",
"provincia",
{
unique:false
}
);


}



};



request.onsuccess=function(e){


db=e.target.result;


document.getElementById(
"estadoBase"
).innerText="ACTIVA";


mostrar(

"✅ BASE V45.1 CARGADA"

);


resolve(db);


};



request.onerror=function(e){

mostrar(
"ERROR BASE"
);

reject(e);

};



});


}


function guardarRegistro(datos){

return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readwrite"
);


let tabla=tx.objectStore(
STORE_NAME
);


tabla.add(datos);


tx.oncomplete=function(){

resolve(true);

};


tx.onerror=function(e){

reject(e);

};


});


}



function leerBase(){

return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readonly"
);


let tabla=tx.objectStore(
STORE_NAME
);


let datos=tabla.getAll();


datos.onsuccess=function(){

resolve(datos.result);

};


datos.onerror=function(e){

reject(e);

};


});


}
//////////////////////////////////////////////////
// IA APRENDIZAJE HISTÓRICO V45.1
//////////////////////////////////////////////////

let MODELO_IA=null;


async function aprenderBaseIA(){


let datos=await leerBase();


let modelo={

frecuencia:{},

transiciones:{},

provincia:{}

};



let orden={

"PREVIA":"PRIMERA",

"PRIMERA":"MATUTINA",

"MATUTINA":"VESPERTINA",

"VESPERTINA":"NOCTURNA",

"NOCTURNA":"PREVIA"

};



// FRECUENCIA DE AMBOS

for(let r of datos){


let ambos=r.numero.slice(-2);



modelo.frecuencia[ambos]=

(modelo.frecuencia[ambos]||0)+1;



let claveProvincia=

r.provincia;



if(!modelo.provincia[claveProvincia]){

modelo.provincia[claveProvincia]={};

}



modelo.provincia[claveProvincia][ambos]=

(modelo.provincia[claveProvincia][ambos]||0)+1;


}




// APRENDER PASO ENTRE TURNOS

for(let a of datos){


let siguiente=

orden[a.turno];



if(!siguiente)
continue;



for(let b of datos){


if(a.fecha!==b.fecha)
continue;


if(b.turno!==siguiente)
continue;



let origen=

a.numero.slice(-2);



let destino=

b.numero.slice(-2);



let clave=

origen+"->"+destino;



modelo.transiciones[clave]=

(modelo.transiciones[clave]||0)+1;



}



}



MODELO_IA=modelo;


return modelo;


}



//////////////////////////////////////////////////
// RANKING DE AMBOS
//////////////////////////////////////////////////

async function generarAmbosIA(turno){


let modelo=

await aprenderBaseIA();



let ranking={};



for(let clave in modelo.transiciones){


let partes=

clave.split("->");



let salida=

partes[1];



ranking[salida]=

(ranking[salida]||0)+

modelo.transiciones[clave]*10;



}



// sumar frecuencia

for(let n in modelo.frecuencia){


ranking[n]=

(ranking[n]||0)+

modelo.frecuencia[n];


}




return Object.keys(ranking)

.sort((a,b)=>

ranking[b]-ranking[a]

)

.slice(0,3);


  }
  
//////////////////////////////////////////////////

//////////////////////////////////////////////////
// CARGA MANUAL 7 PROVINCIAS V45.1
//////////////////////////////////////////////////

async function guardarBloqueIA(){


let turno=

document.getElementById(
"turnoBloque"
).value;



let provincias={


"CORRIENTES":
document.getElementById("corrientesBloque").value,


"CIUDAD":
document.getElementById("ciudadBloque").value,


"BONAERENSE":
document.getElementById("bonaerenseBloque").value,


"SANTA FE":
document.getElementById("santafeBloque").value,


"CORDOBA":
document.getElementById("cordobaBloque").value,


"ENTRE RIOS":
document.getElementById("entreriosBloque").value,


"CHACO":
document.getElementById("chacoBloque").value


};



let cantidad=0;


for(let provincia in provincias){


let numero=

provincias[provincia].trim();



if(numero==="") continue;



if(!/^\d{4}$/.test(numero)){


mostrar(

"⚠️ Error en "+
provincia+
" debe tener 4 cifras"

);


return;

}



await guardarRegistro({

fecha:new Date()
.toISOString()
.slice(0,10),

turno,

provincia,

numero,

origen:"MANUAL_V45_1"

});



cantidad++;


}



let total=

(await leerBase()).length;



document.getElementById(
"total"
).innerText=total;



mostrar(`

✅ BLOQUE GUARDADO

Turno:

${turno}


Provincias:

${cantidad}


TOTAL REGISTROS:

${total}


`);

  }
//////////////////////////////////////////////////
// OCR HISTÓRICO AVANZADO V45.1
//////////////////////////////////////////////////

let pararOCR=false;


function detectarTurnoOCR(texto){

texto=texto.toUpperCase();


if(texto.includes("PREVIA"))
return "PREVIA";


if(texto.includes("PRIMERA"))
return "PRIMERA";


if(texto.includes("MATUTINA"))
return "MATUTINA";


if(texto.includes("VESPERTINA"))
return "VESPERTINA";


if(texto.includes("NOCTURNA"))
return "NOCTURNA";


return "SIN_TURNO";

}



function detectarFechaOCR(texto){


let fecha=

texto.match(
/\d{2}[\/\-]\d{2}[\/\-]\d{4}/
);



if(fecha){

return fecha[0];

}


return new Date()
.toISOString()
.slice(0,10);

}




async function iniciarOCR(){


let archivo=

document.getElementById(
"archivoPDF"
).files[0];


if(!archivo){

mostrar(
"⚠️ Seleccione PDF"
);

return;

}



try{


pararOCR=false;


let buffer=

await archivo.arrayBuffer();



let pdf=

await pdfjsLib
.getDocument({
data:buffer
})
.promise;



let worker=

await Tesseract
.createWorker("spa");



let totalRegistros=0;



for(
let pagina=1;
pagina<=pdf.numPages;
pagina++
){


if(pararOCR)
break;



mostrar(`

📄 OCR HISTÓRICO

Página:

${pagina}

de

${pdf.numPages}


Leyendo...

`);




let page=

await pdf.getPage(pagina);



let viewport=

page.getViewport({
scale:3
});



let canvas=

document.createElement(
"canvas"
);



canvas.width=
viewport.width;


canvas.height=
viewport.height;



let ctx=

canvas.getContext(
"2d"
);



await page.render({

canvasContext:ctx,

viewport

}).promise;



let lectura=

await worker.recognize(
canvas
);



let texto=

lectura.data.text
.toUpperCase();



let turno=

detectarTurnoOCR(
texto
);



let fecha=

detectarFechaOCR(
texto
);




let numeros=

texto.match(
/\b\d{4}\b/g
)||[];




for(let numero of numeros){



await guardarRegistro({

fecha,

turno,

provincia:"AUTO",

numero,

origen:"OCR_HISTORICO_V45_1"


});



totalRegistros++;


}



mostrar(`

✅ OCR HISTÓRICO

Página:

${pagina}

de

${pdf.numPages}


Turno detectado:

${turno}


Números encontrados:

${numeros.length}


Registros nuevos:

${totalRegistros}

`);




}



await worker.terminate();



let total=

(await leerBase()).length;



document.getElementById(
"total"
).innerText=total;



mostrar(`

🎯 OCR FINALIZADO


Páginas:

${pdf.numPages}


Registros nuevos:

${totalRegistros}


Base total:

${total}


✅ HISTÓRICO CARGADO

`);




}catch(e){


mostrar(

"ERROR OCR\n"+e

);


}



}



function detenerOCR(){


pararOCR=true;


mostrar(

"⛔ OCR DETENIDO"

);


  }


</script>
