<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Tesla PRO V36.1 IA HISTÓRICA</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

body{

background:#101010;
color:white;
font-family:Arial;
padding:15px;

}


h1{

text-align:center;
color:#00ff99;

}


.card{

background:#202020;
border-radius:12px;
padding:15px;
margin:12px 0;
border:1px solid #444;

}


button,
input,
select{

width:100%;
padding:12px;
margin:5px 0;
border-radius:8px;
border:none;

}


button{

background:#00aa66;
color:white;
font-weight:bold;

}


.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;

}


.box{

background:#292929;
padding:10px;
border-radius:8px;
text-align:center;

}


.output{

background:#000;
padding:15px;
border-radius:10px;
white-space:pre-wrap;
min-height:220px;

}


.progress{

height:20px;
background:#333;
border-radius:10px;
overflow:hidden;

}


#barra{

height:100%;
width:0%;
background:#00ff99;

}


</style>


</head>


<body>


<h1>

🚀 EMI Tesla PRO V36.1

<br>

🧠 IA HISTÓRICA + MATRIZ PROVINCIAL

</h1>



<div class="card">

<h2>📊 Estado Sistema</h2>


<div class="grid">


<div class="box">

Registros

<br>

<span id="total">0</span>

</div>


<div class="box">

Páginas OCR

<br>

<span id="paginas">0</span>

</div>


<div class="box">

Estado

<br>

<span id="estado">

LISTO

</span>

</div>


<div class="box">

Versión

<br>

V36.1

</div>


</div>

</div>




<div class="card">


<h2>📄 OCR PDF HISTÓRICO</h2>


<select id="provinciaOCR">

<option>CORRIENTES</option>
<option>SANTA FE</option>
<option>CORDOBA</option>
<option>CHACO</option>
<option>ENTRE RIOS</option>
<option>CIUDAD</option>
<option>BONAERENSE</option>

</select>



<input

type="file"

id="archivoPDF"

accept=".pdf">


<button onclick="iniciarOCR()">

📥 Procesar PDF OCR

</button>



<button onclick="detenerOCR()">

⛔ Detener OCR

</button>



<div class="progress">

<div id="barra"></div>

</div>


<p id="infoOCR">

Esperando archivo...

</p>


</div>





<div class="card">


<h2>✍️ CARGA MANUAL</h2>



<select id="provinciaManual">

<option>CORRIENTES</option>
<option>SANTA FE</option>
<option>CORDOBA</option>
<option>CHACO</option>
<option>ENTRE RIOS</option>
<option>CIUDAD</option>
<option>BONAERENSE</option>

</select>




<select id="turnoManual">


<option>PREVIA</option>

<option>PRIMERA</option>

<option>MATUTINA</option>

<option>VESPERTINA</option>

<option>NOCTURNA</option>


</select>




<input

id="numerosManual"

placeholder="Ejemplo: 1679 2653">



<button onclick="guardarManual()">

💾 Guardar y Analizar

</button>


</div>





<div class="card">


<h2>🧠 RESULTADO IA V36.1</h2>


<div id="resultado" class="output">

EMI Tesla PRO V36.1 iniciado

</div>


</div>


<script>


//////////////////////////////////////////////////
// BASE HISTORICA V36.1
//////////////////////////////////////////////////


const DB_KEY="EMI_TESLA_V36_1_DB";

const CICLOS_KEY="EMI_TESLA_V36_1_CICLOS";


let base=[];

let ciclos=[];

let matriz=[];

let pararOCR=false;



try{

base=JSON.parse(

localStorage.getItem(DB_KEY)||"[]"

);


if(!Array.isArray(base))
base=[];


}catch(e){

base=[];

}




try{

ciclos=JSON.parse(

localStorage.getItem(CICLOS_KEY)||"[]"

);


if(!Array.isArray(ciclos))
ciclos=[];


}catch(e){

ciclos=[];

}
  //////////////////////////////////////////////////
// MOSTRAR
//////////////////////////////////////////////////

function mostrar(texto){

let salida=

document.getElementById("resultado");


if(salida){

salida.innerText=texto;

}


}


//////////////////////////////////////////////////
// DETECTOR PROVINCIA OCR AUTOMÁTICO V36.2
//////////////////////////////////////////////////

function detectarProvincia(texto){


let t = texto
.toUpperCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");



// CORRIENTES

if(
t.includes("CORRIENTES") ||
t.includes("CORR1ENTES") ||
t.includes("CORRIENTE")
){

return "CORRIENTES";

}



// SANTA FE

if(
t.includes("SANTA FE") ||
t.includes("SANTAFE")
){

return "SANTA FE";

}



// CORDOBA

if(
t.includes("CORDOBA") ||
t.includes("CORDOBA")
){

return "CORDOBA";

}



// ENTRE RIOS

if(
t.includes("ENTRE RIOS") ||
t.includes("ENTRERIOS")
){

return "ENTRE RIOS";

}



// CHACO

if(
t.includes("CHACO")
){

return "CHACO";

}



// BONAERENSE

if(
t.includes("BONAERENSE") ||
t.includes("BUENOS AIRES")
){

return "BONAERENSE";

}



// CIUDAD

if(
t.includes("CIUDAD") ||
t.includes("CAPITAL FEDERAL")
){

return "CIUDAD";

}



// SI NO ENCUENTRA

return "DESCONOCIDA";


  }


//////////////////////////////////////////////////
// ESTADO
//////////////////////////////////////////////////

function actualizarEstado(){


let t=document.getElementById("total");


if(t){

t.innerText=base.length;

}


}





//////////////////////////////////////////////////
// GUARDAR BASE
//////////////////////////////////////////////////

function guardarBase(){


localStorage.setItem(

DB_KEY,

JSON.stringify(base)

);


actualizarEstado();


}



function guardarCiclos(){


localStorage.setItem(

CICLOS_KEY,

JSON.stringify(ciclos)

);


}



//////////////////////////////////////////////////
// DUPLICADOS
//////////////////////////////////////////////////

function existeRegistro(r){


return base.some(x=>

x.numero===r.numero &&

x.turno===r.turno &&

x.fecha===r.fecha &&

x.provincia===r.provincia

);


}





//////////////////////////////////////////////////
// AGREGAR REGISTRO
//////////////////////////////////////////////////

function agregarRegistro(r){


if(!existeRegistro(r)){


base.push(r);


agregarCiclo(r);


agregarMatriz(r);


return true;


}


return false;


}





//////////////////////////////////////////////////
// MATRIZ PROVINCIAL
//////////////////////////////////////////////////

function agregarMatriz(r){


let existe=

matriz.some(x=>

x.provincia===r.provincia &&

x.numero===r.numero

);



if(!existe){


matriz.push({

provincia:r.provincia,

numero:r.numero,

ambos:r.numero.slice(-2),

turno:r.turno

});


}



}





//////////////////////////////////////////////////
// OCR PDF
//////////////////////////////////////////////////

async function iniciarOCR(){


let archivo=

document.getElementById("archivoPDF").files[0];


if(!archivo){

alert("Seleccione PDF");

return;

}


let provincia=

document.getElementById("provinciaOCR").value;


pararOCR=false;


document.getElementById("estado").innerText=

"PROCESANDO";



let datos=

await archivo.arrayBuffer();



let pdf=

await pdfjsLib.getDocument({

data:datos

}).promise;



document.getElementById("paginas").innerText=

pdf.numPages;



let worker=

await Tesseract.createWorker("spa");



for(

let pagina=1;

pagina<=pdf.numPages;

pagina++

){


if(pararOCR)
break;



let page=

await pdf.getPage(pagina);



let viewport=

page.getViewport({

scale:2

});



let canvas=

document.createElement("canvas");


canvas.width=viewport.width;

canvas.height=viewport.height;



await page.render({

canvasContext:canvas.getContext("2d"),

viewport

}).promise;



let texto=

await worker.recognize(canvas);



guardarOCR(

texto.data.text,

pagina,

provincia

);



document.getElementById("barra").style.width=

((pagina/pdf.numPages)*100)+"%";


}



await worker.terminate();



guardarBase();



document.getElementById("estado").innerText=

"FINALIZADO";



mostrar(

"✅ OCR terminado\n\nRegistros: "+base.length

);



}



function detenerOCR(){

pararOCR=true;

mostrar("⛔ OCR detenido");

  }
  //////////////////////////////////////////////////
// GUARDAR OCR
//////////////////////////////////////////////////

function extraerNumeros(texto){

return texto.match(/\b\d{4}\b/g)||[];

}



function detectarTurno(texto){

let t=

texto.toUpperCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");


if(t.includes("PREV"))
return "PREVIA";


if(t.includes("PRIMER"))
return "PRIMERA";


if(t.includes("MATU"))
return "MATUTINA";


if(t.includes("VES"))
return "VESPERTINA";


if(t.includes("NOC"))
return "NOCTURNA";


return "DESCONOCIDO";

}




let provinciaDetectada = detectarProvincia(texto.data.text);


if(provinciaDetectada==="DESCONOCIDA"){

provinciaDetectada = provincia;

}



guardarOCR(

texto.data.text,

pagina,

provinciaDetectada

);

let numeros=

extraerNumeros(texto);


let turno=

detectarTurno(texto);



let fecha=

new Date()
.toISOString()
.split("T")[0];



numeros.forEach(numero=>{


agregarRegistro({

fecha,

provincia,

turno,

numero,

pagina,

origen:"OCR"


});



});


}







//////////////////////////////////////////////////
// CICLOS
//////////////////////////////////////////////////

function crearCiclo(fecha){

return{

fecha,

PREVIA:[],
PRIMERA:[],
MATUTINA:[],
VESPERTINA:[],
NOCTURNA:[]

};


}




function agregarCiclo(r){


let ciclo=

ciclos.find(c=>

c.fecha===r.fecha

);



if(!ciclo){

ciclo=crearCiclo(r.fecha);

ciclos.push(ciclo);

}



if(ciclo[r.turno]){

ciclo[r.turno].push(r.numero);

}



guardarCiclos();


}





//////////////////////////////////////////////////
// CARGA MANUAL
//////////////////////////////////////////////////

function guardarManual(){


let provincia=

document.getElementById("provinciaManual").value;



let turno=

document.getElementById("turnoManual").value;



let texto=

document.getElementById("numerosManual").value;



let numeros=

texto.match(/\d{4}/g);



if(!numeros){

mostrar("⚠️ Ingrese números");

return;

}




let fecha=

new Date()
.toISOString()
.split("T")[0];



let nuevos=0;



numeros.forEach(numero=>{


if(

agregarRegistro({

fecha,

provincia,

turno,

numero,

origen:"MANUAL"

})

){

nuevos++;

}


});



guardarBase();



mostrar(`

✅ DATOS GUARDADOS


Provincia:

${provincia}


Turno:

${turno}


Nuevos:

${nuevos}


🧠 Analizando...

`);



analizarTransicion(turno);


}






//////////////////////////////////////////////////
// TURNOS
//////////////////////////////////////////////////

const ORDEN_TURNOS=[

"PREVIA",
"PRIMERA",
"MATUTINA",
"VESPERTINA",
"NOCTURNA"

];



function turnoSiguiente(t){


let p=

ORDEN_TURNOS.indexOf(t);


if(p===4)

return "PREVIA";


return ORDEN_TURNOS[p+1];


  }
  //////////////////////////////////////////////////
// TRANSICIÓN IA V36.1
//////////////////////////////////////////////////

function analizarTransicion(origen){


let destino=

turnoSiguiente(origen);



let datos=

base.filter(r=>

r.turno===destino

);



if(datos.length<3){

mostrar(`

⚠️ Poco historial


${origen}

↓

${destino}


Registros:

${datos.length}

`);

return;

}



calcularRankingV36(

datos,

origen,

destino

);


}







//////////////////////////////////////////////////
// MOTOR PUNTAJE IA
//////////////////////////////////////////////////

function calcularRankingV36(

datos,

origen,

destino

){


let puntos={};

let terminaciones={};



datos.forEach(r=>{


let numero=r.numero;



if(!/^\d{4}$/.test(numero))

return;



puntos[numero]=

(puntos[numero]||0)+50;



let ambos=

numero.slice(-2);



terminaciones[ambos]=

(terminaciones[ambos]||0)+1;



let dias=

(Date.now()-new Date(r.fecha))
/86400000;



puntos[numero]+=

100/

Math.max(1,dias);



});





Object.keys(puntos).forEach(numero=>{


let ambos=

numero.slice(-2);



puntos[numero]+=

(terminaciones[ambos]||0)*15;



});




let ranking=

Object.keys(puntos)

.map(numero=>({

numero,

puntaje:puntos[numero]

}))

.sort((a,b)=>

b.puntaje-a.puntaje

);



generarResultadoV36(

ranking,

origen,

destino,

datos.length

);



}






//////////////////////////////////////////////////
// GENERADOR INTELIGENTE
//////////////////////////////////////////////////

function generarResultadoV36(

ranking,

origen,

destino,

cantidad

){



if(!ranking.length){

mostrar("Sin datos");

return;

}



let principal=

ranking[0].numero;



let apoyo=

ranking[1]?

ranking[1].numero:

principal;



mostrar(`

🧠 EMI TESLA PRO V36.1


MODELO

${origen}

↓

${destino}



🔥 CUATERNO PRINCIPAL

${principal}



🟡 CUATERNO APOYO

${apoyo}



⚡ TERNO PRINCIPAL

${principal.slice(-3)}



🟡 TERNO APOYO

${apoyo.slice(-3)}



💥 AMBOS PRINCIPAL

${principal.slice(-2)}



🟡 AMBOS APOYO

${apoyo.slice(-2)}



📊 DATOS USADOS

${cantidad}



`);

  }
  //////////////////////////////////////////////////
// ANALISIS PROVINCIAL
//////////////////////////////////////////////////

function analizarProvincias(){


let datos={};



matriz.forEach(r=>{


let clave=

r.provincia+

" → "+

r.ambos;



datos[clave]=

(datos[clave]||0)+1;


});



let orden=

Object.keys(datos)

.sort((a,b)=>

datos[b]-datos[a]

)

.slice(0,20);



mostrar(`

🌎 MATRIZ PROVINCIAL V36.1


${orden.map(x=>

x+
" = "+
datos[x]+
" veces"

).join("\n")}


`);

}





//////////////////////////////////////////////////
// PATRONES NOCTURNA
//////////////////////////////////////////////////

function analizarNocturna(){


let datos=

base.filter(r=>

r.turno==="NOCTURNA"

);



let patrones={};



datos.forEach(r=>{


let a=

r.numero.slice(-2);



patrones[a]=

(patrones[a]||0)+1;


});



let orden=

Object.keys(patrones)

.sort((a,b)=>

patrones[b]-patrones[a]

)

.slice(0,20);



mostrar(`

🌙 PATRONES NOCTURNA


${orden.map(x=>

x+
" → "+
patrones[x]

).join("\n")}


`);

}





//////////////////////////////////////////////////
// ESTADO
//////////////////////////////////////////////////

function estadoSistema(){


mostrar(`

🚀 EMI TESLA PRO V36.1


Registros:

${base.length}


Ciclos:

${ciclos.length}


Matriz:

${matriz.length}


OCR:

ACTIVO


IA:

ACTIVA


`);

}





window.onload=function(){

actualizarEstado();


mostrar(

"🚀 EMI Tesla PRO V36.1 iniciado\n\n"+
"Registros: "+
base.length

);


};


</script>



<div class="card">

<h2>

🧠 Herramientas IA

</h2>


<button onclick="analizarProvincias()">

🌎 Matriz Provincias

</button>



<button onclick="analizarNocturna()">

🌙 Nocturna

</button>



<button onclick="estadoSistema()">

🚀 Estado

</button>


</div>



</body>

</html>
