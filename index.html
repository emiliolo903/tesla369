<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Tesla PRO V19</title>

<style>

body{
margin:0;
font-family:Arial;
background:#111;
color:#fff;
padding:15px;
}

.container{
max-width:480px;
margin:auto;
}

h1{
color:#00F5E0;
text-align:center;
}

h2{
color:#FFD700;
margin-top:25px;
}

input,textarea{
width:100%;
padding:10px;
margin-bottom:10px;
border-radius:8px;
border:none;
font-size:16px;
background:#333;
color:#fff;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#00F5E0;
border:none;
border-radius:8px;
font-size:16px;
margin-bottom:10px;
cursor:pointer;
color:#111;
font-weight:bold;
}

.resultado{
background:#222;
padding:12px;
border-radius:10px;
margin-bottom:10px;
line-height:1.6;
}

span{
color:#00FFAA;
font-weight:bold;
font-size:22px;
}

.alerta{
color:#FFD700;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>🔥 EMI Tesla PRO V19</h1>

<h2>Historial del día</h2>

<textarea id="historial" placeholder="Pegá números de 4 cifras"></textarea>

<button onclick="guardarBloque('previa')">
Guardar Previa
</button>

<button onclick="guardarBloque('primera')">
Guardar Primera
</button>

<button onclick="guardarBloque('matutina')">
Guardar Matutina
</button>

<button onclick="guardarBloque('vespertina')">
Guardar Vespertina
</button>

<button onclick="guardarBloque('nocturna')">
Guardar Nocturna
</button>

<h2>💣 Ambos Inteligentes</h2>

<button onclick="generarAmbos()">
Generar Ambos
</button>

<div id="resultadoAmbos" class="resultado"></div>

<h2>🔥 Método EMI</h2>

<input
type="text"
id="numeroEMI"
placeholder="Ingresá número"
/>

<button onclick="convertirEMIManual()">
Convertir Número EMI
</button>

<button onclick="probarEMI()">
EMI Último Resultado
</button>

<div id="resultadoEMI" class="resultado"></div>

</div>

<script>

/* ================= BLOQUES ================= */

let dia={

previa:[],
primera:[],
matutina:[],
vespertina:[],
nocturna:[]

};

function guardarBloque(tipo){

let texto=document
.getElementById("historial")
.value
.trim();

let nums=texto
.split(/\s+/)
.filter(n=>n.length===4);

dia[tipo]=nums;

alert(tipo+" guardado");

}

/* ================= MÉTODO EMI ================= */

const emiMetodo={

0:[0,0],
1:[0,0],
2:[5,7],
3:[8,0],
4:[6,9],
5:[2,7],
6:[4,9],
7:[5,2],
8:[3,0],
9:[3,4]

};

function aplicarEMI(numero){

let resultado=[];

numero.split('').forEach(d=>{

if(emiMetodo[d]){

resultado.push(

d+" → "+
emiMetodo[d][0]+
"-"+
emiMetodo[d][1]

);

}

});

return resultado.join("<br>");

}

/* ================= EMI MANUAL ================= */

function convertirEMIManual(){

let numero=document
.getElementById("numeroEMI")
.value
.trim();

if(numero.length===0){

document.getElementById(
"resultadoEMI"
).innerHTML="Ingresá número";

return;

}

let emi=aplicarEMI(numero);

document.getElementById(
"resultadoEMI"
).innerHTML=`

<div class="resultado">

🔥 CONVERSIÓN EMI<br><br>

<span>${numero}</span><br><br>

${emi}

</div>

`;

}

/* ================= EMI ÚLTIMO ================= */

function probarEMI(){

let todos=[];

for(let t in dia){

todos=todos.concat(dia[t]);

}

if(todos.length===0){

document.getElementById(
"resultadoEMI"
).innerHTML="Sin datos";

return;

}

let ultimo=todos[todos.length-1];

let emi=aplicarEMI(ultimo);

document.getElementById(
"resultadoEMI"
).innerHTML=`

<div class="resultado">

🔥 EMI DEL ÚLTIMO NÚMERO<br><br>

<span>${ultimo}</span><br><br>

${emi}

</div>

`;

}

/* ================= AMBOS INTELIGENTES ================= */

function generarAmbos(){

let todos=[];

for(let t in dia){

todos=todos.concat(dia[t]);

}

if(todos.length===0){

document.getElementById(
"resultadoAmbos"
).innerHTML="Sin datos";

return;

}

/* ================= EXTRAER AMBOS ================= */

let ambos=[];

todos.forEach(n=>{

ambos.push(n.slice(2,4));

});

/* ================= FRECUENCIA GENERAL ================= */

let freq={};

let continuidad={};

ambos.forEach(a=>{

freq[a]=(freq[a]||0)+1;

let invertido=a[1]+a[0];

continuidad[invertido]=
(continuidad[invertido]||0)+1;

});

/* ================= DOMINANTE ================= */

let digitos={};

todos.forEach(n=>{

n.split('').forEach(d=>{

digitos[d]=(digitos[d]||0)+1;

});

});

let dominante=Object
.entries(digitos)
.sort((a,b)=>b[1]-a[1])[0][0];

/* ================= ACOMPAÑANTE ================= */

let acompanantes={};

ambos.forEach(a=>{

if(a.includes(dominante)){

let otro=
(a[0]===dominante)
? a[1]
: a[0];

acompanantes[otro]=
(acompanantes[otro]||0)+1;

}

});

let acomp=Object
.entries(acompanantes)
.sort((a,b)=>b[1]-a[1])[0];

let acompReal=acomp ? acomp[0] : dominante;

/* ================= PRINCIPAL ================= */

let principal=
dominante+acompReal;

/* ================= APOYO ================= */

let apoyo=
acompReal+dominante;

/* ================= REFUERZO ================= */

let refuerzo="-";

let ref=Object
.entries(continuidad)
.sort((a,b)=>b[1]-a[1])[0];

if(ref && ref[1]>=2){

refuerzo=ref[0];

}

/* ================= ALERTA MUTACIÓN ================= */

let alerta="🟢 Núcleo estable";

if(freq[principal]>=2 || freq[apoyo]>=2){

alerta="⚠️ Continuidad dominante fuerte";

}

if(freq[principal]>=3 || freq[apoyo]>=3){

alerta="💣 Posible agotamiento de núcleo";

}

/* ================= RESULTADO ================= */

document.getElementById(
"resultadoAmbos"
).innerHTML=`

<div class="resultado">

💣 DOMINANTE DETECTADO<br>
<span>${dominante}</span><br><br>

🎯 AMBOS PRINCIPAL<br>
<span>${principal}</span><br><br>

✔ APOYO ESTRATÉGICO<br>
<span>${apoyo}</span><br><br>

⚠️ REFUERZO CONTINUIDAD<br>
<span>${refuerzo}</span><br><br>

<div class="alerta">
${alerta}
</div>

</div>

`;

}

</script>

</body>
</html>
