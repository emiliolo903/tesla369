<html lang="es">

<head>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<style>

<body>


<h1>
🚀 EMI Tesla PRO V36
<br>
🧠 IA HISTÓRICA
</h1>


<div class="card">

<h2>📊 Estado del Sistema</h2>


<div class="grid">


<div class="box">

Registros

<br>

<span id="total">0</span>

</div>


<div class="box">

Páginas OCR

<br>

<span id="paginas">0</span>

</div>


<div class="box">

Estado

<br>

LISTO
</span>

</div>


<div class="box">

Versión

<br>

V36

</div>


</div>

</div>



<div class="card">


<h2>📄 OCR PDF Histórico</h2>


<input 
type="file"
id="archivoPDF"
accept=".pdf">


<button onclick="iniciarOCR()">

📥 Procesar PDF

</button>


<button onclick="detenerOCR()">

⛔ Detener OCR

</button>


<div class="progress">

<div id="barra"></div>

</div>


<p id="infoOCR">

Esperando archivo...

</p>


</div>



<div class="card">


<h2>✍️ Carga Manual</h2>


<select id="turnoManual">

<option>PREVIA</option>
<option>PRIMERA</option>
<option>MATUTINA</option>
<option>VESPERTINA</option>
<option>NOCTURNA</option>

</select>


<input

id="numerosManual"

placeholder="1234 5678 9012">


<button onclick="guardarManual()">

💾 Guardar y Analizar

</button>


</div>



<div class="card">

<h2>🧠 Resultado IA V36</h2>


<div id="resultado" class="output">

EMI Tesla PRO V36 iniciado

</div>


</div>
<script>


const DB_KEY="EMI_TESLA_V36_DB";


let base=[];


let pararOCR=false;



try{

base=JSON.parse(
localStorage.getItem(DB_KEY)||"[]"
);


if(!Array.isArray(base))
base=[];


}catch(e){

base=[];

}




function mostrar(texto){

document.getElementById("resultado").innerText=texto;

}




function actualizarEstado(){

document.getElementById("total").innerText=base.length;

}




function guardarBase(){

localStorage.setItem(
DB_KEY,
JSON.stringify(base)
);

actualizarEstado();

}




function existeRegistro(r){

return base.some(x=>

x.numero===r.numero &&
x.turno===r.turno &&
x.fecha===r.fecha

);

}




function agregarRegistro(r){

if(!existeRegistro(r)){

base.push(r);

return true;

}

return false;

}




async function iniciarOCR(){


let archivo=
document.getElementById("archivoPDF").files[0];


if(!archivo){

alert("Seleccione PDF");

return;

}


pararOCR=false;


document.getElementById("estado").innerText=
"PROCESANDO";



let datos=
await archivo.arrayBuffer();


let pdf=
await pdfjsLib.getDocument({

data:datos

}).promise;



document.getElementById("paginas").innerText=
pdf.numPages;



let worker=
await Tesseract.createWorker("spa");



for(
let pagina=1;
pagina<=pdf.numPages;
pagina++
){


if(pararOCR)
break;


try{


let page=
await pdf.getPage(pagina);



let viewport=
page.getViewport({
scale:2
});



let canvas=
document.createElement("canvas");


canvas.width=viewport.width;
canvas.height=viewport.height;



await page.render({

canvasContext:
canvas.getContext("2d"),

viewport

}).promise;



let texto=
await worker.recognize(canvas);



guardarOCR(
texto.data.text,
pagina
);



}catch(error){

console.log(
"Error página",
pagina,
error
);

}



document.getElementById("barra").style.width=
((pagina/pdf.numPages)*100)+"%";


}



await worker.terminate();


guardarBase();


document.getElementById("estado").innerText=
"FINALIZADO";


mostrar(

"✅ OCR terminado\n\n"+
"Registros: "+
base.length

);


}





function detenerOCR(){

pararOCR=true;

mostrar(
"⛔ OCR detenido"
);

}




function extraerNumeros(texto){


let encontrados=
texto.match(/\b\d{4}\b/g);


return encontrados || [];


}




function guardarOCR(texto,pagina){


if(!texto)
return;



let numeros=
extraerNumeros(texto);



let turno=
detectarTurno(texto);



let fecha=
new Date()
.toISOString()
.split("T")[0];



numeros.forEach(numero=>{


agregarRegistro({

fecha,
turno,
numero,
pagina,
origen:"OCR"

});


});


}




function detectarTurno(texto){


let t=
texto
.toUpperCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");



if(t.includes("PREV"))
return "PREVIA";


if(t.includes("PRIMER"))
return "PRIMERA";


if(t.includes("MATU"))
return "MATUTINA";


if(t.includes("VES"))
return "VESPERTINA";


if(t.includes("NOC"))
return "NOCTURNA";


return "DESCONOCIDO";

}
  //////////////////////////////////////////////////
// CARGA MANUAL V36
//////////////////////////////////////////////////


function guardarManual(){


let turno =
document.getElementById("turnoManual").value;


let texto =
document.getElementById("numerosManual").value;



let numeros =
texto.match(/\d{4}/g);



if(!numeros){

mostrar(
"⚠️ Ingrese números de 4 cifras"
);

return;

}




let fecha =
new Date()
.toISOString()
.split("T")[0];



let nuevos=0;



numeros.forEach(numero=>{


let registro={

fecha,
turno,
numero,
origen:"MANUAL"

};



if(agregarRegistro(registro)){

nuevos++;

}



});




guardarBase();



mostrar(

`✅ DATOS GUARDADOS


Turno:
${turno}


Nuevos:
${nuevos}


🧠 Analizando transición...`

);



analizarTransicion(turno);



}





//////////////////////////////////////////////////
// TRANSICIÓN HISTÓRICA
//////////////////////////////////////////////////


function turnoSiguiente(turno){


let mapa={


"PREVIA":
"PRIMERA",


"PRIMERA":
"MATUTINA",


"MATUTINA":
"VESPERTINA",


"VESPERTINA":
"NOCTURNA",


"NOCTURNA":
"PREVIA"


};


return mapa[turno] || "";

}




function analizarTransicion(origen){


let destino=
turnoSiguiente(origen);



let datos=
base.filter(r=>

r.turno===destino

);



if(datos.length<3){


mostrar(

`⚠️ Poco historial


Modelo:

${origen}
→
${destino}


Registros:

${datos.length}`

);


return;

}




calcularRanking(

datos,
origen,
destino

);



}






//////////////////////////////////////////////////
// RANKING HISTÓRICO V36
//////////////////////////////////////////////////


function calcularRanking(datos,origen,destino){



let frecuencia={};

let peso={};



datos.forEach(registro=>{


let numero=
registro.numero;



if(!/^\d{4}$/.test(numero))
return;



frecuencia[numero]=
(frecuencia[numero]||0)+1;




let antiguedad=

(Date.now() -
new Date(registro.fecha))
/
86400000;



let valor=

100 /
Math.max(
1,
antiguedad
);



peso[numero]=
(peso[numero]||0)+valor;



});





let ranking=

Object.keys(frecuencia)

.map(numero=>{


return {


numero,

puntaje:

frecuencia[numero]*70+
peso[numero]*30


};


})

.sort((a,b)=>

b.puntaje-a.puntaje

);





generarResultado(

ranking,
origen,
destino,
datos.length

);



}
  //////////////////////////////////////////////////
// GENERADOR IA V36
//////////////////////////////////////////////////


function generarResultado(
ranking,
origen,
destino,
cantidad
){



if(!ranking.length){


mostrar(
"⚠️ Sin datos para analizar"
);


return;


}



let top=
ranking.slice(0,12);



let ambosPrincipal=[];

let ambosRespaldo=[];



top.forEach((x,i)=>{


let final=
x.numero.slice(-2);



if(i<6){

ambosPrincipal.push(final);

}
else{

ambosRespaldo.push(final);

}


});




let cuaterno1=

top
.slice(0,4)
.map(x=>x.numero);



let cuaterno2=

top
.slice(4,8)
.map(x=>x.numero);





let terno1=

top
.slice(0,3)
.map(x=>x.numero);



let terno2=

top
.slice(3,6)
.map(x=>x.numero);







mostrar(

`🧠 EMI TESLA PRO V36


MODELO:

${origen}
→
${destino}



🔥 CUATERNO 1

${cuaterno1.join(" - ")}



🔥 CUATERNO 2

${cuaterno2.join(" - ")}



⚡ TERNO 1

${terno1.join(" - ")}



⚡ TERNO 2

${terno2.join(" - ")}



💥 AMBOS PRINCIPAL

${ambosPrincipal.join(" - ")}



💥 AMBOS RESPALDO

${ambosRespaldo.join(" - ")}



📊 Registros usados:

${cantidad}

`

);



}






//////////////////////////////////////////////////
// ANALISIS DE PATRONES
//////////////////////////////////////////////////


function analizarPatrones(){


let patrones={};



base.forEach(r=>{


let a=
r.numero.slice(-2);



patrones[a]=
(patrones[a]||0)+1;



});



let orden=

Object.keys(patrones)

.sort((a,b)=>

patrones[b]-patrones[a]

)

.slice(0,20);





mostrar(

`🔬 PATRONES HISTÓRICOS


${orden.map(n=>

n+
" = "+
patrones[n]+
" veces"

).join("\n")}`

);



}






//////////////////////////////////////////////////
// ESTADÍSTICAS
//////////////////////////////////////////////////


function estadisticasBase(){


mostrar(

`📊 ESTADÍSTICAS V36


Total registros:

${base.length}


OCR:

${base.filter(x=>x.origen==="OCR").length}


MANUAL:

${base.filter(x=>x.origen==="MANUAL").length}


`

);



  }
  //////////////////////////////////////////////////
// HERRAMIENTAS V36
//////////////////////////////////////////////////


function exportarBase(){


let archivo =
new Blob(

[
JSON.stringify(
base,
null,
2
)
],

{
type:"application/json"
}

);



let enlace =
document.createElement("a");



enlace.href =
URL.createObjectURL(archivo);



enlace.download =
"EMI_TESLA_PRO_V36_BASE.json";



enlace.click();



}





function importarBase(event){


let archivo =
event.target.files[0];



if(!archivo)
return;



let lector =
new FileReader();



lector.onload=function(e){


try{


let datos =
JSON.parse(
e.target.result
);



if(Array.isArray(datos)){



datos.forEach(r=>{


agregarRegistro(r);


});



guardarBase();



mostrar(

"✅ Base importada\n\n"+
"Registros: "+
base.length

);



}



}catch(error){


mostrar(
"❌ Error importando base"
);


}



};



lector.readAsText(archivo);



}






function limpiarBase(){


if(
confirm(
"¿Eliminar toda la base histórica?"
)
){


base=[];


guardarBase();



mostrar(
"🧹 Base eliminada"
);


}


}





function optimizarBase(){


let limpia=[];



base.forEach(r=>{


if(

r.numero &&

/^\d{4}$/.test(r.numero)&&

r.turno

){


limpia.push(r);


}



});




let antes=
base.length;



base=
limpia;



guardarBase();



mostrar(

`⚙️ OPTIMIZACIÓN V36


Antes:

${antes}


Después:

${base.length}


Eliminados:

${antes-base.length}

`

);



}





function estadoSistema(){


mostrar(

`🚀 EMI TESLA PRO V36


ESTADO:


📊 Registros:

${base.length}


🧠 Motor IA:

ACTIVO


📄 OCR:

ACTIVO


💾 Base:

LOCAL STORAGE


`

);



}







function pruebaSistema(){


mostrar(

`🧪 PRUEBA V36


✅ Base:

${base.length}


✅ OCR:

OK


✅ Motor IA:

OK


✅ Guardado:

OK


`

);



}







window.onload=function(){


actualizarEstado();



mostrar(

"🚀 EMI TESLA PRO V36 iniciado\n\n"+
"Registros cargados: "+
base.length

);



};



</script>


<div class="card">

<h2>
🧠 Herramientas EMI Tesla PRO V36
</h2>


<button onclick="estadisticasBase()">

</button>
