<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Tesla PRO V20</title>

<style>

body{
margin:0;
padding:15px;
background:#111;
font-family:Arial;
color:#fff;
}

.container{
max-width:500px;
margin:auto;
}

h1{
text-align:center;
color:#00F5E0;
}

h2{
color:#FFD700;
margin-top:25px;
}

textarea,input{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:8px;
background:#222;
color:#fff;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
margin-bottom:10px;
border:none;
border-radius:8px;
background:#00F5E0;
color:#111;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.resultado{
background:#1E1E1E;
padding:15px;
border-radius:10px;
line-height:1.6;
margin-top:10px;
}

span{
color:#00FF99;
font-size:24px;
font-weight:bold;
}

.alerta{
color:#FFD700;
font-weight:bold;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>🔥 EMI Tesla PRO V20</h1>

<h2>Historial del Sorteo</h2>

<textarea
id="historial"
placeholder="Pegá números de 4 cifras">
</textarea>

<button onclick="guardarBloque('previa')">
Guardar Previa
</button>

<button onclick="guardarBloque('primera')">
Guardar Primera
</button>

<button onclick="guardarBloque('matutina')">
Guardar Matutina
</button>

<button onclick="guardarBloque('vespertina')">
Guardar Vespertina
</button>

<button onclick="guardarBloque('nocturna')">
Guardar Nocturna
</button>

<h2>💣 Ambos Inteligentes</h2>

<button onclick="generarAmbos()">
Generar Ambos
</button>

<div id="resultado" class="resultado"></div>

</div>

<script>

/* ================= BASE ================= */

let bloques={

previa:[],
primera:[],
matutina:[],
vespertina:[],
nocturna:[]

};

/* ================= GUARDAR ================= */

function guardarBloque(tipo){

let texto=document
.getElementById("historial")
.value
.trim();

let numeros=texto
.split(/\s+/)
.filter(n=>n.length===4);

bloques[tipo]=numeros;

alert(tipo+" guardado");

}

/* ================= OBTENER ÚLTIMO ================= */

function obtenerUltimo(){

if(bloques.vespertina.length>0){
return {
nombre:"NOCTURNA",
datos:bloques.vespertina
};
}

if(bloques.matutina.length>0){
return {
nombre:"VESPERTINA",
datos:bloques.matutina
};
}

if(bloques.primera.length>0){
return {
nombre:"MATUTINA",
datos:bloques.primera
};
}

if(bloques.previa.length>0){
return {
nombre:"PRIMERA",
datos:bloques.previa
};
}

return null;

}

/* ================= GENERADOR ================= */

function generarAmbos(){

let actual=obtenerUltimo();

if(!actual){

document.getElementById(
"resultado"
).innerHTML="Sin datos";

return;

}

let sorteo=actual.nombre;

let datos=actual.datos;

/* ================= EXTRAER AMBOS ================= */

let ambos=[];

datos.forEach(n=>{

ambos.push(
n.slice(2,4)
);

});

/* ================= MOTOR CONTEXTUAL ================= */

let pesos={};

function sumar(numero,peso){

pesos[numero]=
(pesos[numero]||0)+peso;

}

/* ================= ANALIZAR ================= */

ambos.forEach(a=>{

let d1=a[0];
let d2=a[1];

/* peso directo */

sumar(a,2);

/* espejo */

sumar(d2+d1,1.5);

/* núcleo doble */

sumar(d1+d2,1);

/* continuidad */

if(d1!==d2){

sumar(d1+d2,1.2);
sumar(d2+d1,1.2);

}

/* detectar 8-2 */

if(
(a==="28")
||
(a==="82")
){

sumar("28",10);
sumar("82",10);

}

/* detectar continuidad 8 */

if(a.includes("8")){

sumar("82",3);
sumar("28",3);
sumar("85",2);
sumar("58",1.5);

}

/* detectar continuidad 2 */

if(a.includes("2")){

sumar("82",2);
sumar("28",2);

}

/* detectar mutación 5 */

if(a.includes("5")){

sumar("85",4);
sumar("58",3);
sumar("65",2);

}

/* detectar crecimiento 6 */

if(a.includes("6")){

sumar("68",4);
sumar("86",3);
sumar("65",2);

}

});

/* ================= ORDENAR ================= */

let orden=Object
.entries(pesos)
.sort((a,b)=>b[1]-a[1]);

let principal=orden[0][0];
let apoyo=orden[1][0];
let refuerzo=orden[2][0];

/* ================= DOMINANTE ================= */

let dominante=principal[0];

/* ================= ALERTAS ================= */

let alerta=
"🟢 Núcleo estable";

if(
principal==="28"
||
principal==="82"
){

alerta=
"⚠️ Continuidad fuerte 8-2";

}

if(
principal==="85"
||
principal==="58"
){

alerta=
"💣 Mutación hacia 5";

}

if(
principal==="68"
||
principal==="65"
){

alerta=
"💣 Transferencia hacia 6";

}

/* ================= RESULTADO ================= */

document.getElementById(
"resultado"
).innerHTML=`

<div class="resultado">

🎯 PROYECCIÓN PARA ${sorteo}<br><br>

💣 NÚCLEO DOMINANTE<br>
<span>${dominante}</span><br><br>

🎯 AMBOS PRINCIPAL<br>
<span>${principal}</span><br><br>

✔ APOYO ESTRATÉGICO<br>
<span>${apoyo}</span><br><br>

⚠️ REFUERZO<br>
<span>${refuerzo}</span><br><br>

<div class="alerta">
${alerta}
</div>

</div>

`;

}

</script>

</body>
</html>
