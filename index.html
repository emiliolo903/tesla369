EMI Tesla PRO V36 iniciado

  <script>

//////////////////////////////////////////////////
// BASE HISTÓRICA V36
//////////////////////////////////////////////////

const DB_KEY="EMI_TESLA_V36_DB";

const CICLOS_KEY="EMI_TESLA_V36_CICLOS";


let base=[];

let ciclos=[];

let pararOCR=false;




try{

base=JSON.parse(

localStorage.getItem(DB_KEY)||"[]"

);


if(!Array.isArray(base)){

base=[];

}


}catch(e){

base=[];

}





try{

ciclos=JSON.parse(

localStorage.getItem(CICLOS_KEY)||"[]"

);


if(!Array.isArray(ciclos)){

ciclos=[];

}


}catch(e){

ciclos=[];

}





//////////////////////////////////////////////////
// MOSTRAR
//////////////////////////////////////////////////

function mostrar(texto){

let salida=

document.getElementById("resultado");


if(salida){

salida.innerText=texto;

}


}






//////////////////////////////////////////////////
// ESTADO
//////////////////////////////////////////////////

function actualizarEstado(){

let total=

document.getElementById("total");


if(total){

total.innerText=base.length;

}


}






//////////////////////////////////////////////////
// GUARDAR
//////////////////////////////////////////////////

function guardarBase(){

localStorage.setItem(

DB_KEY,

JSON.stringify(base)

);


actualizarEstado();


}



function guardarCiclos(){

localStorage.setItem(

CICLOS_KEY,

JSON.stringify(ciclos)

);


}







//////////////////////////////////////////////////
// DUPLICADOS
//////////////////////////////////////////////////

function existeRegistro(r){


return base.some(x=>

x.numero===r.numero &&

x.turno===r.turno &&

x.fecha===r.fecha

);


}







//////////////////////////////////////////////////
// AGREGAR REGISTRO
//////////////////////////////////////////////////

function agregarRegistro(r){


if(!existeRegistro(r)){


base.push(r);


agregarCiclo(r);


return true;


}


return false;


}






//////////////////////////////////////////////////
// OCR PDF V36
//////////////////////////////////////////////////

async function iniciarOCR(){



let archivo=

document.getElementById("archivoPDF").files[0];




if(!archivo){


alert("Seleccione un PDF");


return;


}




pararOCR=false;



document.getElementById("estado").innerText=

"PROCESANDO";



let datos=

await archivo.arrayBuffer();




let pdf=

await pdfjsLib.getDocument({

data:datos

}).promise;





document.getElementById("paginas").innerText=

pdf.numPages;






let worker=

await Tesseract.createWorker("spa");






for(

let pagina=1;

pagina<=pdf.numPages;

pagina++

){



if(pararOCR)

break;




let page=

await pdf.getPage(pagina);




let viewport=

page.getViewport({

scale:2

});




let canvas=

document.createElement("canvas");



canvas.width=

viewport.width;


canvas.height=

viewport.height;





await page.render({

canvasContext:

canvas.getContext("2d"),

viewport

}).promise;






let texto=

await worker.recognize(canvas);





guardarOCR(

texto.data.text,

pagina

);





document.getElementById("barra").style.width=

((pagina/pdf.numPages)*100)+"%";




document.getElementById("infoOCR").innerText=

"Procesando página "+pagina+" de "+pdf.numPages;




}





await worker.terminate();



guardarBase();



document.getElementById("estado").innerText=

"FINALIZADO";



mostrar(

"✅ OCR terminado\n\nRegistros: "+base.length

);



}







function detenerOCR(){


pararOCR=true;


mostrar("⛔ OCR detenido");


}






//////////////////////////////////////////////////
// EXTRAER NUMEROS
//////////////////////////////////////////////////

function extraerNumeros(texto){


return texto.match(/\b\d{4}\b/g)||[];


}







//////////////////////////////////////////////////
// GUARDAR OCR
//////////////////////////////////////////////////

function guardarOCR(texto,pagina){


let numeros=

extraerNumeros(texto);



let turno=

detectarTurno(texto);



let fecha=

new Date()

.toISOString()

.split("T")[0];




numeros.forEach(numero=>{


agregarRegistro({

fecha,

turno,

numero,

pagina,

origen:"OCR"

});


});



}






function detectarTurno(texto){


let t=

texto.toUpperCase()

.normalize("NFD")

.replace(/[\u0300-\u036f]/g,"");



if(t.includes("PREV"))

return "PREVIA";


if(t.includes("PRIMER"))

return "PRIMERA";


if(t.includes("MATU"))

return "MATUTINA";


if(t.includes("VES"))

return "VESPERTINA";


if(t.includes("NOC"))

return "NOCTURNA";



return "DESCONOCIDO";


}
    //////////////////////////////////////////////////
// CICLOS HISTÓRICOS V36
//////////////////////////////////////////////////

function crearCiclo(fecha){

return {

fecha:fecha,

PREVIA:[],

PRIMERA:[],

MATUTINA:[],

VESPERTINA:[],

NOCTURNA:[]

};


}






function agregarCiclo(r){


let ciclo=

ciclos.find(c=>

c.fecha===r.fecha

);



if(!ciclo){


ciclo=

crearCiclo(r.fecha);


ciclos.push(ciclo);


}





if(ciclo[r.turno]){


ciclo[r.turno].push(r.numero);


}



guardarCiclos();



}







//////////////////////////////////////////////////
// CARGA MANUAL
//////////////////////////////////////////////////

function guardarManual(){



let turno=

document.getElementById("turnoManual").value;



let texto=

document.getElementById("numerosManual").value;



let numeros=

texto.match(/\d{4}/g);





if(!numeros){


mostrar("⚠️ Ingrese números de 4 cifras");


return;


}



let fecha=

new Date()

.toISOString()

.split("T")[0];




let nuevos=0;




numeros.forEach(numero=>{


if(

agregarRegistro({

fecha,

turno,

numero,

origen:"MANUAL"

})

){


nuevos++;


}



});




guardarBase();




mostrar(`

✅ DATOS GUARDADOS


Turno:

${turno}


Nuevos:

${nuevos}


🧠 Analizando transición...

`);




analizarTransicion(turno);



}






//////////////////////////////////////////////////
// ORDEN DE TURNOS
//////////////////////////////////////////////////

const ORDEN_TURNOS=[

"PREVIA",

"PRIMERA",

"MATUTINA",

"VESPERTINA",

"NOCTURNA"

];







function turnoSiguiente(turno){


let pos=

ORDEN_TURNOS.indexOf(turno);



if(pos===4)

return "PREVIA";



return ORDEN_TURNOS[pos+1];


}







function turnoAnterior(turno){


let pos=

ORDEN_TURNOS.indexOf(turno);



if(pos<=0)

return "";


return ORDEN_TURNOS[pos-1];


                }
    //////////////////////////////////////////////////
// TRANSICIÓN IA V36
//////////////////////////////////////////////////

function analizarTransicion(origen){


let destino=

turnoSiguiente(origen);



let datos=[];



base.forEach(r=>{


if(r.turno===destino){


datos.push(r);


}



});





if(datos.length<3){


mostrar(`

⚠️ Poco historial


Modelo:

${origen}

↓

${destino}



Registros:

${datos.length}

`);


return;


}




calcularRankingV36(

datos,

origen,

destino

);



}






//////////////////////////////////////////////////
// RANKING HISTÓRICO V36
//////////////////////////////////////////////////

function calcularRankingV36(
datos,
origen,
destino
){


let puntos={};

let terminaciones={};





datos.forEach(r=>{


let numero=r.numero;



if(!/^\d{4}$/.test(numero))

return;





if(!puntos[numero]){

puntos[numero]=0;

}





// frecuencia histórica

puntos[numero]+=50;







// terminación ambos

let ambos=

numero.slice(-2);



terminaciones[ambos]=

(terminaciones[ambos]||0)+1;







// peso fecha reciente

let dias=

(Date.now()-

new Date(r.fecha))

/86400000;



puntos[numero]+=

100/

Math.max(1,dias);





});






// sumar fuerza de ambos

Object.keys(puntos).forEach(numero=>{


let ambos=

numero.slice(-2);



if(terminaciones[ambos]){


puntos[numero]+=

terminaciones[ambos]*15;


}



});







let ranking=

Object.keys(puntos)

.map(numero=>{


return {

numero,

puntaje:puntos[numero]

};


})

.sort((a,b)=>

b.puntaje-a.puntaje

);






generarResultadoV36(

ranking,

origen,

destino,

datos.length

);



}








//////////////////////////////////////////////////
// PATRONES HISTÓRICOS
//////////////////////////////////////////////////

function analizarPatrones(){


let patrones={};



base.forEach(r=>{


let ambos=

r.numero.slice(-2);



patrones[ambos]=

(patrones[ambos]||0)+1;



});






let orden=

Object.keys(patrones)

.sort((a,b)=>

patrones[b]-patrones[a]

)

.slice(0,20);







mostrar(`

🔬 PATRONES HISTÓRICOS V36


${orden.map(x=>

x+" = "+patrones[x]+" veces"

).join("\n")}


`);



}
 

//////////////////////////////////////////////////
// GENERADOR INTELIGENTE V36
//////////////////////////////////////////////////

function generarResultadoV36(
ranking,
origen,
destino,
cantidad
){


if(!ranking.length){

mostrar("⚠️ Sin datos");

return;

}



let principal =
ranking[0].numero;



let apoyo="";



// Buscar un apoyo con terminación diferente

for(let i=1;i<ranking.length;i++){


let candidato =
ranking[i].numero;



if(

candidato !== principal &&

candidato.slice(-2)!==principal.slice(-2)

){


apoyo=candidato;

break;


}


}



if(!apoyo){

apoyo=ranking[1].numero;

}





mostrar(`

🧠 EMI TESLA PRO V36 IA HISTÓRICA


MODELO:

${origen}

↓

${destino}



🔥 CUATERNO PRINCIPAL

${principal}



🟡 CUATERNO APOYO

${apoyo}



⚡ TERNO PRINCIPAL

${principal.slice(-3)}



🟡 TERNO APOYO

${apoyo.slice(-3)}



💥 AMBOS PRINCIPAL

${principal.slice(-2)}



🟡 AMBOS APOYO

${apoyo.slice(-2)}



📊 REGISTROS ANALIZADOS

${cantidad}


`);

}






//////////////////////////////////////////////////
// ESTADÍSTICAS
//////////////////////////////////////////////////

function estadisticasBase(){



mostrar(`

📊 ESTADÍSTICAS V36


TOTAL REGISTROS:

${base.length}



OCR:

${base.filter(x=>x.origen==="OCR").length}



MANUAL:

${base.filter(x=>x.origen==="MANUAL").length}



CICLOS:

${ciclos.length}



`);



}







//////////////////////////////////////////////////
// ESTADO SISTEMA
//////////////////////////////////////////////////

function estadoSistema(){


mostrar(`

🚀 EMI TESLA PRO V36


📊 Registros:

${base.length}



🧠 IA:

ACTIVA



📄 OCR:

ACTIVO



💾 Base:

LOCAL STORAGE


`);



}








//////////////////////////////////////////////////
// INICIO
//////////////////////////////////////////////////

window.onload=function(){


actualizarEstado();



mostrar(`

🚀 EMI TESLA PRO V36 INICIADO


Registros cargados:

${base.length}


`);



};

</script>
