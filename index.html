<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EMI Tesla PRO V25</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
    font-family: Arial;
    background:#111;
    color:#fff;
    padding:15px;
}

button{
    padding:10px;
    margin:5px;
}

.box{
    border:1px solid #444;
    padding:10px;
    margin-top:10px;
    white-space:pre-wrap;
    max-height:300px;
    overflow:auto;
}
</style>
</head>

<body>

<h2>🚀 EMI Tesla PRO V25 (REAL OCR)</h2>

<input type="file" id="fileInput">

<br>

<button onclick="runOCR()">📄 OCR (Imagen / PDF)</button>
<button onclick="buildDB()">🧠 Crear Base</button>
<button onclick="predict()">🔮 Predicción</button>
<button onclick="exportDB()">📤 Exportar</button>
<button onclick="importDB()">📥 Importar</button>
<button onclick="clearAll()">🧹 Limpiar</button>

<div class="box" id="log"></div>
<div class="box" id="out"></div>

<script>

//////////////////////////////
// 📦 DB (persistente)
//////////////////////////////

let db = JSON.parse(localStorage.getItem("emi_db") || "[]");
let rawText = "";
let cleanText = "";

//////////////////////////////
// 📄 OCR REAL
//////////////////////////////

async function runOCR(){

    const file = document.getElementById("fileInput").files[0];
    if(!file) return log("⚠️ Subí imagen o PDF");

    log("📄 Procesando OCR...");

    const result = await Tesseract.recognize(
        file,
        'spa',
        {
            logger: m => console.log(m)
        }
    );

    rawText = result.data.text;

    cleanText = rawText
        .replace(/\s+/g," ")
        .replace(/[^0-9a-zA-ZáéíóúÁÉÍÓÚ\/\-\n ]/g,"");

    log("✅ OCR listo");
}

//////////////////////////////
// 🧠 PARSER
//////////////////////////////

function buildDB(){

    if(!cleanText) return log("⚠️ Primero OCR");

    const lines = cleanText.split("\n");

    let temp = [];

    lines.forEach(l => {

        const nums = l.match(/\d{4}/g);
        const date = l.match(/\d{2}\/\d{2}\/\d{4}/)?.[0];

        if(nums){
            temp.push({
                fecha: date || "sin fecha",
                numeros: nums
            });
        }
    });

    db = db.concat(temp);

    localStorage.setItem("emi_db", JSON.stringify(db));

    log("🧠 Base actual: " + db.length);
}

//////////////////////////////
// 🔮 PREDICCIÓN REAL (freq + recencia)
//////////////////////////////

function predict(){

    let freq = {};

    db.forEach(d=>{
        d.numeros.forEach(n=>{
            freq[n] = (freq[n]||0)+1;
        });
    });

    let ranked = Object.entries(freq).map(([num,score])=>{

        const recencia = db.slice(-10)
            .filter(d=>d.numeros.includes(num)).length;

        return {
            num,
            score: score*5 + recencia*3
        };
    });

    ranked.sort((a,b)=>b.score-a.score);

    let out = "🔮 AMBOS PRO V25\n\n";

    ranked.slice(0,10).forEach(r=>{
        out += `${r.num} → ${r.score}\n`;
    });

    document.getElementById("out").innerText = out;
}

//////////////////////////////
// 📤 EXPORTAR
//////////////////////////////

function exportDB(){

    const blob = new Blob(
        [JSON.stringify(db,null,2)],
        {type:"application/json"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "emi_tesla_v25_db.json";
    a.click();

    log("📤 exportado");
}

//////////////////////////////
// 📥 IMPORTAR
//////////////////////////////

function importDB(){

    const file = document.getElementById("fileInput").files[0];
    if(!file) return log("⚠️ subí JSON");

    const reader = new FileReader();

    reader.onload = e => {
        db = JSON.parse(e.target.result);
        localStorage.setItem("emi_db", JSON.stringify(db));
        log("📥 DB importada");
    };

    reader.readAsText(file);
}

//////////////////////////////
// 🧹 LIMPIAR
//////////////////////////////

function clearAll(){
    db = [];
    rawText = "";
    cleanText = "";
    localStorage.removeItem("emi_db");
    document.getElementById("out").innerText="";
    log("🧹 limpio total");
}

//////////////////////////////
// 🖥️ LOG
//////////////////////////////

function log(m){
    document.getElementById("log").innerText += "\n"+m;
}

//////////////////////////////
// 🔁 AUTO CARGA DB
//////////////////////////////

log("🚀 V25 listo - DB cargada: " + db.length);

</script>

</body>
</html>
