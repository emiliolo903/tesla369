<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EMI Tesla PRO V26 OCR FAST</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
    font-family: Arial;
    background:#111;
    color:#fff;
    padding:15px;
}

button{
    padding:10px;
    margin:5px;
}

.box{
    border:1px solid #444;
    padding:10px;
    margin-top:10px;
    white-space:pre-wrap;
    max-height:300px;
    overflow:auto;
}
</style>
</head>

<body>

<h2>🚀 EMI Tesla PRO V26 - OCR OPTIMIZADO</h2>

<input type="file" id="fileInput">

<br>

<button onclick="startOCR()">📄 OCR RÁPIDO</button>
<button onclick="buildDB()">🧠 Crear Base</button>
<button onclick="predict()">🔮 Predicción</button>
<button onclick="exportDB()">📤 Exportar</button>
<button onclick="clearAll()">🧹 Limpiar</button>

<div class="box" id="progress">Progreso: esperando...</div>
<div class="box" id="log"></div>
<div class="box" id="out"></div>

<script>

//////////////////////////////
// 📦 DB
//////////////////////////////

let db = [];
let fullText = "";

//////////////////////////////
// ⚡ OCR POR PARTES
//////////////////////////////

async function startOCR(){

    const file = document.getElementById("fileInput").files[0];
    if(!file) return log("⚠️ Subí archivo");

    log("📄 Iniciando OCR rápido...");

    const worker = await Tesseract.createWorker("spa");

    await worker.setParameters({
        tessedit_pageseg_mode: Tesseract.PSM.AUTO
    });

    // ⚡ dividir en chunks simulados (mejora estabilidad)
    const result = await worker.recognize(file, {
        logger: m => {

            if(m.status === "recognizing text"){
                document.getElementById("progress").innerText =
                    "🔄 Procesando: " + Math.round(m.progress * 100) + "%";
            }
        }
    });

    fullText = result.data.text;

    fullText = fullText
        .replace(/\s+/g," ")
        .replace(/[^0-9a-zA-ZáéíóúÁÉÍÓÚ\/\-\n ]/g,"");

    await worker.terminate();

    document.getElementById("progress").innerText = "✅ OCR COMPLETO";

    log("📄 OCR terminado");
}

//////////////////////////////
// 🧠 PARSER RÁPIDO
//////////////////////////////

function buildDB(){

    if(!fullText) return log("⚠️ Primero OCR");

    const lines = fullText.split("\n");

    db = [];

    lines.forEach(l => {

        const nums = l.match(/\d{4}/g);
        const date = l.match(/\d{2}\/\d{2}\/\d{4}/)?.[0];

        if(nums){
            db.push({
                fecha: date || "sin fecha",
                numeros: nums
            });
        }
    });

    log("🧠 DB creada: " + db.length);
}

//////////////////////////////
// 🔮 PREDICCIÓN SIMPLE V26
//////////////////////////////

function predict(){

    let freq = {};

    db.forEach(d=>{
        d.numeros.forEach(n=>{
            freq[n] = (freq[n]||0)+1;
        });
    });

    let ranked = Object.entries(freq)
        .map(([num,score])=>({
            num,
            score: score
        }))
        .sort((a,b)=>b.score-a.score)
        .slice(0,10);

    let out = "🔮 AMBOS PRO V26\n\n";

    ranked.forEach(r=>{
        out += `${r.num} → ${r.score}\n`;
    });

    document.getElementById("out").innerText = out;
}

//////////////////////////////
// 📤 EXPORT
//////////////////////////////

function exportDB(){

    const blob = new Blob(
        [JSON.stringify(db,null,2)],
        {type:"application/json"}
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "emi_tesla_v26.json";
    a.click();

    log("📤 exportado");
}

//////////////////////////////
// 🧹 LIMPIAR
//////////////////////////////

function clearAll(){
    db = [];
    fullText = "";
    document.getElementById("out").innerText = "";
    document.getElementById("progress").innerText = "Progreso: esperando...";
    log("🧹 limpio");
}

//////////////////////////////
// 🖥️ LOG
//////////////////////////////

function log(m){
    document.getElementById("log").innerText += "\n" + m;
}

</script>

</body>
</html>
