//////////////////////////////////////////////////
// V46 BLOQUE 2
// BASE INDEXEDDB LIMPIA
//////////////////////////////////////////////////


const DB_NAME_V46 = "EMI_TESLA_PRO_V46";

const DB_VERSION_V46 = 1;


const STORES_V46 = {

    historico:"historico",

    memoriaDia:"memoriaDia",

    aprendizaje:"aprendizaje",

    predicciones:"predicciones",

    auditoria:"auditoria"

};


let dbV46 = null;



//////////////////////////////////////////////////
// ABRIR BASE
//////////////////////////////////////////////////

function abrirBaseV46(){


return new Promise((resolve,reject)=>{


let request = indexedDB.open(

DB_NAME_V46,

DB_VERSION_V46

);



request.onupgradeneeded=function(e){


let db=e.target.result;



Object.values(STORES_V46)
.forEach(store=>{


if(!db.objectStoreNames.contains(store)){


db.createObjectStore(

store,

{
keyPath:"id",
autoIncrement:true
}

);


}


});


};



request.onsuccess=function(e){


dbV46=e.target.result;



let estado=

document.getElementById(
"estadoBase"
);



if(estado){

estado.innerText="ACTIVA";

}



resolve(true);



};



request.onerror=function(e){

reject(e);

};



});


}





//////////////////////////////////////////////////
// GUARDAR EN BASE
//////////////////////////////////////////////////

function guardarV46(store, dato){


return new Promise((resolve,reject)=>{


let tx=

dbV46.transaction(

store,

"readwrite"

);



let tabla=

tx.objectStore(store);



tabla.add(dato);



tx.oncomplete=function(){

resolve(true);

};



tx.onerror=function(e){

reject(e);

};



});


}






//////////////////////////////////////////////////
// LEER BASE
//////////////////////////////////////////////////

function leerV46(store){


return new Promise((resolve,reject)=>{


let tx=

dbV46.transaction(

store,

"readonly"

);



let tabla=

tx.objectStore(store);



let consulta=

tabla.getAll();



consulta.onsuccess=function(){


resolve(
consulta.result
);


};



consulta.onerror=function(e){

reject(e);

};



});


}





//////////////////////////////////////////////////
// GUARDAR HISTÓRICO
//////////////////////////////////////////////////

  //////////////////////////////////////////////////
// V46 BLOQUE 3
// OCR PDF HISTÓRICO
//////////////////////////////////////////////////

let OCR_V46_ACTIVO=false;
let DETENER_OCR_V46=false;



function detectarFechaV46(texto){

    let buscar = texto.match(
        /\d{2}[\/\-]\d{2}[\/\-]\d{4}/
    );


    if(buscar){

        let partes =
        buscar[0]
        .replace(/\-/g,"/")
        .split("/");


        return partes[2]+"-"+partes[1]+"-"+partes[0];

    }


    return "SIN_FECHA";

}




function detectarTurnoV46(texto){

    texto=texto.toUpperCase();


    if(texto.includes("PREVIA"))
        return "PREVIA";


    if(texto.includes("PRIMERA"))
        return "PRIMERA";


    if(texto.includes("MATUTINA"))
        return "MATUTINA";


    if(texto.includes("VESPERTINA"))
        return "VESPERTINA";


    if(texto.includes("NOCTURNA"))
        return "NOCTURNA";


    return "SIN_TURNO";

}





function detectarProvinciaV46(texto){

    texto=texto.toUpperCase();


    let lista=[

    "CORRIENTES",
    "CIUDAD",
    "BONAERENSE",
    "SANTA FE",
    "CORDOBA",
    "ENTRE RIOS",
    "CHACO"

    ];


    for(let p of lista){

        if(texto.includes(p))
            return p;

    }


    return "DESCONOCIDA";

}




function extraerPrimerPremioV46(texto){

    let numeros =
    texto.match(/\b\d{4}\b/g)||[];


    if(numeros.length>0){

        return numeros[0];

    }


    return null;

}





async function guardarPremioV46(datos){


await guardarHistoricoV46({

    fecha:datos.fecha,

    turno:datos.turno,

    provincia:datos.provincia,

    numero:datos.numero,

    premio:1,

    origen:"OCR_V46",

    pagina:datos.pagina


});


}







async function iniciarOCR(){


let archivo=

document.getElementById(
"archivoPDF"
).files[0];



if(!archivo){

mostrarV46("Seleccione PDF");

return;

}



DETENER_OCR_V46=false;



let buffer=

await archivo.arrayBuffer();



let pdf=

await pdfjsLib
.getDocument({
data:buffer
})
.promise;



let worker=

await Tesseract.createWorker("spa");



let total=0;



for(
let pagina=1;
pagina<=pdf.numPages;
pagina++
){


if(DETENER_OCR_V46)
break;



document.getElementById(
"progresoOCR"
).innerText=

"Procesando página "+
pagina+
" / "+
pdf.numPages;



let page=

await pdf.getPage(pagina);



let viewport=

page.getViewport({
scale:3
});



let canvas=

document.createElement(
"canvas"
);



canvas.width=
viewport.width;


canvas.height=
viewport.height;



let ctx=

canvas.getContext("2d");



await page.render({

canvasContext:ctx,

viewport

}).promise;



let lectura=

await worker.recognize(canvas);



let texto=

lectura.data.text.toUpperCase();



let fecha=

detectarFechaV46(texto);



let turno=

detectarTurnoV46(texto);



let provincia=

detectarProvinciaV46(texto);



let numero=

extraerPrimerPremioV46(texto);



if(
numero &&
fecha!=="SIN_FECHA"
){


await guardarPremioV46({

fecha,

turno,

provincia,

numero,

pagina

});


total++;


}


}



await worker.terminate();



await actualizarTotalV46();



mostrarV46(

"✅ OCR FINALIZADO\n\n"+
"Registros nuevos: "+
total

);



}





function detenerOCR(){

  //////////////////////////////////////////////////
// V46 BLOQUE 4
// MEMORIA HISTÓRICA
//////////////////////////////////////////////////


let MEMORIA_DIA_V46={};

let MATRIZ_V46={};




async function construirMemoriaDiaV46(){


let datos=

await leerV46(
STORES_V46.historico
);



MEMORIA_DIA_V46={};



for(let d of datos){


if(!MEMORIA_DIA_V46[d.fecha]){

MEMORIA_DIA_V46[d.fecha]={};

}



if(!MEMORIA_DIA_V46[d.fecha][d.turno]){

MEMORIA_DIA_V46[d.fecha][d.turno]={};

}



if(!MEMORIA_DIA_V46[d.fecha][d.turno][d.provincia]){

MEMORIA_DIA_V46[d.fecha][d.turno][d.provincia]=[];

}



MEMORIA_DIA_V46[d.fecha][d.turno][d.provincia]
.push(d.numero);



}



return MEMORIA_DIA_V46;

}






async function construirMatrizV46(){


await construirMemoriaDiaV46();



MATRIZ_V46={};



let orden=[

"PREVIA",
"PRIMERA",
"MATUTINA",
"VESPERTINA",
"NOCTURNA"

];



for(let fecha in MEMORIA_DIA_V46){


let dia=

MEMORIA_DIA_V46[fecha];



for(let i=0;i<orden.length-1;i++){


let actual=orden[i];

let siguiente=orden[i+1];



if(!dia[actual])
continue;



if(!dia[siguiente])
continue;



for(let provincia in dia[actual]){


let base=

dia[actual][provincia][0]
.slice(-2);



let proximo=

dia[siguiente][provincia][0]
.slice(-2);



if(!MATRIZ_V46[base]){

MATRIZ_V46[base]={};

}



MATRIZ_V46[base][proximo]=

(MATRIZ_V46[base][proximo]||0)+1;



}



}



}



return MATRIZ_V46;

}
               
//////////////////////////////////////////////////
// V46 BLOQUE 5
// MOTOR IA + TESLA
//////////////////////////////////////////////////


const TESLA_V46 = {

0:["0","0"],
1:["0","0"],
2:["5","7"],
3:["8","0"],
4:["6","9"],
5:["2","7"],
6:["4","9"],
7:["5","2"],
8:["3","0"],
9:["3","4"]

};



let RANKING_V46={};





async function analizarIA_V46(){


let datos=

await leerV46(
STORES_V46.historico
);



RANKING_V46={};



for(let d of datos){


let ambos=

String(d.numero)
.slice(-2);



RANKING_V46[ambos]=

(RANKING_V46[ambos]||0)+1;



}



return Object.keys(RANKING_V46)
.sort(
(a,b)=>
RANKING_V46[b]-RANKING_V46[a]
);

}







function aplicarTeslaV46(numero){


let salida="";


for(let d of numero){


if(TESLA_V46[d]){

salida+=TESLA_V46[d][0];

}


}


return salida;

}







async function generarResultadoIA(){


let ranking=

ranking.slice(0,3);

async function generarTesla(){


let ranking=

await analizarIA_V46();



let salida=[];


for(let n of ranking.slice(0,5)){


salida.push(

n+" → "+aplicarTeslaV46(n)

);


}



mostrarV46(`

${salida.join("\n")}

  //////////////////////////////////////////////////
// V46 BLOQUE 6
// ACOMPAÑANTE IA
//////////////////////////////////////////////////



async function buscarAcompananteV46(){


await construirMatrizV46();



let ranking=

await analizarIA_V46();



let candidatos=[];



for(let n of ranking){


let peso=

RANKING_V46[n];



let continuidad=0;



if(MATRIZ_V46[n]){


let valores=

Object.values(
MATRIZ_V46[n]
);



continuidad=

valores.reduce(
(a,b)=>a+b,
0
);


}



let fuerza=

peso+continuidad;



candidatos.push({

numero:n,

fuerza:fuerza

});



}



candidatos.sort(

(a,b)=>
b.fuerza-a.fuerza

);




return candidatos
.slice(0,3)
.map(
(x)=>x.numero
);


}

async function auditoriaSistema(){


let datos=

await leerV46(
STORES_V46.historico
);



AUDITORIA_V46.registros=

datos.length;



AUDITORIA_V46.provincias={};

if(!AUDITORIA_V46.provincias[d.provincia]){

AUDITORIA_V46.provincias[d.provincia]++;
