<script>
  //////////////////////////////////////////////////
// BASE HISTÓRICA V37 CORREGIDA
//////////////////////////////////////////////////

const DB_KEY="EMI_TESLA_V37_DB";

const CICLOS_KEY="EMI_TESLA_V37_CICLOS";

const MATRIZ_KEY="EMI_TESLA_V37_MATRIZ";

const ACOMP_KEY="EMI_TESLA_V37_ACOMP";


let base=[];

let ciclos=[];

let matriz=[];

let acompañantes=[];

let pararOCR=false;




//////////////////////////////////////////////////
// CARGAR DATOS GUARDADOS
//////////////////////////////////////////////////

function cargarDatos(){


try{

base=JSON.parse(

localStorage.getItem(DB_KEY)||"[]"

);


if(!Array.isArray(base))
base=[];


}catch(e){

base=[];

}




try{

ciclos=JSON.parse(

localStorage.getItem(CICLOS_KEY)||"[]"

);


if(!Array.isArray(ciclos))
ciclos=[];


}catch(e){

ciclos=[];

}




try{

matriz=JSON.parse(

localStorage.getItem(MATRIZ_KEY)||"[]"

);


if(!Array.isArray(matriz))
matriz=[];


}catch(e){

matriz=[];

}




try{

acompañantes=JSON.parse(

localStorage.getItem(ACOMP_KEY)||"[]"

);


if(!Array.isArray(acompañantes))
acompañantes=[];


}catch(e){

acompañantes=[];

}


}







//////////////////////////////////////////////////
// GUARDAR TODO
//////////////////////////////////////////////////

function guardarTodo(){


localStorage.setItem(

DB_KEY,

JSON.stringify(base)

);


localStorage.setItem(

CICLOS_KEY,

JSON.stringify(ciclos)

);


localStorage.setItem(

MATRIZ_KEY,

JSON.stringify(matriz)

);


localStorage.setItem(

ACOMP_KEY,

JSON.stringify(acompañantes)

);


actualizarEstado();


}







//////////////////////////////////////////////////
// MOSTRAR
//////////////////////////////////////////////////

function mostrar(texto){


let salida=

document.getElementById("resultado");


if(salida){

salida.innerText=texto;

}


}







//////////////////////////////////////////////////
// ACTUALIZAR ESTADO
//////////////////////////////////////////////////

function actualizarEstado(){


let t=

document.getElementById("total");


if(t){

t.innerText=base.length;

}


}







//////////////////////////////////////////////////
// EVITAR DUPLICADOS
//////////////////////////////////////////////////

function existeRegistro(r){


return base.some(x=>

x.numero===r.numero &&

x.turno===r.turno &&

x.fecha===r.fecha &&

x.provincia===r.provincia

);


}







//////////////////////////////////////////////////
// AGREGAR REGISTRO
//////////////////////////////////////////////////

function agregarRegistro(r){


if(!existeRegistro(r)){


base.push(r);


agregarCiclo(r);


agregarMatriz(r);


return true;


}


return false;


}







//////////////////////////////////////////////////
// CICLOS HISTÓRICOS
//////////////////////////////////////////////////

function crearCiclo(fecha){


return {

fecha:fecha,

PREVIA:[],

PRIMERA:[],

MATUTINA:[],

VESPERTINA:[],

NOCTURNA:[]

};


}




function agregarCiclo(r){


let ciclo=

ciclos.find(c=>

c.fecha===r.fecha

);



if(!ciclo){


ciclo=crearCiclo(r.fecha);


ciclos.push(ciclo);


}




if(ciclo[r.turno]){


ciclo[r.turno].push(r.numero);


}


}







//////////////////////////////////////////////////
// MATRIZ PROVINCIAL
//////////////////////////////////////////////////

function agregarMatriz(r){


let existe=

matriz.some(x=>

x.provincia===r.provincia &&

x.numero===r.numero

);



if(!existe){


matriz.push({

provincia:r.provincia,

numero:r.numero,

ambos:r.numero.slice(-2),

turno:r.turno

});


}


  }
  //////////////////////////////////////////////////
// OCR HISTÓRICO V37
//////////////////////////////////////////////////

async function iniciarOCR(){


let archivo=

document.getElementById("archivoPDF").files[0];



if(!archivo){

alert("Seleccione un PDF");

return;

}




try{


pararOCR=false;


document.getElementById("estado").innerText="PROCESANDO";



let datos=

await archivo.arrayBuffer();



let pdf=

await pdfjsLib.getDocument({

data:datos

}).promise;




document.getElementById("paginas").innerText=

pdf.numPages;




let provincia=

document.getElementById("provinciaOCR").value;





let worker=

await Tesseract.createWorker("spa");




for(let pagina=1; pagina<=pdf.numPages; pagina++){



if(pararOCR)

break;





let page=

await pdf.getPage(pagina);



let viewport=

page.getViewport({

scale:2

});





let canvas=

document.createElement("canvas");



canvas.width=viewport.width;

canvas.height=viewport.height;





await page.render({

canvasContext:canvas.getContext("2d"),

viewport

}).promise;





let resultado=

await worker.recognize(canvas);



let texto=

resultado.data.text || "";





if(texto.length>0){


guardarOCR(

texto,

pagina,

provincia

);


}





document.getElementById("barra").style.width=

((pagina/pdf.numPages)*100)+"%";



document.getElementById("infoOCR").innerText=

"Página "+pagina+" de "+pdf.numPages;



}




await worker.terminate();



guardarTodo();




document.getElementById("estado").innerText="FINALIZADO";



mostrar(

"✅ OCR FINALIZADO\n\n"+
"Registros: "+base.length+
"\n\nBase guardada."

);



}catch(error){



mostrar(

"❌ ERROR OCR\n\n"+error

);



}



}





function detenerOCR(){


pararOCR=true;


mostrar("⛔ OCR detenido");


}







//////////////////////////////////////////////////
// EXTRAER NÚMEROS
//////////////////////////////////////////////////

function extraerNumeros(texto){


return texto.match(/\b\d{4}\b/g)||[];

}







//////////////////////////////////////////////////
// DETECTAR TURNO
//////////////////////////////////////////////////

function detectarTurno(texto){


let t=

texto.toUpperCase()

.normalize("NFD")

.replace(/[\u0300-\u036f]/g,"");



if(t.includes("PREV"))
return "PREVIA";


if(t.includes("PRIMER"))
return "PRIMERA";


if(t.includes("MATU"))
return "MATUTINA";


if(t.includes("VES"))
return "VESPERTINA";


if(t.includes("NOC"))
return "NOCTURNA";


return "DESCONOCIDO";


}







//////////////////////////////////////////////////
// GUARDAR OCR
//////////////////////////////////////////////////

function guardarOCR(texto,pagina,provincia){


let numeros=

extraerNumeros(texto);



let turno=

detectarTurno(texto);



let fecha=

new Date()

.toISOString()

.split("T")[0];





numeros.forEach(numero=>{


agregarRegistro({

fecha,

provincia,

turno,

numero,

pagina,

origen:"OCR"

});


});


  }
  //////////////////////////////////////////////////
// CARGA MANUAL V37
//////////////////////////////////////////////////

function guardarManual(){


let provincia=

document.getElementById("provinciaManual").value;



let turno=

document.getElementById("turnoManual").value;



let texto=

document.getElementById("numerosManual").value;



let numeros=

texto.match(/\d{4}/g);



if(!numeros){


mostrar("⚠️ Ingrese números de 4 cifras");


return;


}



let fecha=

new Date()

.toISOString()

.split("T")[0];



let nuevos=0;



numeros.forEach(numero=>{


if(agregarRegistro({


fecha,

provincia,

turno,

numero,

origen:"MANUAL"


})){


nuevos++;


}



});





guardarTodo();




mostrar(

"✅ DATOS GUARDADOS\n\n"+

"Provincia: "+provincia+

"\nTurno: "+turno+

"\nNuevos: "+nuevos

);





analizarTransicion(

provincia,

turno

);



}









//////////////////////////////////////////////////
// ORDEN DE TURNOS
//////////////////////////////////////////////////

const TURNOS=[

"PREVIA",

"PRIMERA",

"MATUTINA",

"VESPERTINA",

"NOCTURNA"

];




function turnoSiguiente(t){


let p=

TURNOS.indexOf(t);



if(p<0)

return "PREVIA";



if(p===TURNOS.length-1)

return "PREVIA";



return TURNOS[p+1];


}









//////////////////////////////////////////////////
// TRANSICIÓN HISTÓRICA
//////////////////////////////////////////////////

function analizarTransicion(provincia,origen){


let destino=

turnoSiguiente(origen);



let datos=

base.filter(r=>

r.provincia===provincia &&

r.turno===destino

);





if(datos.length<3){


mostrar(

"⚠️ POCO HISTORIAL\n\n"+

provincia+

"\n"+

origen+

" → "+

destino+

"\n\nRegistros: "+datos.length

);



return;


}




calcularRankingV37(

datos,

provincia,

origen,

destino

);



}









//////////////////////////////////////////////////
// MOTOR IA V37
//////////////////////////////////////////////////

function calcularRankingV37(

datos,

provincia,

origen,

destino

){


let puntos={};



let terminaciones={};



datos.forEach(r=>{


let numero=r.numero;



if(!/^\d{4}$/.test(numero))

return;



puntos[numero]=(puntos[numero]||0)+50;



let ambos=

numero.slice(-2);



terminaciones[ambos]=

(terminaciones[ambos]||0)+1;



});





Object.keys(puntos).forEach(numero=>{


puntos[numero]+=

(terminaciones[numero.slice(-2)]||0)*15;



});






let ranking=

Object.keys(puntos)

.map(n=>({

numero:n,

puntaje:puntos[n]

}))

.sort((a,b)=>

b.puntaje-a.puntaje

);





generarResultadoV37(

ranking,

provincia,

origen,

destino,

datos.length

);



  }
  //////////////////////////////////////////////////
// GENERADOR FINAL
//////////////////////////////////////////////////

function generarResultadoV37(

ranking,

provincia,

origen,

destino,

cantidad

){



if(!ranking.length){


mostrar("⚠️ Sin datos suficientes");


return;


}



let principal=

ranking[0].numero;



let apoyo=

ranking.length>1

?

ranking[1].numero

:

principal;





mostrar(

"🧠 EMI TESLA PRO V37\n\n"+

"🌎 Provincia: "+provincia+

"\n\n"+

"🔄 "+origen+" → "+destino+

"\n\n"+

"🔥 CUATERNO PRINCIPAL\n"+principal+

"\n\n"+

"🟡 CUATERNO APOYO\n"+apoyo+

"\n\n"+

"⚡ TERNO PRINCIPAL\n"+principal.slice(-3)+

"\n\n"+

"🟡 TERNO APOYO\n"+apoyo.slice(-3)+

"\n\n"+

"💥 AMBOS PRINCIPAL\n"+principal.slice(-2)+

"\n\n"+

"🟡 AMBOS APOYO\n"+apoyo.slice(-2)+

"\n\n"+

"📊 Datos usados: "+cantidad

);



}








//////////////////////////////////////////////////
// PATRONES
//////////////////////////////////////////////////

function analizarPatrones(){


let mapa={};



base.forEach(r=>{


let a=r.numero.slice(-2);



mapa[a]=(mapa[a]||0)+1;


});



let salida="";



Object.keys(mapa)

.sort((a,b)=>mapa[b]-mapa[a])

.slice(0,20)

.forEach(a=>{


salida+=a+" = "+mapa[a]+" veces\n";


});



mostrar(

"🔬 PATRONES\n\n"+salida

);



}









//////////////////////////////////////////////////
// MATRIZ PROVINCIAL
//////////////////////////////////////////////////

function analizarProvincias(){


let datos={};



matriz.forEach(r=>{


let clave=

r.provincia+

" → "+

r.ambos;



datos[clave]=(datos[clave]||0)+1;


});



let salida="";



Object.keys(datos)

.sort((a,b)=>datos[b]-datos[a])

.slice(0,25)

.forEach(x=>{


salida+=x+" = "+datos[x]+"\n";


});



mostrar(

"🌎 MATRIZ PROVINCIAL\n\n"+salida

);



}









//////////////////////////////////////////////////
// NOCTURNA
//////////////////////////////////////////////////

function analizarNocturna(){


let datos={};



base.filter(r=>

r.turno==="NOCTURNA"

)

.forEach(r=>{


let a=r.numero.slice(-2);



datos[a]=(datos[a]||0)+1;


});



let salida="";



Object.keys(datos)

.sort((a,b)=>datos[b]-datos[a])

.slice(0,20)

.forEach(x=>{


salida+=x+" = "+datos[x]+"\n";


});



mostrar(

"🌙 NOCTURNA\n\n"+salida

);



}









//////////////////////////////////////////////////
// ESTADISTICAS
//////////////////////////////////////////////////

function estadisticasBase(){


mostrar(

"📊 ESTADISTICAS\n\n"+

"Registros: "+base.length+

"\nCiclos: "+ciclos.length+

"\nMatriz: "+matriz.length

);



}









//////////////////////////////////////////////////
// ESTADO
//////////////////////////////////////////////////

function estadoSistema(){


mostrar(

"🚀 EMI TESLA PRO V37\n\n"+

"Base: "+base.length+

"\nCiclos: "+ciclos.length+

"\nMatriz: "+matriz.length+

"\n\n💾 Memoria permanente ACTIVA"

);



}









//////////////////////////////////////////////////
// INICIO
//////////////////////////////////////////////////

window.onload=function(){


cargarDatos();


actualizarEstado();


mostrar(

"🚀 EMI TESLA PRO V37 iniciado\n\n"+

"Registros: "+base.length

);



};

</script>
