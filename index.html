let SISTEMA_V47 = {

//////////////////////////////////////////////////
// BASE PERMANENTE INDEXEDDB
//////////////////////////////////////////////////


const DB_NAME_V47 =
"EMI_TESLA_PRO_V47_FINAL";


const DB_VERSION_V47 = 1;



const STORES_V47 = {


historico:"historico",

matrizTurnos:"matrizTurnos",

matrizProvincias:"matrizProvincias",

acompanantes:"acompanantes",

aprendizaje:"aprendizaje",

auditoria:"auditoria"


};



let dbV47=null;



//////////////////////////////////////////////////
// ABRIR BASE
//////////////////////////////////////////////////


function abrirBaseV47(){


return new Promise((resolve,reject)=>{


let request = indexedDB.open(

DB_NAME_V47,

DB_VERSION_V47

);



request.onupgradeneeded=function(e){


let db=e.target.result;



Object.values(STORES_V47).forEach(store=>{


if(!db.objectStoreNames.contains(store)){


db.createObjectStore(

store,

{

keyPath:"id",

autoIncrement:true

}

);


}



});


};





request.onsuccess=function(e){


dbV47=e.target.result;



let estado=document.getElementById(
"estadoBase"
);


if(estado)
estado.innerText="ACTIVA";



resolve(true);



};





request.onerror=function(e){


reject(e);



};



});


}





//////////////////////////////////////////////////
// GUARDAR DATOS
//////////////////////////////////////////////////


function guardarV47(store,dato){


return new Promise((resolve,reject)=>{


if(!dbV47){

reject("BASE NO ABIERTA");

return;

}



let tx=dbV47.transaction(

store,

"readwrite"

);



let tabla=

tx.objectStore(store);



tabla.add(dato);



tx.oncomplete=()=>resolve(true);



tx.onerror=e=>reject(e);



});


}





//////////////////////////////////////////////////
// LEER DATOS
//////////////////////////////////////////////////


function leerV47(store){


return new Promise((resolve,reject)=>{


let tx=dbV47.transaction(

store,

"readonly"

);



let tabla=

tx.objectStore(store);



let consulta=

tabla.getAll();



consulta.onsuccess=function(){


resolve(consulta.result);


};



consulta.onerror=function(e){


reject(e);


};



});


}

//////////////////////////////////////////////////
// DETECTAR FECHA
//////////////////////////////////////////////////


function detectarFechaV47(texto){


let fecha = texto.match(
/\d{2}[\/\-]\d{2}[\/\-]\d{4}/
);



if(!fecha)
return new Date()
.toISOString()
.slice(0,10);



let p =
fecha[0]
.replace(/-/g,"/")
.split("/");



return p[2]+"-"+p[1]+"-"+p[0];


}





//////////////////////////////////////////////////
// DETECTAR TURNO
//////////////////////////////////////////////////


function detectarTurnoV47(texto){


texto=texto.toUpperCase();



if(texto.includes("PREVIA"))
return "PREVIA";


if(texto.includes("PRIMERA"))
return "PRIMERA";


if(texto.includes("MATUTINA"))
return "MATUTINA";


if(texto.includes("VESPERTINA"))
return "VESPERTINA";


if(texto.includes("NOCTURNA"))
return "NOCTURNA";



return "SIN_TURNO";


}

"CIUDAD",
"BONAERENSE",
"SANTA FE",
"CORDOBA",
"ENTRE RIOS",
"CHACO"

];



for(let p of lista){

return p;

return "DESCONOCIDA";

// BLOQUE 3 - EXTRACTOR REAL PDF 7 PROVINCIAS
//////////////////////////////////////////////////

function extraerRegistrosPDFV47(texto,pagina){

    texto = texto.toUpperCase();

    let fecha = detectarFechaV47(texto);
    let turno = detectarTurnoV47(texto);

    const provincias = [
        "CORRIENTES",
        "CIUDAD",
        "BONAERENSE",
        "SANTA FE",
        "CORDOBA",
        "ENTRE RIOS",
        "CHACO"
    ];

    let registros = [];

    for(let provincia of provincias){

        let pos = texto.indexOf(provincia);

        if(pos===-1) continue;

        let bloque = texto.substring(pos,pos+250);

        let numeros = bloque.match(/\b\d{4}\b/g);

        if(!numeros) continue;

        for(let numero of numeros){

            registros.push({

                fecha:fecha,
                turno:turno,
                provincia:provincia,
                numero:numero,
                pagina:pagina,
                premio:1,
                origen:"PDF_OCR_V47"

            });

        }

    }

    return registros;

}

let MEMORIA_V47 = {};
let MATRIZ_TURNOS_V47 = {};

async function construirMemoriaV47(){

    let datos = await leerV47(STORES_V47.historico);

    MEMORIA_V47 = {};

    for(let d of datos){

        if(!d.fecha || !d.turno || !d.provincia || !d.numero) continue;

        if(!MEMORIA_V47[d.fecha])
            MEMORIA_V47[d.fecha]={};

        if(!MEMORIA_V47[d.fecha][d.turno])
            MEMORIA_V47[d.fecha][d.turno]={};

        if(!MEMORIA_V47[d.fecha][d.turno][d.provincia])
            MEMORIA_V47[d.fecha][d.turno][d.provincia]=[];

        MEMORIA_V47[d.fecha][d.turno][d.provincia].push(String(d.numero));

    }

    return MEMORIA_V47;

}

async function construirMatrizTurnosV47(){

    await construirMemoriaV47();

    MATRIZ_TURNOS_V47={};

    const orden=[
        "PREVIA",
        "PRIMERA",
        "MATUTINA",
        "VESPERTINA",
        "NOCTURNA"
    ];

    for(let fecha in MEMORIA_V47){

        let dia=MEMORIA_V47[fecha];

        for(let i=0;i<orden.length;i++){

            let origen=orden[i];
            let destino=(i===4)?"PREVIA":orden[i+1];

            if(!dia[origen] || !dia[destino]) continue;

            for(let provincia in dia[origen]){

                if(!dia[destino][provincia]) continue;

                if(
                    !Array.isArray(dia[origen][provincia]) ||
                    !Array.isArray(dia[destino][provincia])
                ) continue;

                if(
                    dia[origen][provincia].length===0 ||
                    dia[destino][provincia].length===0
                ) continue;

                let base=String(dia[origen][provincia][0]).slice(-2);
                let salida=String(dia[destino][provincia][0]).slice(-2);

                if(!MATRIZ_TURNOS_V47[base])
                    MATRIZ_TURNOS_V47[base]={};

                if(!MATRIZ_TURNOS_V47[base][salida])
                    MATRIZ_TURNOS_V47[base][salida]=0;

                MATRIZ_TURNOS_V47[base][salida]++;

            }

        }

    }

    document.getElementById("estadoMatriz").innerText="ACTIVA";

    return MATRIZ_TURNOS_V47;

}

let NUCLEO_V47={


dominante:null,

segundo:null,

sobreviviente:null,

ranking:{}


};







async function analizarNucleoV47(){



let datos =
await leerV47(
STORES_V47.historico
);



let frecuencia={};





for(let d of datos){



if(!d.numero)

continue;



let n =
String(d.numero)
.slice(-2);




frecuencia[n]=
(frecuencia[n]||0)+1;



}





let ranking =
Object.keys(frecuencia)
.sort(

(a,b)=>

frecuencia[b]-frecuencia[a]

);






NUCLEO_V47.ranking=frecuencia;



NUCLEO_V47.dominante =
ranking[0] || null;



NUCLEO_V47.segundo =
ranking[1] || null;




for(let n of ranking){



if(
n!==NUCLEO_V47.dominante &&
n!==NUCLEO_V47.segundo
){


NUCLEO_V47.sobreviviente=n;


break;


}



}




return NUCLEO_V47;


    }

async function buscarAcompananteV47(base){

    base=String(base).slice(-2);

    let datos=await leerV47(STORES_V47.historico);

    let fuerza={};

    // Buscar acompañantes históricos
    for(let i=0;i<datos.length-1;i++){

        if(!datos[i].numero || !datos[i+1].numero) continue;

        let actual=String(datos[i].numero).slice(-2);
        let siguiente=String(datos[i+1].numero).slice(-2);

        if(actual!==base) continue;

        if(!fuerza[siguiente]){
            fuerza[siguiente]=0;
        }

        fuerza[siguiente]++;

    }

    let ranking=Object.keys(fuerza).sort(
        (a,b)=>fuerza[b]-fuerza[a]
    );

    // Si no encontró acompañantes,
    // usar los más frecuentes del historial
    if(ranking.length===0){

        let frecuencia={};

        for(let d of datos){

            if(!d.numero) continue;

            let n=String(d.numero).slice(-2);

            frecuencia[n]=(frecuencia[n]||0)+1;

        }

        ranking=Object.keys(frecuencia).sort(
            (a,b)=>frecuencia[b]-frecuencia[a]
        );

    }

    // Quitar el propio número
    ranking=ranking.filter(n=>n!==base);

    // Completar hasta tener 5 candidatos
    const respaldo=[
        "13","38","27","52","64",
        "91","45","70","82","19"
    ];

    for(let n of respaldo){

        if(ranking.length>=5) break;

        if(
            !ranking.includes(n) &&
            n!==base
        ){
            ranking.push(n);
        }

    }

    return ranking.slice(0,5);

}
