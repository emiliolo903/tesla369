// BASE DE DATOS

const DB_NAME = "EMI_TESLA_PRO_NUEVO";

const DB_VERSION = 1;



const STORES = {


historico:"historico",


memoriaIA:"memoriaIA",


predicciones:"predicciones",


aprendizaje:"aprendizaje",


simulaciones:"simulaciones",


motores:"motores"


};



let db = null;





// =================================
// ABRIR BASE
// =================================


function abrirBase(){


return new Promise((resolve,reject)=>{


let request =
indexedDB.open(
DB_NAME,
DB_VERSION
);



request.onupgradeneeded=function(e){


db=e.target.result;



Object.values(STORES)
.forEach(nombre=>{


if(!db.objectStoreNames.contains(nombre)){


db.createObjectStore(
nombre,
{
keyPath:"id",
autoIncrement:true
}
);


}



});



};






request.onsuccess=function(e){


db=e.target.result;



cambiarEstado(
"🟢 SISTEMA ACTIVO"
);



actualizarRegistros();



resolve(db);



};





request.onerror=function(){


cambiarEstado(
"🔴 ERROR BASE DE DATOS"
);



reject();



};





});



}






// =================================
// GUARDAR
// =================================


function guardarDato(
store,
dato
){



return new Promise((resolve,reject)=>{


let tx =
db.transaction(
store,
"readwrite"
);



let tabla =
tx.objectStore(store);



let solicitud =
tabla.add(dato);



solicitud.onsuccess=()=>{


resolve(true);


};



solicitud.onerror=()=>{


reject(false);


};



});



}







// =================================
// LEER
// =================================


function leerDatos(
store
){



return new Promise((resolve,reject)=>{


let tx =
db.transaction(
store,
"readonly"
);



let tabla =
tx.objectStore(store);



let solicitud =
tabla.getAll();



solicitud.onsuccess=()=>{


resolve(
solicitud.result
);



};



solicitud.onerror=()=>{


reject([]);

};



});



}

let TOTAL_OCR = 0;



async function procesarPDF(){


let archivo =
document.getElementById(
"archivoPDF"
).files[0];



if(!archivo){

alert("Seleccione un PDF");

return;

}



cambiarEstado(
"🟡 OCR PROCESANDO..."
);



let pdf =
await pdfjsLib.getDocument(
URL.createObjectURL(archivo)
).promise;



for(
let pagina=1;
pagina<=pdf.numPages;
pagina++
){



let page =
await pdf.getPage(pagina);



let viewport =
page.getViewport({
scale:2
});



let canvas =
document.createElement(
"canvas"
);



canvas.width =
viewport.width;


canvas.height =
viewport.height;



let ctx =
canvas.getContext(
"2d"
);



await page.render({

canvasContext:ctx,

viewport:viewport

}).promise;



let imagen =
canvas.toDataURL();



let texto =
await ejecutarOCR(
imagen
);



guardarTextoHistorico(
texto,
pagina
);



}



cambiarEstado(
"🟢 OCR COMPLETO"
);



actualizarRegistros();



}





async function ejecutarOCR(imagen){


let resultado =
await Tesseract.recognize(

imagen,

"spa"

);



return resultado.data.text;


}







async function guardarTextoHistorico(
texto,
pagina
){



let numeros =
texto.match(
/\b\d{2}\b/g
);



if(!numeros)
return;




numeros.forEach(async numero=>{


await guardarDato(

STORES.historico,

{


fecha:
new Date()
.toISOString(),


numero:numero,


pagina:pagina,


origen:"OCR"


}


);



TOTAL_OCR++;



});



}

 // =================================

let MATRIZ_TURNOS = {};

let MATRIZ_PROVINCIAS = {};

let MATRIZ_HISTORICA = {};




// =================================
// CONSTRUIR MEMORIA
// =================================


async function construirMemoria(){


let datos =
await leerDatos(
STORES.historico
);



MATRIZ_TURNOS={};

MATRIZ_PROVINCIAS={};

MATRIZ_HISTORICA={};



datos.forEach(d=>{


let numero =
d.numero;



if(!numero)
return;



// MATRIZ GENERAL


if(!MATRIZ_HISTORICA[numero]){

MATRIZ_HISTORICA[numero]=0;

}


MATRIZ_HISTORICA[numero]++;





// MATRIZ POR TURNO


let turno =
d.turno || "GENERAL";



if(!MATRIZ_TURNOS[turno]){

MATRIZ_TURNOS[turno]={};

}



if(!MATRIZ_TURNOS[turno][numero]){

MATRIZ_TURNOS[turno][numero]=0;

}



MATRIZ_TURNOS[turno][numero]++;







// MATRIZ POR PROVINCIA


let provincia =
d.provincia || "GENERAL";



if(!MATRIZ_PROVINCIAS[provincia]){

MATRIZ_PROVINCIAS[provincia]={};

}



if(!MATRIZ_PROVINCIAS[provincia][numero]){

MATRIZ_PROVINCIAS[provincia][numero]=0;

}



MATRIZ_PROVINCIAS[provincia][numero]++;



});

STORES.memoriaIA,

{

new Date()
.toISOString(),


turnos:MATRIZ_TURNOS,

);

);

}

let MOTORES = {


transicion:{
nombre:"Transición",
aciertos:0,
pruebas:0,
peso:0
},


historico:{
nombre:"Histórico",
aciertos:0,

pruebas:0,
peso:0
}


};





// =================================
// MOTOR TRANSICION
// =================================


function motorTransicion(numero){


return numero
.split("")
.reverse()
.join("");

}





// =================================
// MOTOR HISTORICO
// =================================


function motorHistorico(){


let lista =
Object.entries(
MATRIZ_HISTORICA
);



lista.sort(
(a,b)=>b[1]-a[1]
);



return lista[0]?.[0] || "00";


}





// =================================
// MOTOR ACOMPAÑANTE
// =================================


function motorAcompanante(numero){


if(!numero)
return "00";



return numero[1]+numero[0];


}






// =================================
// MOTOR TESLA
// =================================


function motorTesla(numero){



let tabla={


0:"00",

1:"00",

2:"57",

3:"80",

4:"69",

5:"27",

6:"49",

7:"52",

8:"30",

9:"34"


};



return tabla[numero[1]];



}






// =================================
// MOTOR MATRIZ
// =================================


function motorMatriz(){


return motorHistorico();


}






// =================================
// COMPETENCIA
// =================================


function competirMotores(numero){



return {


transicion:
motorTransicion(numero),



historico:
motorHistorico(),



acompanante:
motorAcompanante(numero),



tesla:
motorTesla(numero),



matriz:
motorMatriz()



};


}

// BLOQUE 7 - SIMULADOR HISTORICO
// =================================




async function simularHistorico(){



let datos =
await leerDatos(
STORES.historico
);



let resultados=[];



for(
let i=0;
i<datos.length-1;
i++
){



let anterior =
datos[i];



let real =
datos[i+1].numero;



let predicciones =
competirMotores(
anterior.numero
);





Object.entries(predicciones)
.forEach(([motor,prediccion])=>{


let estado =
evaluarResultado(
prediccion,
real
);



resultados.push({

motor:motor,

prediccion:prediccion,

real:real,

resultado:estado

});



});



}





await guardarDato(

STORES.simulaciones,

{


fecha:
new Date()
.toISOString(),


resultados:resultados


}

);





actualizarPesosMotores(
resultados
);



cambiarEstado(
"📊 SIMULACIÓN COMPLETA"
);



return resultados;



}







// =================================
// EVALUAR RESULTADO
// =================================


function evaluarResultado(
prediccion,
real
){



if(prediccion==real){

return "directo";

}




if(
prediccion
.split("")
.reverse()
.join("")
==
real
){

return "invertido";

}




if(
Math.abs(
parseInt(prediccion)
-
parseInt(real)
)
<=2
){

return "cerca";

}




return "fallo";

}







// =================================
// ACTUALIZAR PESOS
// =================================


function actualizarPesosMotores(datos){



datos.forEach(r=>{



let motor =
MOTORES[r.motor];



if(!motor)
return;



motor.pruebas++;




if(
r.resultado=="directo"
){

motor.aciertos+=2;

}



if(
r.resultado=="invertido"
){

motor.aciertos+=1;

}



if(
r.resultado=="cerca"
){

motor.aciertos+=0.5;

}




motor.peso =

(
motor.aciertos /
motor.pruebas
)
*100;



});



}
   // =================================
// EMI TESLA PRO NUEVO V1
// BLOQUE 8 - CEREBRO COMPETITIVO
// =================================



let MOTOR_ACTIVO = "";




// =================================
// CREAR RANKING
// =================================


function rankingMotores(){



let ranking =
Object.entries(MOTORES)
.map(([id,motor])=>{


return {


id:id,

nombre:motor.nombre,

peso:motor.peso,

aciertos:motor.aciertos,

pruebas:motor.pruebas


};


});





ranking.sort(
(a,b)=>b.peso-a.peso
);



return ranking;



}







// =================================
// ELEGIR MOTOR ACTIVO
// =================================


function elegirMotorActivo(){



let ranking =
rankingMotores();



if(!ranking.length)
return null;



MOTOR_ACTIVO =
ranking[0].id;



return MOTOR_ACTIVO;



}






// =================================
// EJECUTAR MOTOR GANADOR
// =================================


function ejecutarMotorActivo(numero){



let motor =
elegirMotorActivo();



let resultado;



switch(motor){



case "transicion":

resultado =
motorTransicion(numero);

break;



case "historico":

resultado =
motorHistorico();

break;



case "acompanante":

resultado =
motorAcompanante(numero);

break;



case "tesla":

resultado =
motorTesla(numero);

break;



case "matriz":

resultado =
motorMatriz();

break;



default:

resultado="00";


}



return {


motor:motor,

prediccion:resultado


};



}

break;



}





motor.peso =

(
motor.aciertos /
motor.pruebas

)
*100;



});







await guardarDato(

i<ambos.length-1;
i++

);
