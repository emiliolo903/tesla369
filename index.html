//////////////////////////////////////////////////
// EMI TESLA PRO V38
// BASE HISTORICA INDEXEDDB
//////////////////////////////////////////////////

const DB_NAME="EMI_TESLA_V38";

const DB_VERSION=1;

const STORE_NAME="historico";

let db=null;

let pararOCR=false;
 function abrirBase(){

return new Promise((resolve,reject)=>{


let request=indexedDB.open(
DB_NAME,
DB_VERSION
);



request.onupgradeneeded=function(e){


let base=e.target.result;



if(!base.objectStoreNames.contains(STORE_NAME)){


let tabla=base.createObjectStore(
STORE_NAME,
{
keyPath:"id",
autoIncrement:true
}
);



tabla.createIndex(
"provincia",
"provincia",
{unique:false}
);



tabla.createIndex(
"turno",
"turno",
{unique:false}
);



}


};




request.onsuccess=function(e){

db=e.target.result;

resolve(db);

};



request.onerror=function(e){

reject(e);

};



});


}






function guardarRegistro(datos){


return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readwrite"
);



let tabla=tx.objectStore(
STORE_NAME
);



tabla.add(datos);



tx.oncomplete=function(){

resolve(true);

};



tx.onerror=function(e){

reject(e);

};


});


}







function leerBase(){


return new Promise((resolve,reject)=>{


let tx=db.transaction(
STORE_NAME,
"readonly"
);



let tabla=tx.objectStore(
STORE_NAME
);



let datos=tabla.getAll();



datos.onsuccess=function(){

resolve(datos.result);

};



datos.onerror=function(e){

reject(e);

};



});


}






async function contarRegistros(){

let datos=await leerBase();

return datos.length;

}






function mostrar(texto){


document.getElementById(
"resultado"
).innerText=texto;


}





async function guardarManual(){

"numerosManual"
).value;



let provincia=document.getElementById(
"provinciaManual"
).value;



let turno=document.getElementById(
"turnoManual"
).value;



let numeros=texto.match(/\d{4}/g);



if(!numeros){

mostrar(
"⚠️ Ingrese números de 4 cifras"
);

return;

}




for(let numero of numeros){


await guardarRegistro({


fecha:new Date()
.toISOString()
.split("T")[0],


provincia,

turno,

numero,

origen:"MANUAL"


});


}




let total=await contarRegistros();



document.getElementById(
"total"
).innerText=total;



mostrar(

"✅ Datos guardados\n\n"+
"Registros: "+total

);


}



//////////////////////////////////////////////////
// OCR PDF HISTORICO
//////////////////////////////////////////////////


async function iniciarOCR(){


let archivo=document.getElementById(
"archivoPDF"
).files[0];



if(!archivo){

alert(
"Seleccione un PDF"
);

return;

}



try{


document.getElementById(
"estadoOCR"
).innerText="PROCESANDO";



let buffer=await archivo.arrayBuffer();



let pdf=await pdfjsLib.getDocument({

data:buffer

}).promise;



let worker=await Tesseract.createWorker(
"spa"
);
  for(let p=1;p<=pdf.numPages;p++){



if(pararOCR)

break;



let pagina=await pdf.getPage(p);



let viewport=pagina.getViewport({

scale:3

});



let canvas=document.createElement(
"canvas"
);



canvas.width=viewport.width;

canvas.height=viewport.height;



let ctx=canvas.getContext(
"2d"
);



await pagina.render({

canvasContext:ctx,

viewport

}).promise;




let lectura=await worker.recognize(
canvas
);



let texto=lectura.data.text.toUpperCase();



let numeros=texto.match(/\d{4}/g)||[];




let provincia=detectarProvincia(texto);



let turno=detectarTurno(texto);





for(let numero of numeros){


await guardarRegistro({


fecha:new Date()
.toISOString()
.split("T")[0],


provincia,

turno,

numero,

origen:"OCR"


});


}




document.getElementById(
"estadoOCR"
).innerText=

"Página "+p+" / "+pdf.numPages;



}




await worker.terminate();



let total=await contarRegistros();



document.getElementById(
"total"
).innerText=total;



mostrar(

"✅ OCR FINALIZADO\n\n"+
"Registros: "+total

);



}

catch(e){


mostrar(
"❌ Error OCR\n\n"+e
);


}



}



function detenerOCR(){

pararOCR=true;

}





function detectarProvincia(t){


if(t.includes("CORRIENTES"))
return "CORRIENTES";


if(t.includes("SANTA FE"))
return "SANTA FE";


if(t.includes("CORDOBA"))
return "CORDOBA";


if(t.includes("CHACO"))
return "CHACO";


if(t.includes("ENTRE RIOS"))
return "ENTRE RIOS";


if(t.includes("CIUDAD"))
return "CIUDAD";


if(t.includes("BONAERENSE"))
return "BONAERENSE";


return "DESCONOCIDA";


}





function detectarTurno(t){


if(t.includes("PREVIA"))
return "PREVIA";


if(t.includes("PRIMERA"))
return "PRIMERA";


if(t.includes("MATUTINA"))
return "MATUTINA";


if(t.includes("VESPERTINA"))
return "VESPERTINA";


if(t.includes("NOCTURNA"))
return "NOCTURNA";


return "DESCONOCIDO";


  }

async function generarJuegoCompletoIA(){

let datos=await leerBase();

if(datos.length<20){

mostrar("⚠️ Historial insuficiente");

return;

}

let provincia=
document.getElementById("provinciaManual").value;

let turnoActual=
document.getElementById("turnoManual").value;

let entrada=
document.getElementById("numerosManual").value
.match(/\d{4}/g)||[];

if(entrada.length===0){

mostrar("⚠️ Debe cargar primero las 7 agencias");

return;

}

const siguiente={
"PREVIA":"PRIMERA",
"PRIMERA":"MATUTINA",
"MATUTINA":"VESPERTINA",
"VESPERTINA":"NOCTURNA",
"NOCTURNA":"PREVIA"
};

let turnoDestino=
siguiente[turnoActual];

let bloques=[];

for(let i=0;i<datos.length-6;i++){

let bloque=datos.slice(i,i+7);

if(
bloque.every(x=>
x.provincia===provincia &&
x.turno===turnoActual
)
){

bloques.push({
base:bloque,
inicio:i
});

}

}

let candidatos=[];
//////////////////////////////////////////////////
// MOTOR IA V39
// PARTE 2
//////////////////////////////////////////////////

for(let item of bloques){

let bloque=item.base;

let similitud=0;

entrada.forEach(nuevo=>{

let ambosNuevo=nuevo.slice(-2);
let ternoNuevo=nuevo.slice(-3);

bloque.forEach(reg=>{

let numero=reg.numero;

if(numero===nuevo)
similitud+=100;

else if(numero.slice(-3)===ternoNuevo)
similitud+=25;

else if(numero.slice(-2)===ambosNuevo)
similitud+=10;

else if(numero[0]===nuevo[0])
similitud+=3;

else if(numero[3]===nuevo[3])
similitud+=2;

});

});

if(similitud>0){

candidatos.push({

inicio:item.inicio,

puntaje:similitud

});

}

}

candidatos.sort((a,b)=>b.puntaje-a.puntaje);

if(candidatos.length===0){

mostrar("⚠️ No se encontraron bloques históricos similares");

return;

}

let cuaternos={};
let ternos={};
let ambos={};
 //////////////////////////////////////////////////
// MOTOR IA V39
// PARTE 3
//////////////////////////////////////////////////

for(let candidato of candidatos){

let indice=candidato.inicio+7;

while(

indice<datos.length &&

datos[indice].provincia===provincia &&

datos[indice].turno===turnoDestino

){

let numero=datos[indice].numero;

let peso=candidato.puntaje;

cuaternos[numero]=
(cuaternos[numero]||0)+peso;

let terno=
numero.slice(-3);

ternos[terno]=
(ternos[terno]||0)+peso;

let amb=
numero.slice(-2);

ambos[amb]=
(ambos[amb]||0)+peso;

indice++;

}

}

function ordenar(obj){

return Object.keys(obj)
.sort((a,b)=>obj[b]-obj[a]);

}

let listaCuaternos=
ordenar(cuaternos);

let listaTernos=
ordenar(ternos);

let listaAmbos=
ordenar(ambos);
 //////////////////////////////////////////////////
// MOTOR IA V39
// PARTE 4 (FINAL)
//////////////////////////////////////////////////

let cuaternoPrincipal=listaCuaternos[0]||"--";
let cuaternoApoyo=listaCuaternos[1]||"--";

let ternoPrincipal=listaTernos[0]||"--";
let ternoApoyo=listaTernos[1]||"--";

let ambosPrincipal=listaAmbos[0]||"--";
let ambosApoyo=listaAmbos[1]||"--";

mostrar(`

🧠 EMI TESLA PRO V39

📍 Provincia
${provincia}

🔄 Predicción

${turnoActual}
➡
${turnoDestino}

🎯 CUATERNO PRINCIPAL

${cuaternoPrincipal}

🟡 CUATERNO APOYO

${cuaternoApoyo}

⚡ TERNO PRINCIPAL

${ternoPrincipal}

🟡 TERNO APOYO

${ternoApoyo}

💥 AMBOS PRINCIPAL

${ambosPrincipal}

🟡 AMBOS APOYO

${ambosApoyo}

📊 Bloques similares

${candidatos.length}

📚 Historial analizado

${datos.length}

`);

}

async function generarTeslaIA(){

let datos=await leerBase();


if(datos.length===0){

mostrar(
"⚠️ Sin datos históricos"
);

return;

}



let mapa={};



datos.forEach(r=>{

let ambos=r.numero.slice(-2);


mapa[ambos]=(mapa[ambos]||0)+1;


});



let ranking=Object.keys(mapa)
.sort((a,b)=>mapa[b]-mapa[a]);



mostrar(`

🚀 TESLA IA V38


💥 AMBOS PRINCIPAL

${ranking[0]||"--"}


🟡 AMBOS APOYO

${ranking[1]||"--"}


⚡ TERCERA OPCIÓN

${ranking[2]||"--"}


📊 DATOS

${datos.length}

`);

}

async function analizarMatriz(){

let datos=await leerBase();

if(datos.length<5){

mostrar("⚠️ No hay historial suficiente");

return;

}

let provincia=
document.getElementById("provinciaManual").value;

const ciclos={
"PREVIA":"PRIMERA",
"PRIMERA":"MATUTINA",
"MATUTINA":"VESPERTINA",
"VESPERTINA":"NOCTURNA",
"NOCTURNA":"PREVIA"
};

let salida="🌎 MATRIZ PROVINCIAL IA\n";
salida+="📍 "+provincia+"\n\n";

for(let origen in ciclos){

let destino=ciclos[origen];

let cuaternos={};
let ternos={};
let ambos={};

for(let i=0;i<datos.length-1;i++){

let actual=datos[i];
let siguiente=datos[i+1];

if(
actual.provincia===provincia &&
siguiente.provincia===provincia &&
actual.turno===origen &&
siguiente.turno===destino
){

let numero=siguiente.numero;

if(!/^\d{4}$/.test(numero))
continue;

cuaternos[numero]=(cuaternos[numero]||0)+1;

let t=numero.slice(-3);
ternos[t]=(ternos[t]||0)+1;

let a=numero.slice(-2);
ambos[a]=(ambos[a]||0)+1;

}

}

function mejor(obj){
return Object.keys(obj).sort((a,b)=>obj[b]-obj[a]);
}

let c=mejor(cuaternos);
let t=mejor(ternos);
let a=mejor(ambos);

salida+=
"🔄 "+origen+" ➜ "+destino+"\n";

salida+="Cuaterno: "+(c[0]||"--")+"\n";
salida+="Terno: "+(t[0]||"--")+"\n";
salida+="Ambos: "+(a[0]||"--")+"\n\n";

}

mostrar(salida);

}

mostrar("⚠️ Historial insuficiente");

return;

}

let provincia=
document.getElementById("provinciaManual").value;

"PREVIA":"PRIMERA",
"PRIMERA":"MATUTINA",

"VESPERTINA":"NOCTURNA",
"NOCTURNA":"PREVIA"
};

siguiente[turnoActual];

mostrar(`

🔄 TRANSICIÓN IA

Provincia:
${provincia}

Turno:

${turnoActual}

↓

${turnoDestino}


💥 Ambos Principal

${ranking[0]||"--"}


🟡 Ambos Apoyo

${ranking[1]||"--"}


⚡ Tercera Opción

${ranking[2]||"--"}


📊 Analizados

${Object.keys(frecuencia).length}

`);

}



async function buscarAcompananteV2(){

let entrada=document.getElementById(
"numerosManual"
).value.trim();


if(!/^\d{4}$/.test(entrada)){

mostrar(
"⚠️ Ingrese un cuaterno de 4 cifras"
);

return;

}


let datos=await leerBase();


let ambos=entrada.slice(-2);


let acompañantes={};


datos.forEach(r=>{


if(r.numero.slice(-2)===ambos){


let cabeza=r.numero.slice(0,2);


acompañantes[cabeza]=(acompañantes[cabeza]||0)+1;


}


});



let ranking=Object.keys(acompañantes)
.sort((a,b)=>acompañantes[b]-acompañantes[a]);



mostrar(`

🎯 ACOMPAÑANTE EXACTO IA


BASE:

${entrada}


AMBOS:

${ambos}


🔥 PRINCIPAL:

${ranking[0]||"--"}${ambos}


🟡 APOYO:

${ranking[1]||"--"}${ambos}

`);

}
