<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EMI Tesla PRO V27 STABLE</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body{
    font-family: Arial;
    background:#111;
    color:#fff;
    padding:15px;
}

button{
    padding:10px;
    margin:5px;
}

.box{
    border:1px solid #444;
    padding:10px;
    margin-top:10px;
    white-space:pre-wrap;
    max-height:300px;
    overflow:auto;
}
</style>
</head>

<body>

<h2>🚀 EMI Tesla PRO V27 - STABLE OCR</h2>

<input type="file" id="fileInput">

<br>

<button onclick="startOCR()">📄 OCR SEGURO</button>
<button onclick="buildDB()">🧠 Crear Base</button>
<button onclick="predict()">🔮 Predicción</button>
<button onclick="clearAll()">🧹 Limpiar</button>

<div class="box" id="status">Estado: listo</div>
<div class="box" id="log"></div>
<div class="box" id="out"></div>

<script>

//////////////////////////////
// 📦 DB
//////////////////////////////

let db = [];
let fullText = "";

//////////////////////////////
// ⚡ OCR SEGURO CON TIMEOUT
//////////////////////////////

async function startOCR(){

    const file = document.getElementById("fileInput").files[0];

    if(!file){
        log("⚠️ Subí una imagen");
        return;
    }

    document.getElementById("status").innerText = "🔄 Iniciando OCR...";

    let finished = false;

    // 🔥 TIMEOUT DE SEGURIDAD (evita cuelgue infinito)
    const timeout = setTimeout(()=>{
        if(!finished){
            document.getElementById("status").innerText =
                "⚠️ OCR lento → usando modo fallback";

            fallbackOCR(file);
        }
    }, 15000); // 15 segundos máximo inicio

    try {

        log("📄 Creando worker...");

        const worker = await Tesseract.createWorker("eng");

        await worker.loadLanguage("eng+spa");
        await worker.initialize("eng+spa");

        log("📄 Procesando imagen...");

        const result = await worker.recognize(file, {
            logger: m => {
                if(m.status === "recognizing text"){
                    document.getElementById("status").innerText =
                        "🔄 OCR: " + Math.round(m.progress*100) + "%";
                }
            }
        });

        finished = true;
        clearTimeout(timeout);

        fullText = result.data.text || "";

        await worker.terminate();

        document.getElementById("status").innerText = "✅ OCR COMPLETO";

        log("📄 Texto extraído: " + fullText.length + " chars");

    } catch (e) {

        finished = true;
        clearTimeout(timeout);

        log("❌ Error OCR → fallback activado");
        fallbackOCR(file);
    }
}

//////////////////////////////
// ⚡ FALLBACK OCR (SIMPLIFICADO)
//////////////////////////////

function fallbackOCR(file){

    const reader = new FileReader();

    reader.onload = e => {

        fullText = e.target.result;

        document.getElementById("status").innerText =
            "⚠️ Modo texto directo (fallback)";

        log("📄 Fallback cargado");
    };

    reader.readAsText(file);
}

//////////////////////////////
// 🧠 PARSER SIMPLE
//////////////////////////////

function buildDB(){

    if(!fullText){
        log("⚠️ Primero OCR");
        return;
    }

    const lines = fullText.split("\n");

    db = [];

    lines.forEach(l => {

        const nums = l.match(/\d{4}/g);
        const date = l.match(/\d{2}\/\d{2}\/\d{4}/)?.[0];

        if(nums){
            db.push({
                fecha: date || "sin fecha",
                numeros: nums
            });
        }
    });

    log("🧠 DB creada: " + db.length);
}

//////////////////////////////
// 🔮 PREDICCIÓN SIMPLE
//////////////////////////////

function predict(){

    if(db.length === 0){
        log("⚠️ Primero crear base");
        return;
    }

    let freq = {};

    db.forEach(d=>{
        d.numeros.forEach(n=>{
            freq[n] = (freq[n]||0)+1;
        });
    });

    let ranked = Object.entries(freq)
        .map(([num,score])=>({num,score}))
        .sort((a,b)=>b.score-a.score)
        .slice(0,10);

    let out = "🔮 AMBOS PRO V27\n\n";

    ranked.forEach(r=>{
        out += `${r.num} → ${r.score}\n`;
    });

    document.getElementById("out").innerText = out;
}

//////////////////////////////
// 🧹 LIMPIAR
//////////////////////////////

function clearAll(){
    db = [];
    fullText = "";
    document.getElementById("out").innerText="";
    document.getElementById("status").innerText="Estado: listo";
    log("🧹 limpio");
}

//////////////////////////////
// 🖥️ LOG
//////////////////////////////

function log(m){
    document.getElementById("log").innerText += "\n" + m;
}

</script>

</body>
</html>
